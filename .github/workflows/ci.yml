name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker compose --profile test build robot-core-test

      - name: Run tests
        run: docker compose --profile test run --rm robot-core-test
