services:
  robot-core:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-unknown}
        EDITION: ${EDITION:-community}
    container_name: robot-core
    ports:
      - "8000:8000"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      ROBOT_CORE_DB_PATH: /data/robot_core.db
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-generic}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3-4b-2507}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.4}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-320}
      ROBOT_QUIET_MINUTES: ${ROBOT_QUIET_MINUTES:-5}
      ROBOT_CRITICAL_BATTERY_THRESHOLD: ${ROBOT_CRITICAL_BATTERY_THRESHOLD:-20}
      ROBOT_RESPONSE_STYLE: ${ROBOT_RESPONSE_STYLE:-kurz, freundlich und präzise}
      ROBOT_EXPLAIN_ONLY_ON_REQUEST: ${ROBOT_EXPLAIN_ONLY_ON_REQUEST:-true}
      ROBOT_LLM_MAX_TOKENS: ${ROBOT_LLM_MAX_TOKENS:-320}
      ROBOT_GREETING_SUGGESTION_TEMPLATE: ${ROBOT_GREETING_SUGGESTION_TEMPLATE:-Kurze Begrüßung für {person_name} vorschlagen.}
      ROBOT_LLM_TIMEOUT_SECONDS: ${ROBOT_LLM_TIMEOUT_SECONDS:-45}
      ROBOT_DEFAULT_FRIENDLINESS: ${ROBOT_DEFAULT_FRIENDLINESS:-0.9}
      ROBOT_DEFAULT_HUMOR: ${ROBOT_DEFAULT_HUMOR:-0.65}
      ROBOT_DEFAULT_CURIOSITY: ${ROBOT_DEFAULT_CURIOSITY:-0.75}
      ROBOT_DEFAULT_TALKATIVENESS: ${ROBOT_DEFAULT_TALKATIVENESS:-0.45}
      ROBOT_DEFAULT_CAUTION: ${ROBOT_DEFAULT_CAUTION:-0.8}
      ROBOT_DEFAULT_DIRECTNESS: ${ROBOT_DEFAULT_DIRECTNESS:-0.7}
      ROBOT_DEFAULT_SARCASM: ${ROBOT_DEFAULT_SARCASM:-0.15}
      ROBOT_DEFAULT_PATIENCE: ${ROBOT_DEFAULT_PATIENCE:-0.85}
      ROBOT_TTS_PROVIDER: ${ROBOT_TTS_PROVIDER:-disabled}
      ROBOT_TTS_VOICE_LABEL: ${ROBOT_TTS_VOICE_LABEL:-}
      ROBOT_TTS_SPEED: ${ROBOT_TTS_SPEED:-1.0}
      ROBOT_TTS_SPEAKER_ID: ${ROBOT_TTS_SPEAKER_ID:-0}
      ROBOT_TTS_NUM_THREADS: ${ROBOT_TTS_NUM_THREADS:-2}
      ROBOT_TTS_VITS_MODEL: ${ROBOT_TTS_VITS_MODEL:-}
      ROBOT_TTS_TOKENS: ${ROBOT_TTS_TOKENS:-}
      ROBOT_TTS_DATA_DIR: ${ROBOT_TTS_DATA_DIR:-}
      ROBOT_TTS_LEXICON: ${ROBOT_TTS_LEXICON:-}
      ROBOT_TTS_RULE_FSTS: ${ROBOT_TTS_RULE_FSTS:-}
      ROBOT_HA_URL: ${ROBOT_HA_URL:-http://192.168.1.246:8123}
      ROBOT_HA_USERNAME: ${ROBOT_HA_USERNAME:-}
      ROBOT_HA_PASSWORD: ${ROBOT_HA_PASSWORD:-}
      ROBOT_HA_TOKEN: ${ROBOT_HA_TOKEN:-}
      ROBOT_CORS_ORIGINS: ${ROBOT_CORS_ORIGINS:-}
    volumes:
      - robot_core_data:/data
      - ./models:/models:ro
      - ./ssl:/ssl:ro
      - ./.git:/app/.git
      - ./update.flag:/update.flag
      - ./update.log:/update.log
      - ./reboot.flag:/reboot.flag
      - ./timezone.flag:/timezone.flag
      - ./hostname.flag:/hostname.flag
      - ./wlan.flag:/wlan.flag
      - ./ha-install.flag:/ha-install.flag
      - ./components.flag:/components.flag
      - ./edition:/app/edition
      - ./wifi-scan.json:/wifi-scan.json
      - ./host-ip.txt:/host-ip.txt
      - ./printer-start.flag:/printer-start.flag
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--ssl-keyfile", "/ssl/key.pem", "--ssl-certfile", "/ssl/cert.pem"]
    restart: unless-stopped

  anycubic-bridge:
    build:
      context: https://github.com/metheos/anycubic-s1-mqtt-bridge.git#main
    container_name: anycubic-bridge
    environment:
      ANYCUBIC_S1_IP:  ${ANYCUBIC_S1_IP:-}
      HA_BROKER:       ${ANYCUBIC_MQTT_HOST:-}
      HA_PORT:         ${ANYCUBIC_MQTT_PORT:-1883}
      HA_USER:         ${ANYCUBIC_MQTT_USER:-}
      HA_PASS:         ${ANYCUBIC_MQTT_PASS:-}
      SNAPSHOT_INTERVAL_IDLE: 120
      SNAPSHOT_INTERVAL_BUSY: 30
      INFO_UPDATE_INTERVAL: 30
    restart: unless-stopped
    profiles: ["printer"]

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    privileged: true
    volumes:
      - ./ha_config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Europe/Berlin}
    restart: unless-stopped
    profiles: ["ha"]

  robot-core-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: robot-core-test
    environment:
      ROBOT_CORE_DB_PATH: /tmp/robot_core_test.db
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-generic}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3-4b-2507}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.4}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-320}
      ROBOT_QUIET_MINUTES: ${ROBOT_QUIET_MINUTES:-5}
      ROBOT_CRITICAL_BATTERY_THRESHOLD: ${ROBOT_CRITICAL_BATTERY_THRESHOLD:-20}
      ROBOT_RESPONSE_STYLE: ${ROBOT_RESPONSE_STYLE:-kurz, freundlich und präzise}
      ROBOT_EXPLAIN_ONLY_ON_REQUEST: ${ROBOT_EXPLAIN_ONLY_ON_REQUEST:-true}
      ROBOT_LLM_MAX_TOKENS: ${ROBOT_LLM_MAX_TOKENS:-320}
      ROBOT_GREETING_SUGGESTION_TEMPLATE: ${ROBOT_GREETING_SUGGESTION_TEMPLATE:-Kurze Begrüßung für {person_name} vorschlagen.}
      ROBOT_LLM_TIMEOUT_SECONDS: ${ROBOT_LLM_TIMEOUT_SECONDS:-45}
      ROBOT_DEFAULT_FRIENDLINESS: ${ROBOT_DEFAULT_FRIENDLINESS:-0.9}
      ROBOT_DEFAULT_HUMOR: ${ROBOT_DEFAULT_HUMOR:-0.65}
      ROBOT_DEFAULT_CURIOSITY: ${ROBOT_DEFAULT_CURIOSITY:-0.75}
      ROBOT_DEFAULT_TALKATIVENESS: ${ROBOT_DEFAULT_TALKATIVENESS:-0.45}
      ROBOT_DEFAULT_CAUTION: ${ROBOT_DEFAULT_CAUTION:-0.8}
      ROBOT_DEFAULT_DIRECTNESS: ${ROBOT_DEFAULT_DIRECTNESS:-0.7}
      ROBOT_DEFAULT_SARCASM: ${ROBOT_DEFAULT_SARCASM:-0.15}
      ROBOT_DEFAULT_PATIENCE: ${ROBOT_DEFAULT_PATIENCE:-0.85}
      ROBOT_TTS_PROVIDER: ${ROBOT_TTS_PROVIDER:-disabled}
      ROBOT_TTS_VOICE_LABEL: ${ROBOT_TTS_VOICE_LABEL:-}
      ROBOT_TTS_SPEED: ${ROBOT_TTS_SPEED:-1.0}
      ROBOT_TTS_SPEAKER_ID: ${ROBOT_TTS_SPEAKER_ID:-0}
      ROBOT_TTS_NUM_THREADS: ${ROBOT_TTS_NUM_THREADS:-2}
      ROBOT_TTS_VITS_MODEL: ${ROBOT_TTS_VITS_MODEL:-}
      ROBOT_TTS_TOKENS: ${ROBOT_TTS_TOKENS:-}
      ROBOT_TTS_DATA_DIR: ${ROBOT_TTS_DATA_DIR:-}
      ROBOT_TTS_LEXICON: ${ROBOT_TTS_LEXICON:-}
      ROBOT_TTS_RULE_FSTS: ${ROBOT_TTS_RULE_FSTS:-}
      ROBOT_HA_URL: ${ROBOT_HA_URL:-http://192.168.1.246:8123}
      ROBOT_HA_USERNAME: ${ROBOT_HA_USERNAME:-}
      ROBOT_HA_PASSWORD: ${ROBOT_HA_PASSWORD:-}
      ROBOT_HA_TOKEN: ${ROBOT_HA_TOKEN:-}
      ROBOT_CORS_ORIGINS: ${ROBOT_CORS_ORIGINS:-}
    command: ["pytest", "tests", "-v", "--tb=short"]
    profiles: ["test"]

volumes:
  robot_core_data:
