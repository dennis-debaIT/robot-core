    'cleaning', 'segment_cleaning', 'zone_cleaning', 'spot_cleaning',
    'sweeping', 'mopping', 'washing', 'sweeping_and_mopping', 'sweeping_then_mopping',
  ]);

  const _ROOM_DE = {
    'Utility Room': 'Abstellraum', 'Corridor': 'Flur',
    'Dining Hall': 'Esszimmer',    'Living Room': 'Wohnzimmer',
    'Kitchen': 'Küche',            'Bathroom': 'Bad',
    'Bedroom': 'Schlafzimmer',     'Office': 'Büro',
  };
  let _selectedRooms = new Set();
  let _vacuumRooms   = [];
  let _mapTimer      = null;
  const _vacuumStats = {}; // slug → fertig gerendertes HTML

  let _vacuumMapExpandedFor = null;

  function _robotNameSlug(entityId) {
    return entityId.split('.')[1]; // "vacuum.krumel_knecht" → "krumel_knecht"
  }

  async function _loadVacuumSensors(slug) {
    try {
      const r = await fetch(`/ha/robots/${slug}/sensors`);
      return r.ok ? await r.json() : null;
    } catch { return null; }
  }

  function _parseVacuumRooms(selects) {
    const rooms = {};
    for (const [eid, d] of Object.entries(selects)) {
      const mN = eid.match(/room_(\d+)_name$/);
      if (mN) { rooms[mN[1]] = rooms[mN[1]] || {}; rooms[mN[1]].name = d.state; rooms[mN[1]].num = mN[1]; }
      const mO = eid.match(/room_(\d+)_order$/);
      if (mO) { rooms[mO[1]] = rooms[mO[1]] || {}; rooms[mO[1]].orderEid = eid; rooms[mO[1]].options = d.options || []; rooms[mO[1]].curOrder = d.state; }
      const mV = eid.match(/room_(\d+)_visibility$/);
      if (mV) { rooms[mV[1]] = rooms[mV[1]] || {}; rooms[mV[1]].visible = d.state !== 'invisible'; }
    }
    return Object.values(rooms).filter(r => r.visible !== false && r.name && r.orderEid)
                               .sort((a, b) => a.num - b.num);
  }

  let _vacuumMode   = null; // aktuell gewählter Modus-Schlüssel
  let _vacuumCycles = 1;   // Reinigungszyklen: 1, 2 oder 3

  // ── Vacuum-Konfiguration: Fallback-Defaults ──────────────
  // Werden durch robot.config aus der Admin-Datenbank überschrieben.
  const _DREAME_DEFAULTS = {
    rooms: [
      { id: 3, name: 'Abstellraum' }, { id: 4, name: 'Flur' },
      { id: 5, name: 'Esszimmer' },   { id: 6, name: 'Wohnzimmer' },
      { id: 7, name: 'Küche' },       { id: 8, name: 'Bad' },
    ],
    modes: [
      { key: 'sweeping',               label: '🧹 Nur saugen',              cleaning_mode_option: 'sweeping',               suction_level: 3, water_volume: 0 },
      { key: 'mopping',                label: '💧 Nur wischen',             cleaning_mode_option: 'mopping',                suction_level: 0, water_volume: 3 },
      { key: 'sweeping_and_mopping',   label: '🧹+💧 Saugen & Wischen',     cleaning_mode_option: 'sweeping_and_mopping',   suction_level: 3, water_volume: 3 },
      { key: 'mopping_after_sweeping', label: '🧹→💧 Wischen nach Saugen',  cleaning_mode_option: 'mopping_after_sweeping', suction_level: 3, water_volume: 3 },
    ],
    defaultMode: 'sweeping',
  };
  // Gibt die effektive Vacuum-Config zurück: DB-Config wenn vorhanden, sonst Defaults
  function _robotVacuumCfg(robot) {
    const cfg = robot?.config || {};
    const slug = _robotNameSlug(robot?.entity_id || '');
    return {
      rooms:       cfg.rooms?.length ? cfg.rooms : _DREAME_DEFAULTS.rooms,
      modes:       cfg.modes?.length ? cfg.modes : _DREAME_DEFAULTS.modes,
      defaultMode: cfg.default_mode  || _DREAME_DEFAULTS.defaultMode,
      mapCamera:   cfg.map_camera    || `camera.${slug}_map`,
      hasRooms:    !!(cfg.rooms?.length || slug.includes('krumel')),
    };
  }
  const _VAC_MODES = _DREAME_DEFAULTS.modes;

  function setVacuumMode(key) {
    _vacuumMode = key;
    document.querySelectorAll('.vac-mode-btn').forEach(b =>
      b.classList.toggle('selected', b.dataset.mode === key));
  }

  function setVacuumCycles(n) {
    _vacuumCycles = n;
    document.querySelectorAll('.vac-cycle-btn').forEach(b =>
      b.classList.toggle('selected', parseInt(b.dataset.cycles) === n));
  }

  function renderRobotDetailVacuum(robot) {
    const slug = _robotNameSlug(robot.entity_id);
    const vcfg = _robotVacuumCfg(robot);
    const curMode = _vacuumMode || vcfg.defaultMode;
    const modeBtns = vcfg.modes.map(m =>
      `<button class="room-btn vac-mode-btn${curMode === m.key ? ' selected' : ''}"
        data-mode="${m.key}" onclick="setVacuumMode('${m.key}')">${m.label}</button>`
    ).join('');

    // Räume: aus robot.config wenn vorhanden, sonst Defaults
    let roomsHtml = '';
    if (vcfg.hasRooms) {
      roomsHtml = vcfg.rooms.map(r => {
        const sel = _selectedRooms.has(String(r.id)) ? ' selected' : '';
        return `<button class="room-btn${sel}" data-room="${r.id}" onclick="toggleVacuumRoom('${r.id}')">${r.name}</button>`;
      }).join('') + `<button class="room-btn" onclick="toggleAllRooms()" style="border-style:dashed;">Alle</button>`;
    } else {
      roomsHtml = `<div id="vac-rooms-${slug}" style="display:flex;flex-wrap:wrap;gap:8px;"><div style="color:var(--muted);font-size:0.74rem;">Lade Räume…</div></div>`;
    }

    return `<div class="robot-detail-wrap">
      <div class="robot-detail-name">${robot.name}</div>
      <div id="vac-status-${slug}"><div style="color:var(--muted);font-size:0.74rem;">Lade…</div></div>
      <div>
        <div class="panel-label" style="margin-bottom:8px;">Modus</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">${modeBtns}</div>
        <div class="panel-label" style="margin-bottom:8px;">Zyklen</div>
        <div style="display:flex;gap:8px;margin-bottom:14px;">
          ${[1,2,3].map(n => `<button class="room-btn vac-cycle-btn${_vacuumCycles===n?' selected':''}" data-cycles="${n}" onclick="setVacuumCycles(${n})">${n}×</button>`).join('')}
        </div>
        <div class="panel-label" style="margin-bottom:8px;">Räume</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">${roomsHtml}</div>
      </div>
      <div class="robot-actions" id="vac-actions-${slug}" style="margin-top:4px;">
        <div style="color:var(--muted);font-size:0.74rem;">Lade Status…</div>
      </div>
      <div id="vac-feedback-${slug}" style="min-height:24px;font-size:0.76rem;margin-top:4px;"></div>
    </div>`;
  }

  function _formatCleaningTime(minutes) {
    const m = parseFloat(minutes);
    if (isNaN(m)) return `${minutes} Min`;
    const h = Math.floor(m / 60);
    const min = Math.round(m % 60);
    return h > 0 ? `${h} Std, ${min} Min` : `${min} Min`;
  }

  function _applyVacuumStats(slug) {
    const el = document.getElementById('vac-map-stats');
    if (el && _vacuumStats[slug]) el.innerHTML = _vacuumStats[slug];
  }

  async function _loadVacuumStats(slug, sensorSlug) {
    const ss = sensorSlug || slug;
    const _bad = new Set(['unavailable', 'unknown', '']);
    const _f = async (eid) => {
      try { const r = await fetch(`/ha/entity/${eid}/state`); return r.ok ? r.json() : null; }
      catch { return null; }
    };
    const [timeD, areaD] = await Promise.all([
      _f(`sensor.${ss}_total_cleaning_time`),
      _f(`sensor.${ss}_total_cleaned_area`),
    ]);
    const rows = [];
    if (timeD?.state && !_bad.has(timeD.state))
      rows.push(`<div class="robot-sensor-row"><span class="robot-sensor-label">Gesamtreinigungszeit</span><span class="robot-sensor-value">${_formatCleaningTime(timeD.state)}</span></div>`);
    if (areaD?.state && !_bad.has(areaD.state))
      rows.push(`<div class="robot-sensor-row"><span class="robot-sensor-label">Gereinigte Fläche gesamt</span><span class="robot-sensor-value">${parseFloat(areaD.state).toFixed(1)} ${areaD.unit || 'm²'}</span></div>`);
    if (rows.length) {
      _vacuumStats[slug] = `<div style="border-top:1px solid var(--border);padding-top:8px;">${rows.join('')}</div>`;
      _applyVacuumStats(slug);
    }
  }

  function _renderVacuumMap(slug, robot) {
    const camId = _robotVacuumCfg(robot).mapCamera || `camera.${slug}_map`;
    const extras = robot?.extras || {};
    const _bad = new Set(['unavailable', 'unknown', '']);
    const rows = [];
    const timeS = extras['total_cleaning_time'];
    const areaS = extras['total_cleaned_area'];
    if (timeS?.state && !_bad.has(timeS.state))
      rows.push(`<div class="robot-sensor-row"><span class="robot-sensor-label">Gesamtreinigungszeit</span><span class="robot-sensor-value">${_formatCleaningTime(timeS.state)}</span></div>`);
    if (areaS?.state && !_bad.has(areaS.state))
      rows.push(`<div class="robot-sensor-row"><span class="robot-sensor-label">Gereinigte Fläche gesamt</span><span class="robot-sensor-value">${parseFloat(areaS.state).toFixed(1)} ${areaS.unit || 'm²'}</span></div>`);
    const statsHtml = rows.length
      ? `<div id="vac-map-stats" style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px;">${rows.join('')}</div>`
      : `<div id="vac-map-stats"></div>`;
    return `<div style="padding:10px;">
      <img id="vac-map" class="vacuum-map-img clickable"
        src="${_mapUrl(camId)}"
        onclick="openVacuumMapOverlay('${robot.entity_id}')"
        onerror="this.src='/ha/cameras/${camId}/snapshot?_t=${Date.now()}';this.style.minHeight='120px';">
      ${statsHtml}
    </div>`;
  }

  function _renderVacuumMapExpanded(slug, robot) {
    const camId = _robotVacuumCfg(robot).mapCamera || `camera.${slug}_map`;
    const statsHtml = _vacuumStats[slug] || '<div id="vac-map-stats"></div>';
    return `<div class="vac-map-overlay">
      <div class="vac-map-overlay-header">
        <div class="vac-map-overlay-title">${robot?.name || 'Karte'} · Karte</div>
        <button class="vac-map-overlay-close" onclick="closeVacuumMapOverlay()">Zurück</button>
      </div>
      <div class="vac-map-overlay-body">
        <div class="vac-map-overlay-media">
          <img id="vac-map-expanded" src="${_mapUrl(camId)}"
            onerror="this.src='/ha/cameras/${camId}/snapshot?_t=${Date.now()}'">
        </div>
        <div class="vac-map-overlay-side">
          <div class="panel-label">Details</div>
          ${statsHtml}
        </div>
      </div>
    </div>`;

  function openVacuumMapOverlay(entityId) {
    const robot = (_robotsData || []).find(r => r.entity_id === entityId);
    if (!robot || robot.domain !== 'vacuum') return;
    const slug = _robotNameSlug(entityId);
    const overlay = document.getElementById('cal-overlay');
    if (!overlay) return;
    _vacuumMapExpandedFor = entityId;
    overlay.innerHTML = _renderVacuumMapExpanded(slug, robot);
    overlay.classList.add('active', 'vac-map-expanded');
    overlay.classList.remove('cam-detail-mode');
  }

  function closeVacuumMapOverlay() {
    const entityId = _vacuumMapExpandedFor || _selectedRobot;
    _vacuumMapExpandedFor = null;
    const robot = (_robotsData || []).find(r => r.entity_id === entityId);
    const overlay = document.getElementById('cal-overlay');
    if (!overlay || !robot) return;
    overlay.classList.remove('vac-map-expanded');
    overlay.innerHTML = renderRobotDetail(robot, null);
    overlay.classList.add('active');
    if (robot.domain === 'vacuum') {
      const slug = _robotNameSlug(robot.entity_id);
      _updateVacuumDetail(robot.entity_id, slug);
      _loadVacuumStats(slug, robot.sensor_slug);
    } else if (robot.domain === 'lawn_mower') {
      _loadAndRenderErrors(robot.entity_id);
    }

  // ── Karten-Refresh via MJPEG-Stream ──────────────────────
  // Der Browser hält die Verbindung offen und aktualisiert das Bild
  // intern ohne DOM-Manipulation → kein Flackern (wie HA selbst).
  function _mapUrl(camId) {
    return `/ha/cameras/${camId}/mjpeg`;
  }

  function _smoothImgUpdate(imgId, newUrl) {
    const img = document.getElementById(imgId);
    if (!img || img.src.endsWith(newUrl)) return;
    const preload = new window.Image();
    preload.onload  = () => { img.src = newUrl; };
    preload.onerror = () => {};
    preload.src = newUrl;
  }

  let _mapRefreshTimer = null;
  function _startMapRefresh(_slug) {}   // kein Polling nötig — MJPEG ist live
  function _stopMapRefresh() {
    clearInterval(_mapRefreshTimer);
    _mapRefreshTimer = null;
  }

  async function _updateVacuumDetail(entityId, slug) {
    const data = await _loadVacuumSensors(slug);
    if (!data) return;
    const { sensors, selects } = data;

    // Aufgelöster Sensor-Slug: bei vacuum.carsten_carsten liefert das Backend
    // Sensoren mit Prefix "carsten", nicht "carsten_carsten"
    const robot = (_robotsData || []).find(r => r.entity_id === entityId);
    const ss = robot?.sensor_slug || slug;

    // Status + Kontext-Buttons
    const rawState = (sensors[`sensor.${ss}_state`]?.state || '').toLowerCase();
    const stateLabel = _VAC_STATE_DE[rawState] || rawState || '–';
    const stateColor = _ROBOT_STATE_COLORS[rawState] || 'var(--muted)';
    const stateIcon  = _VAC_STATE_ICONS[rawState] || '';
    const stEl = document.getElementById(`vac-status-${slug}`);
    if (stEl) {
      const batt    = sensors[`sensor.${ss}_battery_level`]?.state;
      const battPct = batt != null ? parseInt(batt) : null;
      const bColor  = battPct == null ? 'var(--muted)' : battPct > 40 ? 'var(--success)' : battPct > 20 ? 'var(--warning)' : 'var(--danger)';
      const battHtml = battPct != null
        ? `<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
             <span style="font-size:0.78rem;font-weight:700;color:${bColor};">🔋 ${battPct}%</span>
             <div style="width:44px;height:5px;background:var(--border);border-radius:3px;">
               <div class="robot-battery-bar-fill" style="width:${battPct}%;height:100%;background:${bColor};border-radius:3px;"></div>
             </div>
           </div>`
        : '';

      const _bad = new Set(['unavailable','unknown','']);
      const isCleaning = _VAC_CLEANING.has(rawState);
      const curRoom  = sensors[`sensor.${ss}_current_room`]?.state || '';
      const progress = parseInt(sensors[`sensor.${ss}_cleaning_progress`]?.state || '0') || 0;
      const areaNow  = sensors[`sensor.${ss}_cleaned_area`]?.state || '';
      const timeNow  = sensors[`sensor.${ss}_cleaning_time`]?.state || '';
      const vcfg = _robotVacuumCfg(robot);
      // HA-Raumname → Config-Name: select.{slug}_room_N_name → vcfg.rooms[id].name
      const _haRoomMap = {};
      Object.entries(selects).forEach(([eid, s]) => {
        const m = eid.match(/_room_(\d+)_name$/);
        if (!m) return;
        const conf = vcfg.rooms.find(r => r.id === parseInt(m[1]));
        if (conf && s.state && !['unavailable','unknown'].includes(s.state))
          _haRoomMap[s.state.toLowerCase()] = conf.name;
      });
      const roomLabel = _haRoomMap[curRoom.toLowerCase()] || curRoom;
      let progressHtml = '';
      if (isCleaning && (roomLabel || progress > 0)) {
        const meta = [
          roomLabel ? `📍 ${roomLabel}` : '',
          !_bad.has(areaNow) ? `${parseFloat(areaNow).toFixed(1)} m²` : '',
          !_bad.has(timeNow) ? `${timeNow} Min` : '',
        ].filter(Boolean).join(' · ');
        progressHtml = `
          <div style="background:rgba(255,255,255,0.04);border-radius:8px;padding:7px 10px;margin-top:8px;">
            ${meta ? `<div style="font-size:0.71rem;color:var(--muted);margin-bottom:5px;">${meta}</div>` : ''}
            <div style="height:4px;background:var(--border);border-radius:2px;">
              <div style="width:${progress}%;height:100%;background:var(--success);border-radius:2px;transition:width 0.8s;"></div>
            </div>
          </div>`;
      }

      stEl.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;">
          <span class="robot-status-badge" style="color:${stateColor};border-color:${stateColor};">${stateIcon} ${stateLabel}</span>
          ${battHtml}
        </div>
        ${progressHtml}`;
    }
    // Buttons je Zustand aktualisieren
    const actsEl = document.getElementById(`vac-actions-${slug}`);
    if (actsEl) {
      const eid = `vacuum.${slug}`;
      const inBase   = _VAC_IN_BASE.has(rawState);
      const cleaning = _VAC_CLEANING.has(rawState);
      const paused   = rawState === 'paused';
      const returning = rawState === 'returning' || rawState === 'returning_to_wash' || rawState === 'returning_to_charge';
      let btns = '';
      if (inBase) {
        btns = `<button class="robot-action-btn" onclick="startVacuumCleaning('${eid}','${slug}')">▶ Starten</button>`;
      } else if (cleaning) {
        btns = `<button class="robot-action-btn" onclick="stopVacuumCleaning('${eid}')">⏸ Pause</button>
                <button class="robot-action-btn" onclick="vacuumReturnBase('${eid}')">🏠 Basis</button>`;
      } else if (paused) {
        btns = `<button class="robot-action-btn" onclick="startVacuumCleaning('${eid}','${slug}')">▶ Fortfahren</button>
                <button class="robot-action-btn" onclick="vacuumReturnBase('${eid}')">🏠 Basis</button>`;
      } else if (returning) {
        btns = `<button class="robot-action-btn" onclick="stopVacuumCleaning('${eid}')">⏸ Pause</button>`;
      } else {
        btns = `<button class="robot-action-btn" onclick="startVacuumCleaning('${eid}','${slug}')">▶ Starten</button>
                <button class="robot-action-btn" onclick="vacuumReturnBase('${eid}')">🏠 Basis</button>`;
      }
      actsEl.innerHTML = btns;
    }

    // Stats werden separat via _loadVacuumStats() geladen

    // Räume — nur beim ersten Laden befüllen
    const rmEl = document.getElementById(`vac-rooms-${slug}`);
    if (rmEl && !rmEl.querySelector('.room-btn[data-room]')) {
      const rooms = _parseVacuumRooms(selects);
      _vacuumRooms = rooms;
      _selectedRooms = new Set(rooms.filter(r => r.curOrder && r.curOrder !== '0').map(r => r.num));
      rmEl.innerHTML = rooms.map(r => {
        const label = _ROOM_DE[r.name] || r.name;
        const sel = _selectedRooms.has(r.num) ? ' selected' : '';
        return `<button class="room-btn${sel}" data-room="${r.num}" onclick="toggleVacuumRoom('${r.num}')">${label}</button>`;
      }).join('') + `<button class="room-btn" onclick="toggleAllRooms()" style="border-style:dashed;">Alle</button>`;
    }
  }

  function toggleVacuumRoom(num) {
    if (_selectedRooms.has(num)) _selectedRooms.delete(num);
    else _selectedRooms.add(num);
    document.querySelectorAll('.room-btn[data-room]').forEach(b =>
      b.classList.toggle('selected', _selectedRooms.has(b.dataset.room)));
  }

  function toggleAllRooms() {
    const robot = (_robotsData || []).find(r => r.entity_id === _selectedRobot);
    const all = _robotVacuumCfg(robot).rooms.map(r => String(r.id));
    const allSelected = all.every(n => _selectedRooms.has(n));
    _selectedRooms = allSelected ? new Set() : new Set(all);
    document.querySelectorAll('.room-btn[data-room]').forEach(b =>
      b.classList.toggle('selected', _selectedRooms.has(b.dataset.room)));
  }

  function _vacuumFeedback(slug, msg, type) {
    const el = document.getElementById(`vac-feedback-${slug}`);
    if (!el) return;
    const c = { success: 'var(--success)', error: 'var(--danger)', warning: 'var(--warning)' };
    el.style.color = c[type] || 'var(--text)';
    el.textContent = msg;
    setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 5000);
  }

  async function startVacuumCleaning(entityId, slug) {
    const robot = (_robotsData || []).find(r => r.entity_id === entityId);
    const vcfg = _robotVacuumCfg(robot);

    if (vcfg.hasRooms) {
      // Segment-Reinigung mit Dreame-Service
      const segmentIds = [..._selectedRooms].map(s => parseInt(s)).filter(n => !isNaN(n));
      if (segmentIds.length === 0) {
        _vacuumFeedback(slug, 'Bitte mindestens einen Raum auswählen.', 'warning');
        return;
      }
      const modeKey = _vacuumMode || vcfg.defaultMode;
      const mode = vcfg.modes.find(m => m.key === modeKey) || vcfg.modes[0];
      const roomNames = segmentIds.map(id => vcfg.rooms.find(r => r.id === id)?.name || id).join(', ');
      try {
        const r = await fetch('/ha/dreame/clean_segments', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            entity_id: entityId,
            segments: segmentIds,
            cleaning_mode_option: mode.cleaning_mode_option,
            suction_level: mode.suction_level,
            water_volume: mode.water_volume,
            cleaning_times: _vacuumCycles,
          }),
        });
        if (r.ok) _vacuumFeedback(slug, `Reinigung gestartet: ${roomNames}`, 'success');
        else       _vacuumFeedback(slug, 'Fehler beim Starten der Reinigung.', 'error');
      } catch {
        _vacuumFeedback(slug, 'Home Assistant nicht erreichbar.', 'error');
      }
    } else {
      // Generisch: vacuum.start
      await fetch(`/ha/robots/${entityId}/command`, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({command: 'start'}),
      }).catch(() => {});
    }
  }

  async function stopVacuumCleaning(entityId) {
    await fetch(`/ha/robots/${entityId}/command`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({command: 'pause'})
    }).catch(() => {});
  }

  async function vacuumReturnBase(entityId) {
    await fetch(`/ha/robots/${entityId}/command`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({command: 'return_to_base'})
    }).catch(() => {});
  }

  async function _loadAndRenderErrors(entityId) {
    try {
      const r = await fetch(`/ha/robots/${entityId}/errors`);
      const log = r.ok ? await r.json() : null;
      const el = document.getElementById('robot-err-list');
      if (!el || !log) return;
      const errEntries = log.entries || [];
      el.innerHTML = errEntries.length
        ? errEntries.map(e => {
            const t = _formatRobotErrorWhen(e.when);
            const cls = e.severity || (e.resolved ? 'ok' : 'error');
            return `<div class="robot-err-log-item">
              <span class="robot-err-time">${t}</span>
              <span class="robot-err-state ${cls}">${e.state}</span>
            </div>`;
          }).join('')
        : '<div style="color:var(--muted);font-size:0.74rem;">Keine letzten Status-Eintr&auml;ge gefunden</div>';
    } catch {}
  }

  async function showRobotsView() {
    const robots = await loadRobots();
    _renderRobotsView(robots);
    _robotsInterval = setInterval(async () => {
      if (_navMode !== 'robots') return;
      const r = await loadRobots();
      _renderRobotsView(r);

  let _robotOverlayRobot = null; // entity_id des aktuell gerenderten Overlays

  function _renderRobotsView(robots) {
    // Linkes Panel: immer aktualisieren (nur Text, kein Flash)
    document.getElementById('left-label').textContent = 'Roboter';
    const lc = document.getElementById('left-content');
    lc.style.overflowY = 'auto';
    lc.innerHTML = renderRobotList(robots || []);

    const robot = (robots || []).find(r => r.entity_id === _selectedRobot) || (robots || [])[0] || null;
    if (robot && !_selectedRobot) _selectedRobot = robot.entity_id;

    const overlay = document.getElementById('cal-overlay');
    if (!overlay || !robot) return;

    if (_vacuumMapExpandedFor && _vacuumMapExpandedFor === robot.entity_id && robot.domain === 'vacuum') {
      // Karte bereits sichtbar → nur Stats aktualisieren, Bild per Double-Buffer tauschen
      const slug = _robotNameSlug(robot.entity_id);
      // MJPEG-Stream aktualisiert sich selbst — kein manueller Refresh nötig
      // Stats aktualisieren ohne Overlay neu zu rendern
      const statsEl = overlay.querySelector('.vac-map-overlay-side');
      if (statsEl && robot.extras) {
        const _bad = new Set(['unavailable','unknown','']);
        const e = robot.extras || {};
        const rows = [];
        const tS = e['total_cleaning_time'];
        const aS = e['total_cleaned_area'];
        if (tS?.state && !_bad.has(tS.state))
          rows.push(`<div class="robot-sensor-row"><span class="robot-sensor-label">Gesamtreinigungszeit</span><span class="robot-sensor-value">${_formatCleaningTime(tS.state)}</span></div>`);
        if (aS?.state && !_bad.has(aS.state))
          rows.push(`<div class="robot-sensor-row"><span class="robot-sensor-label">Gereinigte Fläche gesamt</span><span class="robot-sensor-value">${parseFloat(aS.state).toFixed(1)} ${aS.unit || 'm²'}</span></div>`);
        const statsDiv = statsEl.querySelector('#vac-map-stats');
        if (statsDiv && rows.length) statsDiv.innerHTML = rows.join('');
      }
      overlay.classList.add('active', 'vac-map-expanded');
      return;
    }

    const isFirstRender = _robotOverlayRobot !== robot.entity_id;

    if (isFirstRender) {
      // Vollständig rendern — nur beim ersten Laden oder Roboterwechsel
      _robotOverlayRobot = robot.entity_id;
      overlay.innerHTML = renderRobotDetail(robot, null);
      overlay.classList.add('active');
      overlay.classList.remove('vac-map-expanded');
      if (robot.domain === 'lawn_mower') {
        _loadAndRenderErrors(robot.entity_id);
        setPanel('right', robot.name, renderRobotExtras(robot));
      } else if (robot.domain === 'vacuum') {
        const slug = _robotNameSlug(robot.entity_id);
        setPanel('right', 'Karte', _renderVacuumMap(slug, robot)); // erst rendern → vac-map-stats existiert
        _startMapRefresh(slug);
        _updateVacuumDetail(robot.entity_id, slug);          // dann Status/Räume
        _loadVacuumStats(slug, robot.sensor_slug);          // dann Stats
      } else {
        setPanel('right', robot.name || 'Sensoren', renderRobotExtras(robot));
      }
    } else {
      // Partial update — nur dynamische Teile, KEIN Overlay-Neurender
      if (robot.domain === 'lawn_mower') {
        // Nur Status-Badge und Batterie aktualisieren
        const badge = overlay.querySelector('.robot-status-badge');
        if (badge) {
          badge.textContent = _robotStateLabel(robot.state);
          badge.style.color = badge.style.borderColor = _robotStateColor(robot.state);
        }
        const _cb = _lastKnownBattery[robot.entity_id];
        const batt = robot.battery != null ? parseInt(robot.battery) : (_cb?.pct ?? null);
        if (batt != null) {
          const fill = overlay.querySelector('.robot-battery-bar-fill');
          const txt  = overlay.querySelector('.robot-battery-bar-wrap span');
          if (fill) fill.style.width = batt + '%';
          if (txt)  txt.textContent = `🔋 ${batt}%${robot.battery == null ? ' *' : ''}`;
        }
        setPanel('right', robot.name, renderRobotExtras(robot));
      } else if (robot.domain === 'vacuum') {
        const slug = _robotNameSlug(robot.entity_id);
        _updateVacuumDetail(robot.entity_id, slug);
        // Stats direkt aus robot.extras aktualisieren
        const statsEl = document.getElementById('vac-map-stats');
        if (statsEl) {
          const _bad = new Set(['unavailable','unknown','']);
          const e = robot.extras || {};
          const rows = [];
          const tS = e['total_cleaning_time'];
          const aS = e['total_cleaned_area'];
          if (tS?.state && !_bad.has(tS.state))
            rows.push(`<div class="robot-sensor-row"><span class="robot-sensor-label">Gesamtreinigungszeit</span><span class="robot-sensor-value">${_formatCleaningTime(tS.state)}</span></div>`);
          if (aS?.state && !_bad.has(aS.state))
            rows.push(`<div class="robot-sensor-row"><span class="robot-sensor-label">Gereinigte Fläche gesamt</span><span class="robot-sensor-value">${parseFloat(aS.state).toFixed(1)} ${aS.unit||'m²'}</span></div>`);
          if (rows.length) statsEl.innerHTML = rows.join('');
        }
      }
    }
  }

  function selectRobot(entityId) {
    _selectedRobot = entityId;
    _robotOverlayRobot = null; // erzwingt Vollrender für neuen Roboter
    _vacuumMapExpandedFor = null;
    _selectedRooms = new Set();
    clearInterval(_mapTimer);
    const robot = (_robotsData || []).find(r => r.entity_id === entityId);
    const overlay = document.getElementById('cal-overlay');

  // ── KLINGEL-ERKENNUNG (Doorbell → Kamera im Home-Screen) ──
  let _doorbellTimer = null;
  let _lastDoorbellChanged = null;
  let _doorbellLiveEntity = null;

  async function pollDoorbellState() {
    if (_navMode !== 'home' || currentMode !== 'idle') return;
    try {
      const d = await fetch('/ha/doorbell').then(r => r.json());
      if (_lastDoorbellChanged === null) {
        _lastDoorbellChanged = (d.doorbells || []).map(s => s.last_changed).join('|');
        return;
      }
      const currentKey = (d.doorbells || []).map(s => s.last_changed).join('|');
      if (currentKey === _lastDoorbellChanged) return;
      _lastDoorbellChanged = currentKey;
      const active = (d.doorbells || []).find(s => s.state === 'on');
      if (active) _showDoorbellCamera(active.entity_id);
    } catch {}
  }

  async function _showDoorbellCamera(doorbellEntityId) {
    const base = doorbellEntityId.replace('binary_sensor.', '').replace(/_ding$/, '');

    // Kamera suchen: zuerst in geladenen Daten, dann direkt aus HA
    let cameras = (_camerasData && _camerasData.length) ? _camerasData : (await loadCamerasData()) || [];

    // 1. Per konfiguriertem doorbell_sensor (systemunabhängig, kein Name-Matching)
    let cam = cameras.find(c => c.doorbell_sensor === doorbellEntityId);
    // 2. Fallback: Entity-ID-Namensähnlichkeit (ring-mqtt / native Ring Namenskonvention)
    if (!cam) cam = cameras.find(c => c.entity_id.includes(base));
    if (!cam) cam = cameras.find(c => c.entity_id === `camera.${base}_live_ansicht`);
    // 3. Letzter Ausweg: Kamera-Entity direkt aus Sensor-ID ableiten (auch ohne Admin-Konfiguration)
    if (!cam) cam = { entity_id: `camera.${base}_live_ansicht`, has_live_stream: true };

    const overlay = document.getElementById('doorbell-overlay');
    if (!overlay) return;

    const entityId = cam.entity_id;
    _doorbellLiveEntity = entityId;

    // Snapshot sofort zeigen
    const img = document.getElementById('doorbell-cam-img');
    if (img) img.src = _snapUrl(entityId);
    overlay.classList.add('active');

    // Auto-Schließen nach konfigurierter Dauer (default 30s)
    const doorbellDurationMs = ((cam.doorbell_duration ?? 30) * 1000);
    clearTimeout(_doorbellTimer);
    _doorbellTimer = setTimeout(() => _closeDoorbellOverlay(), doorbellDurationMs);

    // Live-Stream starten
    if (cam.has_live_stream !== false) {
      _startDoorbellLive(entityId);
    }
  }

  async function _startDoorbellLive(entityId) {
    try {
      const r = await fetch(`/ha/cameras/${entityId}/live/start`, { method: 'POST' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const { m3u8_url } = await r.json();

      // Overlay noch aktiv?
      const overlay = document.getElementById('doorbell-overlay');
      if (!overlay || !overlay.classList.contains('active')) {
        fetch(`/ha/cameras/${entityId}/live/stop`, { method: 'POST' }).catch(() => {});
        return;
      }

      // img durch video ersetzen
      const media = document.getElementById('doorbell-cam-media');
      if (!media) return;
      const video = document.createElement('video');
      video.id = 'doorbell-cam-video';
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;
      media.innerHTML = '';
      media.appendChild(video);
      _attachHlsDirect(video, m3u8_url);
    } catch {
      // Snapshot bleibt sichtbar — kein Fehler anzeigen
    }
  }

  function _closeDoorbellOverlay() {
    clearTimeout(_doorbellTimer);
    _doorbellTimer = null;
    const overlay = document.getElementById('doorbell-overlay');
    if (overlay) overlay.classList.remove('active');

    // Media-Container leeren, img wiederherstellen
    const media = document.getElementById('doorbell-cam-media');
    const video = document.getElementById('doorbell-cam-video');
    if (video && video._hls) { video._hls.destroy(); video._hls = null; }
    if (media) {
      media.innerHTML = '<img id="doorbell-cam-img" src="" alt="Kamera">';
    }

    if (_doorbellLiveEntity) {
      fetch(`/ha/cameras/${_doorbellLiveEntity}/live/stop`, { method: 'POST' }).catch(() => {});
      _doorbellLiveEntity = null;
    }
  }

  function _doorbellFullscreen() {
    const media = document.getElementById('doorbell-cam-media');
    const el = media?.querySelector('video') || media?.querySelector('img') || media;
    if (!el) return;
    (el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen)?.call(el);
  }

  async function callLightService(entity_id, service, brightness_pct, colorData) {
    const body = { entity_id, service };
    if (brightness_pct !== undefined && brightness_pct !== null) body.brightness_pct = brightness_pct;
    if (colorData?.hs_color) body.hs_color = colorData.hs_color;

    else if (colorData?.color_temp) body.color_temp = colorData.color_temp;
    try {
      await fetch('/ha/lights/control', {

  // Lampen-Icon mit optionaler Farbe aus rgb_color / color_temp_kelvin
  function _lightColor(light) {
    // Gibt Hex-Farbe (#rrggbb) zurück — kompatibel mit Hex-Alpha-Suffix (#rrggbbaa)
    const _toHex = (r, g, b) => '#' + [r,g,b].map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
    if (!light || light.state !== 'on') return null;
    if (light.rgb_color) {
      const [r, g, b] = light.rgb_color;
      return _toHex(r, g, b);
    }
    if (light.color_temp_kelvin) {
      const t = light.color_temp_kelvin / 100;
      const cr = t <= 66 ? 255 : Math.min(255, Math.max(0, Math.round(329.7 * Math.pow(t-60, -0.133))));
      const cg = t <= 66 ? Math.min(255,Math.max(0,Math.round(99.47*Math.log(t)-161.12)))
                         : Math.min(255,Math.max(0,Math.round(288.1*Math.pow(t-60,-0.076))));
      const cb = t >= 66 ? 255 : (t <= 19 ? 0 : Math.min(255,Math.max(0,Math.round(138.5*Math.log(t-10)-305.0))));
      return _toHex(cr, cg, cb);
    }
    return null;
  }

  function _bulbIcon(light, size = '1.3rem') {
    if (!light || light.state !== 'on') {
      return `<span style="font-size:${size};opacity:0.25;filter:grayscale(1);">💡</span>`;
    }
    const color = _lightColor(light);
    if (color) {
      const sz = parseFloat(size) * 1.55;
      return `<span style="
        display:inline-flex;align-items:center;justify-content:center;
        width:${sz}${size.replace(/[\d.]/g,'')};height:${sz}${size.replace(/[\d.]/g,'')};
        border-radius:50%;flex-shrink:0;
        background:${color}55;
        box-shadow:0 0 10px 4px ${color}bb, 0 0 20px 8px ${color}55;
        font-size:${size};">💡</span>`;
    }
    return `<span style="font-size:${size};">💡</span>`;
  }

  const bulbOn    = (l) => _bulbIcon(l, '1.3rem');
  const bulbOff   = ()  => `<span style="font-size:1.3rem;opacity:0.25;filter:grayscale(1);">💡</span>`;
  const bulbOnSm  = (l) => _bulbIcon(l, '1.1rem');
  const bulbOffSm = ()  => `<span style="font-size:1.1rem;opacity:0.25;filter:grayscale(1);">💡</span>`;

  function renderLightGroupsList(lights, selectedId) {

  async function turnAllOff() {
    if (!_lightsData) return;
    const memberIds = new Set(_lightsData.flatMap(l => l.members || []));
    const groups = _lightsData.filter(l => (l.is_group || !memberIds.has(l.entity_id)) && l.state === 'on');
    await Promise.all(groups.map(g =>
      fetch('/ha/lights/control', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entity_id: g.entity_id, service: 'turn_off' }),

    setTimeout(() => refreshLightsView(), 700);
  }

             onclick="selectLightGroup('${g.entity_id}')">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <div style="font-weight:800;font-size:0.92rem;white-space:nowrap;
                        overflow:hidden;text-overflow:ellipsis;">${g.name}</div>
            ${isOn ? bulbOnSm(g) : bulbOffSm()}
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div style="font-size:0.76rem;color:${isOn?'var(--warning)':'var(--muted)'};">
              ${isOn ? `EIN${g.brightness_pct?' · '+g.brightness_pct+'%':''}` : 'AUS'}
            </div>
            <div onclick="event.stopPropagation();callLightService('${g.entity_id}','toggle')"
                 style="width:42px;height:26px;border-radius:13px;flex-shrink:0;cursor:pointer;

                        border:1px solid ${isOn?'var(--warning)':'var(--border)'};
                        display:flex;align-items:center;

                        -webkit-tap-highlight-color:transparent;">

    html += '</div>';
    return html;

  // white:true → Weißton; kelvin = Zielwert (wird auf Lampen-Range geclampt)
  const _COLOR_PRESETS = [
    { label:'Warmweiß',   white:true,  kelvin:2700, ct:370, rgb:[255,174,90],  hs:[30.427,64.705] },
    { label:'Neutralweiß',white:true,  kelvin:4000, ct:250, rgb:[255,228,150] },
    { label:'Kaltweiß',   white:true,  kelvin:6500, ct:154, rgb:[200,220,255] },
    { label:'Rot',        white:false, ct:null,     rgb:[255,0,0]    },
    { label:'Orange',     white:false, ct:null,     rgb:[255,100,0]  },
    { label:'Gelb',       white:false, ct:null,     rgb:[255,220,0]  },
    { label:'Grün',       white:false, ct:null,     rgb:[0,200,50]   },
    { label:'Blau',       white:false, ct:null,     rgb:[0,100,255]  },
    { label:'Lila',       white:false, ct:null,     rgb:[150,0,255]  },
    { label:'Rosa',       white:false, ct:null,     rgb:[255,50,180] },
  ];

  function _rgbToHex(rgb) {
    if (!rgb) return '#ffffff';
    return '#' + rgb.map(v => ('0' + Math.max(0, Math.min(255, v)).toString(16)).slice(-2)).join('');
  }

  function _hsToRgb(h, s) {
    const c = s, x = c*(1-Math.abs((h/60)%2-1)), m = 1-c;
    let r,g,b;
    if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
    else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
    return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
  }

  function onColorWheelClick(ev, wheel, eid) {
    ev.stopPropagation();
    const rect = wheel.getBoundingClientRect();
    const cx = rect.width/2, cy = rect.height/2;
    const src = ev.changedTouches ? ev.changedTouches[0] : ev;
    const ex = src.clientX - rect.left - cx;
    const ey = src.clientY - rect.top  - cy;
    const r  = Math.sqrt(ex*ex + ey*ey);
    if (r > cx + 4) return;
    const hue = ((Math.atan2(ey, ex) * 180 / Math.PI) + 360) % 360;
    const sat = Math.min(1, r / cx);
    const rgb = _hsToRgb(hue, sat);
    const dot = document.getElementById('cw-dot-' + eid.replace(/[.\-]/g,'_'));
    if (dot) {
      dot.style.display = 'block';
      dot.style.left = (cx + ex) + 'px';
      dot.style.top  = (cy + ey) + 'px';
      dot.style.background = 'rgb(' + rgb.join(',') + ')';
    }
    callLightService(eid, 'turn_on', null, {rgb_color: rgb});
  }

  function _renderLightColors(light) {
    if (!light.supports_color && !light.supports_color_temp) return '';
    const eid  = light.entity_id;
    const safe = eid.replace(/[.\-]/g, '_');
    const isCT = light.color_mode === 'color_temp';

    let dots = '';
    for (const c of _COLOR_PRESETS) {
      if (c.white  && !light.supports_color_temp && !light.supports_color) continue;
      if (!c.white && !light.supports_color) continue;

      let colorArg, active = false;
      if (c.white && light.supports_color_temp) {
        // Lampe versteht color_temp → Kelvin-Wert verwenden, auf Lampen-Range clampen
        const minK = light.min_color_temp_kelvin || 2000;
        const maxK = light.max_color_temp_kelvin || 6500;
        const k = Math.max(minK, Math.min(maxK, c.kelvin));
        colorArg = '{color_temp_kelvin:' + k + '}';
        if (light.color_mode === 'color_temp' && light.color_temp_kelvin)
          active = Math.abs(light.color_temp_kelvin - k) < 200;
      } else if (c.hs) {
        // Preset hat exakte HS-Werte → direkt senden, kein Konversionsfehler
        colorArg = '{hs_color:[' + c.hs.join(',') + ']}';
        if (light.hs_color)
          active = Math.abs(light.hs_color[0]-c.hs[0]) < 5
                && Math.abs(light.hs_color[1]-c.hs[1]) < 5;
      } else {
        colorArg = '{rgb_color:[' + c.rgb.join(',') + ']}';
        if (light.rgb_color)
          active = Math.abs(light.rgb_color[0]-c.rgb[0]) < 50
                && Math.abs(light.rgb_color[1]-c.rgb[1]) < 50
                && Math.abs(light.rgb_color[2]-c.rgb[2]) < 50;
      }
      const bdr = active ? '3px solid #fff'                    : '3px solid transparent';
      const shd = active ? '0 0 0 2px rgba(255,255,255,0.7)'  : '0 0 0 1px rgba(255,255,255,0.15)';
      const curBri = (light.state === 'on' && light.brightness_pct) ? light.brightness_pct : null;
      dots += '<div onclick="callLightService(\'' + eid + '\',\'turn_on\',' + curBri + ',' + colorArg + ')"'
            + ' title="' + c.label + '"'
            + ' style="width:38px;height:38px;border-radius:50%;background:' + _rgbToHex(c.rgb) + ';cursor:pointer;'
            + 'flex-shrink:0;border:' + bdr + ';box-shadow:' + shd + ';transition:transform 0.1s;"'
            + ' onmouseover="this.style.transform=\'scale(1.12)\'"'
            + ' onmouseout="this.style.transform=\'scale(1)\'"></div>';
    }

    // Color Wheel
    const wheel = light.supports_color
      ? '<div style="margin-top:16px;">'
        + '<div style="font-size:0.62rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:8px;">FARB-RAD</div>'
        + '<div style="position:relative;width:160px;height:160px;border-radius:50%;cursor:crosshair;margin:0 auto;'
        + 'background:conic-gradient(hsl(0,100%,50%),hsl(60,100%,50%),hsl(120,100%,50%),'
        + 'hsl(180,100%,50%),hsl(240,100%,50%),hsl(300,100%,50%),hsl(360,100%,50%));'
        + 'box-shadow:0 0 0 2px var(--border);"'
        + ' onclick="onColorWheelClick(event,this,\'' + eid + '\')"'
        + ' ontouchend="onColorWheelClick(event,this,\'' + eid + '\')">'
        + '<div style="position:absolute;inset:0;border-radius:50%;pointer-events:none;'
        + 'background:radial-gradient(circle,rgba(255,255,255,1) 0%,rgba(255,255,255,0) 72%);"></div>'
        + '<div id="cw-dot-' + safe + '" style="position:absolute;width:14px;height:14px;'
        + 'border-radius:50%;border:2px solid #fff;box-shadow:0 0 5px rgba(0,0,0,0.7);'
        + 'transform:translate(-50%,-50%);pointer-events:none;display:none;top:50%;left:50%;"></div>'
        + '</div></div>'
      : '';

    // Aktuelle Farbe aus Entität anzeigen
    let currentColorHtml = '';
    if (light.state === 'on') {
      const hex = _lightColor(light);
      if (hex) {
        const isCT = light.color_mode === 'color_temp' && light.color_temp_kelvin;
        const label = isCT
          ? (light.color_temp_kelvin <= 2800 ? 'Warmweiß' : light.color_temp_kelvin <= 4000 ? 'Neutralweiß' : 'Kaltweiß')
          : 'Aktuelle Farbe';
        const value = isCT
          ? '<span style="color:var(--text);font-weight:700;">' + light.color_temp_kelvin + ' K</span>'
          : '<span style="color:var(--text);font-weight:700;">' + hex.toUpperCase() + '</span>';
        currentColorHtml = '<div style="display:flex;align-items:center;gap:8px;margin-top:14px;justify-content:center;">'
          + '<div style="width:20px;height:20px;border-radius:50%;background:' + hex + ';border:2px solid rgba(255,255,255,0.25);flex-shrink:0;"></div>'
          + '<span style="font-size:0.72rem;color:var(--muted);">' + label + ': ' + value + '</span>'
          + '</div>';
      }
    }

    return '<div style="margin-top:18px;text-align:left;">'
         + '<div style="font-size:0.62rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:10px;">FARBE</div>'
         + '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">' + dots + '</div>'
         + wheel
         + currentColorHtml
         + '</div>';
  }

  function renderLightCenter(light) {
    if (!light) return '<div class="cal-placeholder">Kein Raum gewählt</div>';
    const isOn = light.state === 'on';
    const sliderVal = isOn ? (light.brightness_pct || 100) : 0;
    const sliderLabel = isOn ? sliderVal + '%' : 'Aus';
    const lc = isOn ? _lightColor(light) : null;
    const lcStyle = lc ? `box-shadow:0 0 30px 10px ${lc}99, 0 0 60px 20px ${lc}44, inset 0 0 20px ${lc}22;border-color:${lc}88;` : '';
    return `
      <div style="text-align:center;padding:20px 0 10px;">
        <div style="font-size:0.65rem;color:var(--accent);letter-spacing:0.13em;margin-bottom:14px;">
          ${light.name.toUpperCase()}
        </div>
        <div class="light-onoff-btn ${isOn?'on':''}"
             style="${lcStyle}"
             onclick="callLightService('${light.entity_id}','toggle')">
          ${isOn ? '💡' : '<span style="opacity:0.3;filter:grayscale(1);">💡</span>'}
        </div>
        <div style="font-size:0.9rem;font-weight:700;margin-bottom:20px;
                    color:${isOn?'var(--warning)':'var(--muted)'};">
          ${isOn ? 'EIN' : 'AUS'}
        </div>
        ${light.supports_brightness ? `
        <div class="light-slider-wrap">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.7rem;
                      color:var(--muted);margin-bottom:8px;">
            <span>Aus</span>
            <span id="slider-label" style="font-size:0.82rem;font-weight:700;color:var(--text);">${sliderLabel}</span>
            <span>100%</span>
          </div>
          <input type="range" class="light-slider" min="0" max="100"
                 value="${sliderVal}"
                 oninput="document.getElementById('slider-label').textContent=this.value>0?this.value+'%':'Aus'"
                 onchange="onSliderChange('${light.entity_id}',parseInt(this.value))">
        </div>` : ''}
        ${_renderLightColors(light)}
      </div>`;
  }

  function onSliderChange(entity_id, val) {
    if (val === 0) {
      callLightService(entity_id, 'turn_off');
    } else {
      callLightService(entity_id, 'turn_on', val);
    }
  }

  function renderLightLamps(light, allLights) {
    if (!light?.is_group || !light.members?.length) return '';
    const members = allLights.filter(l => light.members.includes(l.entity_id));
    if (!members.length) return '';
    let html = `<div style="font-size:0.62rem;color:var(--muted);letter-spacing:0.1em;margin-bottom:8px;">EINZELNE LAMPEN</div>`;
    html += members.map(m => {
      const isOn = m.state === 'on';
      return `
        <div class="light-lamp-row">
          ${isOn ? bulbOnSm(m) : bulbOffSm()}
          <div style="flex:1;font-size:0.82rem;font-weight:600;">${m.name}</div>
          ${isOn && m.brightness_pct ? `<span style="font-size:0.74rem;color:var(--muted);">${m.brightness_pct}%</span>` : ''}
          <div onclick="callLightService('${m.entity_id}','toggle')"
               style="width:36px;height:22px;border-radius:11px;cursor:pointer;
                      background:${isOn?'var(--warning)':'var(--surface)'};
                      border:1px solid ${isOn?'var(--warning)':'var(--border)'};
                      display:flex;align-items:center;
                      padding:${isOn?'0 3px 0 13px':'0 13px 0 3px'};">
            <div style="width:16px;height:16px;border-radius:50%;background:${isOn?'#fff':'var(--muted)'}"></div>
          </div>
        </div>`;
    }).join('');
    return html;
  }

  async function showLightsView() {
    const lights = await loadLightsData();
    if (!lights) return;
    // Start immer mit Alle-Gruppen-Übersicht
    _selectedGroup = null;
    renderLightsView(lights);
  }

  function renderLightsView(lights) {
    if (!lights) return;
    // Alle Entities, die Kinder anderer Gruppen sind, ausblenden auf Top-Level
    const memberIds = new Set(lights.flatMap(l => l.members || []));
    // Top-Level: Gruppen + ausgewählte Einzelentitäten, die nicht Mitglied einer Gruppe sind.
    const groups = lights.filter(l => l.is_group || !memberIds.has(l.entity_id));
    const selected = _selectedGroup ? lights.find(l => l.entity_id === _selectedGroup) : null;

    // Links: Gruppen + Schalter (scrollbar)
    document.getElementById('left-label').textContent = 'Räume';
    const leftContent = document.getElementById('left-content');
    leftContent.style.overflowY = 'auto';
    leftContent.innerHTML = renderLightGroupsList(lights, _selectedGroup);

    // Fixer Szenen-Button im Footer
    const leftFooter = document.getElementById('left-footer');
    if (leftFooter) {
      const scenesSel = _lightsShowScenes ? 'var(--accent)' : 'var(--muted)';
      leftFooter.innerHTML = `
        <div onclick="openLightScenes()"
             style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;
                    border-top:1px solid var(--border);
                    background:${_lightsShowScenes ? 'rgba(150,0,255,0.08)' : 'transparent'};
                    color:${scenesSel};font-size:0.84rem;font-weight:700;
                    transition:background 0.15s;">
          <span style="font-size:1.1rem;">🎬</span> Szenen
        </div>`;
    }

    // Mitte: Overlay — bei offenem Szenen-Menü KEIN Rebuild (Input-Text bleibt erhalten)
    const overlay = document.getElementById('cal-overlay');
    if (overlay) {
      if (_lightsShowScenes) {
        // Overlay nur einmalig bauen — kein Refresh während User tippt
      } else if (!selected) {
        overlay.innerHTML = renderAllGroupsCenter(groups);
        overlay.classList.add('active');
      } else {
        overlay.innerHTML = renderLightCenter(selected);
        overlay.classList.add('active');
      }
    }

    // Rechts: Einzellampen der gewählten Gruppe (oder leer)
    if (!_lightsShowScenes && selected?.is_group) {
      setPanel('right', selected.name, renderLightLamps(selected, lights));
    } else if (!_lightsShowScenes) {
      setPanel('right', 'Lampen', '<div class="cal-placeholder">Gruppe auswählen</div>');
    }
  }

  async function openLightScenes() {
    _lightsShowScenes = true;
    _selectedGroup = null;
    const leftContent = document.getElementById('left-content');
    if (leftContent) leftContent.innerHTML = renderLightGroupsList(_lightsData || [], null);
    await renderScenesOverlay();
    setPanel('right', 'Szenen', '<div class="cal-placeholder">Szene wählen oder speichern</div>');
  }

  function selectLightGroup(entityId) {
    _lightsShowScenes = false;
    _selectedGroup = entityId;
    refreshLightsView();
  }

  async function renderScenesOverlay() {
    const overlay = document.getElementById('cal-overlay');
    if (!overlay) return;
    overlay.classList.add('active');
    overlay.innerHTML = '<div style="color:var(--muted);font-size:0.8rem;padding:20px;text-align:center;">Lade…</div>';
    let scenes = [];
    try {
      const r = await fetch('/ha/lights/scenes', { cache: 'no-store' });
      if (r.ok) scenes = (await r.json()).scenes || [];
    } catch {}

    const sceneList = scenes.length ? scenes.map(s => `
      <div style="display:flex;align-items:center;gap:10px;background:var(--surface2);
                  border:1px solid var(--border);border-radius:12px;padding:12px 14px;">
        <button onclick="applyLightScene(${s.id})"
          style="flex:1;text-align:left;background:none;border:none;color:var(--text);
                 font-size:0.88rem;font-weight:700;cursor:pointer;padding:0;">
          🎬 ${escapeHTML(s.name)}
        </button>
        <button onclick="deleteLightScene(${s.id}, this)"
          style="background:none;border:1px solid rgba(255,61,61,0.35);border-radius:8px;
                 color:var(--danger);font-size:0.8rem;padding:4px 10px;cursor:pointer;">
          🗑
        </button>
      </div>`).join('') :
      '<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:8px 0;">Noch keine Szenen gespeichert.</div>';

    overlay.innerHTML = `
      <div style="padding:4px 0 18px;">
        <div style="font-size:0.62rem;color:var(--accent);letter-spacing:0.13em;margin-bottom:12px;">SZENEN</div>
        <div style="font-size:0.76rem;color:var(--muted);line-height:1.55;margin-bottom:18px;
                    background:rgba(150,0,255,0.07);border:1px solid rgba(150,0,255,0.2);
                    border-radius:10px;padding:10px 14px;">
          Stelle alle Lampen so ein wie es in der Szene aussehen soll — auch welche aus sein sollen.
          Gib der Szene dann einen Namen und speichere sie.
          Beim Abrufen werden alle Lampen auf den gespeicherten Zustand gesetzt.
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">${sceneList}</div>
        <div style="display:flex;gap:10px;align-items:center;">
          <input id="scene-name-input" type="text" placeholder="Szenenname (z.B. Filmabend)"
            style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
                   padding:10px 14px;color:var(--text);font-size:0.84rem;"
            onkeydown="if(event.key==='Enter')saveLightScene()">
          <button onclick="saveLightScene()"
            style="background:rgba(150,0,255,0.15);border:1px solid rgba(150,0,255,0.5);
                   color:#c87fff;border-radius:10px;padding:10px 18px;font-size:0.82rem;
                   font-weight:800;cursor:pointer;">
            Speichern
          </button>
        </div>
      </div>`;
  }

  async function saveLightScene() {
    const input = document.getElementById('scene-name-input');
    const name = (input?.value || '').trim();
    if (!name) { input?.focus(); return; }
    const lights = _lightsData || [];
    const states = lights.map(l => ({
      entity_id: l.entity_id,
      state: l.state,
      brightness_pct: l.brightness_pct || null,

  async function _pollNotifications() {
    try {
      const r = await fetch('/notifications/count', { cache: 'no-store' });
      if (!r.ok) return;
      const { unread } = await r.json();
      const btn   = document.getElementById('sb-notif-btn');
      const badge = document.getElementById('sb-notif-badge');
      if (!btn || !badge) return;
      if (unread > 0) {
        btn.style.display = '';
        badge.style.display = '';
        badge.textContent = unread > 9 ? '9+' : String(unread);
      } else {
        badge.style.display = 'none';
        if (!_notifOverlayOpen) btn.style.display = 'none';
      }
      // Neue Benachrichtigung → TTS
      if (unread > _notifLastCount && _notifLastCount >= 0) {
        const diff = await fetch('/notifications?unread_only=true', { cache: 'no-store' })
          .then(r => r.json()).catch(() => ({ notifications: [] }));
        const newest = (diff.notifications || [])[0];
        if (newest) {
          _playNotificationTts(newest.message);
          if (btn.animate) btn.animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}], {duration:400,iterations:2});
        }
      }
      _notifLastCount = unread;
    } catch {}
  }

  // ── Wake Word + Gesichtserkennung ─────────────────────────
  let _attentionConfig = { wake_word_enabled: false, wake_word: 'erika', face_recognition_enabled: false };
  let _wakeRec = null;
  let _wakeActive = false;
  let _faceVideo = null;
  let _faceLoopTimer = null;
  let _faceMatcher = null;
  let _lastFacePerson = null;
  const _FACEAPI_CDN   = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js';
  const _FACEAPI_MODELS = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights';
  let _faceApiReady = false;

  async function _loadAttentionConfig() {
    try {
      const r = await fetch('/local-admin/integrations/config').then(r => r.json());
      const att = (r.config || r).attention || {};
      _attentionConfig = { ..._attentionConfig, ...att };
    } catch {}
    if (_attentionConfig.wake_word_enabled) _startWakeWord();
    if (_attentionConfig.face_recognition_enabled) _startFaceRecognition();
  }

  // ── Wake Word ──────────────────────────────────────────────
  let _wakeWordPending  = false;
  let _wakeLastActivity = 0;  // Heartbeat gegen stuck _wakeActive

  function _startWakeWord() {
    if (_wakeActive) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    _wakeActive = true;
    _wakeRec = new SR();
    _wakeRec.lang = 'de-DE';
    _wakeRec.continuous = true;   // Eine lange Session statt vieler kurzer → kein Mikro-Cycling
    _wakeRec.interimResults = true;
    _wakeRec.maxAlternatives = 1;
    _wakeRec.onresult = (e) => {
      _wakeLastActivity = Date.now(); // Heartbeat aktualisieren
      const word = (_attentionConfig.wake_word || 'erika').toLowerCase();
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const text = (e.results[i][0]?.transcript || '').toLowerCase();
        if (!text.includes(word)) continue;
        // "Erika stop/halt/abbruch" → TTS abbrechen, nicht zuhören
        if (/\b(stop|halt|abbruch|abbrechen|aufhören|aufhoeren|ruhig|leise)\b/.test(text)) {
          _onWakeStop(); break;
        }
        _onWakeDetected(); break;
      }
    };
    _wakeRec.onend = () => {
      // Nur neu starten wenn nicht absichtlich gestoppt und kein Hauptmikro aktiv
      if (_wakeActive && !_listening) {
        setTimeout(() => { try { _wakeRec.start(); } catch {} }, 1000);
      }
    };
    _wakeRec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        _wakeActive = false;
        _wakeWordPending = true;
      } else if (e.error !== 'no-speech') {
        // Alle anderen Fehler: Session als tot markieren → Watchdog startet neu
        _wakeActive = false;
      }
    };
    _wakeLastActivity = Date.now();
    try {
      _wakeRec.start();
    } catch {
      _wakeActive = false;
      _wakeWordPending = true;
    }
  }

  function _stopWakeWord() {
    _wakeActive = false;
    _wakeWordPending = false;
    try { _wakeRec?.stop(); } catch {}
  }

  function _onWakeStop() {
    // TTS sofort abbrechen, zurück zu idle
    resetTts();
    _chatBusy = false;
    applyMode('idle');
    showReplyText('', false);
    // Wake Word direkt wieder aktivieren
    setTimeout(_startWakeWord, 800);
  }

  function _onWakeDetected() {
    if (_listening) return;
    // TTS unterbrechen falls gerade Erika spricht
    if (_ttsPlaying || _ttsQueue.length > 0) {
      resetTts();
      _chatBusy = false;
    }
    try { _wakeRec?.stop(); } catch {}
    _wakeActive = false;
    const mic = document.getElementById('mic-btn');
    if (mic) { mic.style.boxShadow = '0 0 20px 6px rgba(0,200,255,0.8)'; setTimeout(() => mic.style.boxShadow = '', 600); }
    unlockAudio();
    startSpeech();
  }

  // Beim ersten Touch/Klick: Wake Word starten falls noch ausstehend
  document.addEventListener('pointerdown', () => {
    if (_wakeWordPending && _attentionConfig.wake_word_enabled) {
      _wakeWordPending = false;
      setTimeout(_startWakeWord, 200);
    }
  }, { passive: true });

  // Watchdog: Wake Word neu starten wenn es sollte aber nicht läuft
  setInterval(() => {
    if (!_attentionConfig.wake_word_enabled || _listening || _wakeWordPending) return;
    if (!_wakeActive) {
      _startWakeWord();
      return;
    }
    // Stuck-Detection: _wakeActive=true aber seit >90s kein onresult → Session tot
    if (_wakeLastActivity > 0 && Date.now() - _wakeLastActivity > 90_000) {
      _wakeActive = false;
      try { _wakeRec?.stop(); } catch {}
    }
  }, 2000);

  // ── Gesichtserkennung ──────────────────────────────────────
  async function _loadFaceApiLib() {
    if (_faceApiReady) return true;
    if (!window.faceapi) {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = _FACEAPI_CDN;
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    await Promise.all([
      faceapi.nets.ssdMobilenetv1.loadFromUri(_FACEAPI_MODELS),
      faceapi.nets.faceLandmark68Net.loadFromUri(_FACEAPI_MODELS),
      faceapi.nets.faceRecognitionNet.loadFromUri(_FACEAPI_MODELS),
    ]);
    _faceApiReady = true;
    return true;
  }

  async function _loadFaceMatcher() {
    const d = await fetch('/profiles/face-descriptors/all').then(r => r.json()).catch(() => ({ persons: [] }));
    if (!d.persons?.length) { _faceMatcher = null; return; }
    const labeled = d.persons.map(p =>
      new faceapi.LabeledFaceDescriptors(p.name, p.descriptors.map(arr => new Float32Array(arr)))
    );
    _faceMatcher = new faceapi.FaceMatcher(labeled, 0.55);
  }

  async function _startFaceRecognition() {
    try {
      await _loadFaceApiLib();
      await _loadFaceMatcher();
      if (!_faceMatcher) return;

      _faceVideo = document.createElement('video');
      _faceVideo.setAttribute('autoplay', '');
      _faceVideo.setAttribute('muted', '');
      _faceVideo.setAttribute('playsinline', '');  // iOS + Android
      _faceVideo.muted = true;
      _faceVideo.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:320px;height:240px;pointer-events:none;';
      document.body.appendChild(_faceVideo);

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'user' }, width: { ideal: 320 }, height: { ideal: 240 } },
      });
      _faceVideo.srcObject = stream;
      await new Promise((res, rej) => {
        _faceVideo.onloadedmetadata = res;
        _faceVideo.onerror = rej;
        setTimeout(res, 3000); // Timeout-Fallback
      });
      await _faceVideo.play().catch(() => {});

      fetch('/face-recognition/status', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ok: true}) }).catch(() => {});
      _faceLoopTimer = setInterval(_faceDetectionTick, 1500);
    } catch (e) {
      fetch('/face-recognition/status', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ok: false, error: e?.message || String(e)}) }).catch(() => {});
      // Retry nach 60s
      setTimeout(() => { if (_attentionConfig.face_recognition_enabled) _startFaceRecognition(); }, 60_000);
    }
  }

  async function _faceDetectionTick() {
    if (!_faceVideo || !_faceMatcher || !_faceApiReady) return;
    try {
      const det = await faceapi.detectSingleFace(_faceVideo, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }))
        .withFaceLandmarks().withFaceDescriptor();
      if (!det) { _lastFacePerson = null; return; }

      const match = _faceMatcher.findBestMatch(det.descriptor);
      if (match.label === 'unknown') { _lastFacePerson = null; return; }

      if (match.label !== _lastFacePerson) {
        _lastFacePerson = match.label;
        // Aktive Person setzen
        fetch('/active-person', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: match.label }),
        }).catch(() => {});
        // Wenn nicht schon in Gespräch und TTS nicht aktiv → STT aktivieren
        if (!_listening && !_chatBusy && !_ttsPlaying && _ttsQueue.length === 0) {
          unlockAudio();
          setTimeout(startSpeech, 500);
        }
      }
    } catch {}
  }

  setTimeout(_loadAttentionConfig, 2000);

  // ── Follow-Up Listening — nach TTS automatisch lauschen ───
  let _ttsWasActive  = false;
  let _ttsHadQuestion = false;
  let _followUpTimer = null;

  const _origFeedTts = feedTts;
  feedTts = function(chunk, flush = false) {
    if (chunk && chunk.includes('?')) _ttsHadQuestion = true;
    if (flush) {
      // Flush = TTS-Runde abgeschlossen; Flag für nächste Runde vorbereiten
    }
    _origFeedTts(chunk, flush);
  };

  setInterval(() => {
    const ttsActive = _ttsPlaying || _ttsQueue.length > 0;
    if (_ttsWasActive && !ttsActive) {

      if (_ttsHadQuestion && !_listening && !_chatBusy) {
        clearTimeout(_followUpTimer);

          }

      }
      _ttsHadQuestion = false; // Reset für nächste Antwort

  // ── THEME ─────────────────────────────────────────────────
  function _applyTheme(t) {
    if (!t) return;
    const r = document.documentElement.style;
    if (t.bg)       r.setProperty('--bg',       t.bg);
    if (t.surface)  r.setProperty('--surface',  t.surface);
    if (t.surface2) r.setProperty('--surface2', t.surface2);
    if (t.border)   r.setProperty('--border',   t.border);
    if (t.accent)   r.setProperty('--accent',   t.accent);

    if (t.success)  r.setProperty('--success',  t.success);
    if (t.warning)  r.setProperty('--warning',  t.warning);
    if (t.danger)   r.setProperty('--danger',   t.danger);
    if (t.text)     r.setProperty('--text',     t.text);
    if (t.muted)    r.setProperty('--muted',    t.muted);

  let _lastThemeJson = '';
  function _applyThemeIfChanged(t) {

  fetch('/display/theme/effective').then(r => r.ok ? r.json() : null).then(_applyThemeIfChanged).catch(() => {});

  // ── INIT ──────────────────────────────────────────────────
  applyMode('idle');
  setInterval(pollDisplayState, 2000);
  setInterval(pollReplyText, 400);
  setInterval(pollDoorbellState, 3000);

  // Layout/Theme-Änderungen aus dem Admin übernehmen (max. ~10s Verzögerung,
  // wendet nur bei tatsächlicher Änderung an → kein Flackern)
  setInterval(() => {
    fetch('/display/layout').then(r => r.ok ? r.json() : null).then(_applyLayout).catch(() => {});
    fetch('/display/theme/effective').then(r => r.ok ? r.json() : null).then(_applyThemeIfChanged).catch(() => {});
  }, 10000);

  const _isHome = () => _navMode === 'home';

  // Kraftstoff jede Minute aktualisieren
  setInterval(async () => {
    localStorage.removeItem('fuel');
    if (currentMode === 'idle' && _isHome()) showWeatherLeft();
  }, TTL_1M);

  // Wetter + Kalender alle 15 Min aktualisieren
  setInterval(async () => {
    localStorage.removeItem('weather');
    localStorage.removeItem('calendar');
    localStorage.removeItem('calendar_v2');
    localStorage.removeItem('fuel');
    if (currentMode === 'idle' && _isHome()) { showWeatherLeft(); showCalendarRight(); }
  }, TTL_15M);

  // PV-Slot alle 5 Sekunden aktualisieren
  setInterval(async () => {
    if (!_enabledModules.pv || currentMode !== 'idle' || !_isHome()) return;
    const pvResp = await loadPvData();
    const pvSlot = document.querySelector('[data-widget="pv"]');
    if (!pvSlot) return;
    const size = [...(_panelConfig.left || []), ...(_panelConfig.right || [])]
      .find(s => s.widget === 'pv')?.size || 1;
    pvSlot.innerHTML = _renderPvSlot(pvResp, size);
  }, 5000);

  // Abfall-Slot alle 60s aktualisieren — fängt ab, dass /ha/waste direkt nach
  // einem Backend-Neustart kurzzeitig leer antwortet ("Kein Abfalltermin"),
  // ohne auf den 15-Minuten-Kalender-Refresh warten zu müssen.
  setInterval(async () => {
    if (!_hasFeature('waste') || currentMode !== 'idle' || !_isHome()) return;
    const wasteSlot = document.querySelector('[data-widget="waste"]');
    if (!wasteSlot) return;
    const data = await loadWasteData();
    if (!data?.bins?.length) return; // nichts überschreiben, solange kein gültiges Ergebnis vorliegt
    const size = [...(_panelConfig.left || []), ...(_panelConfig.right || [])]
      .find(s => s.widget === 'waste')?.size || 1;
    wasteSlot.innerHTML = _renderWasteSlot(data, size);
  }, 60000);

  // Drucker alle 30s prüfen — Panel neu rendern wenn Status wechselt
  setInterval(async () => {
    if (!_enabledModules.printer || currentMode !== 'idle' || !_isHome()) return;
    const p = await loadPrinterData();
    const prEl = document.getElementById('right-printer');
    const html = renderPrinterWidget(p);
    if (prEl) {
      prEl.innerHTML = html || '';
    } else if (html) {
      showPanel('right');
    }
  }, 30000);

  // ── VIEWPORT SCALING (10"-Display = scale 1, iPad/Desktop skaliert proportional) ──
  function _scaleToFit() {
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
    document.body.style.transform = `scale(${s})`;
    document.body.style.marginLeft = ((window.innerWidth  - 1280 * s) / 2) + 'px';
    document.body.style.marginTop  = ((window.innerHeight - 800  * s) / 2) + 'px';
  }
  _scaleToFit();
  window.addEventListener('resize', _scaleToFit);
</script>

<script src="/display-plus.js" defer onerror="console.info('Community Edition: Plus-Module nicht geladen')"></script>
