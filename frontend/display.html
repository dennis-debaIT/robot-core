<script>
  (function() {
    function applyScale() {
      const scaleX = window.innerWidth  / 1280;
      const scaleY = window.innerHeight / 800;
      const scale  = Math.min(scaleX, scaleY);
      document.body.style.transform = `scale(${scale})`;
      // Zentrieren wenn Seitenverhältnis abweicht
      const offsetX = Math.max(0, (window.innerWidth  - 1280 * scale) / 2);
      const offsetY = Math.max(0, (window.innerHeight - 800  * scale) / 2);
      document.body.style.transformOrigin = 'top left';
      document.body.style.marginLeft = offsetX + 'px';
      document.body.style.marginTop  = offsetY + 'px';
    }
    applyScale();
    window.addEventListener('resize', applyScale);
  })();
</script>

<script>
  // ── Wind direction ───────────────────────────────────────
  function windDir(deg) {
    const dirs = ['N','NO','O','SO','S','SW','W','NW'];
    return dirs[Math.round(deg / 45) % 8];
  }

  // ── WMO Codes ────────────────────────────────────────────
  const WMO = {
    0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
    45:'🌫️', 48:'🌫️',
    51:'🌦️', 53:'🌦️', 55:'🌦️',
    61:'🌧️', 63:'🌧️', 65:'🌧️',
    71:'❄️', 73:'❄️', 75:'❄️', 77:'🌨️',
    80:'🌦️', 81:'🌦️', 82:'🌦️',
    85:'🌨️', 86:'🌨️',
    95:'⛈️', 96:'⛈️', 99:'⛈️',
  };
  const wmoIcon = code => WMO[code] || '🌡️';

  // ── LocalStorage Cache ───────────────────────────────────
  function cacheSet(key, data, ttlMs) {
    localStorage.setItem(key, JSON.stringify({ data, expires: Date.now() + ttlMs }));
  }
  function cacheGet(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const { data, expires } = JSON.parse(raw);
      return Date.now() < expires ? data : null;
    } catch { return null; }
  }
  function clearRuntimeCaches() {
    [
      'weather',
      'fuel',
      'calendar',
      'calendar_v2',
      'news',
      'vehicles',
      'football',
    ].forEach(key => localStorage.removeItem(key));
    Object.keys(localStorage)
      .filter(key => key.startsWith('league_'))
      .forEach(key => localStorage.removeItem(key));
  }
  function sectionLabel(name, detail) {
    return detail ? `${name} ${String.fromCharCode(183)} ${detail}` : name;
  }
  let _configRefreshTimers = [];
  function scheduleHomeRefreshAfterConfigChange() {
    _configRefreshTimers.forEach(timer => clearTimeout(timer));
    _configRefreshTimers = [150, 900, 2200].map(delay => setTimeout(() => {
      clearRuntimeCaches();
      if (currentMode === 'idle' && _navMode === 'home') {
        _newsCollapseInitialized = false;
        showWeatherLeft();
        showCalendarRight();
        showNewsCenter();
      }
    }, delay));
  }
  function applyConfigVersion(version) {
    if (version == null) return;
    const current = String(version);
    const previous = localStorage.getItem('display_config_version');
    if (previous && previous !== current) {
      clearRuntimeCaches();
      scheduleHomeRefreshAfterConfigChange();
    }
    localStorage.setItem('display_config_version', current);
  }

  function applyAppHash(hash) {
    if (!hash || hash === 'dev') return;
    const previous = localStorage.getItem('erika_app_hash');
    if (previous && previous !== hash) {
      // Neue App-Version nach Update → localStorage leeren (außer App-Hash selbst)
      const keys = Object.keys(localStorage).filter(k => k !== 'erika_app_hash');
      keys.forEach(k => localStorage.removeItem(k));
      console.log('[erika] App-Version gewechselt — localStorage geleert');
    }
    localStorage.setItem('erika_app_hash', hash);
  }

  const TTL_30M = 30 * 60 * 1000;
  const TTL_15M = 15 * 60 * 1000;
  const TTL_5M  =  5 * 60 * 1000;
  const TTL_2M  =  2 * 60 * 1000;
  const TTL_1M  =      60 * 1000;

  // ── Display state ─────────────────────────────────────────
  let currentMode = null;   // null = noch nicht initialisiert
  let contextTimer = null;

  // ── FACE ANIMATION (LED blink) ───────────────────────────
  let blinkTimer;
  function scheduleBlink() {
    clearTimeout(blinkTimer);
    blinkTimer = setTimeout(doBlink, 3000 + Math.random() * 4000);
  }

  function setEyeRows(opacity) {
    ['l-r0','l-r1','l-r2','l-r3','r-r0','r-r1','r-r2','r-r3'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.opacity = opacity;
    });
  }

  function doBlink() {
    // Außenreihen aus
    ['l-r0','l-r3','r-r0','r-r3'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.opacity = '0';
    });
    setTimeout(() => {
      // Alle aus
      setEyeRows('0');
      setTimeout(() => {
        // Innenreihen an
        ['l-r1','l-r2','r-r1','r-r2'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.style.opacity = '1';
        });
        setTimeout(() => {
          // Alle an
          setEyeRows('1');
          scheduleBlink();
        }, 60);
      }, 80);
    }, 60);
  }
  scheduleBlink();

  // Subtle eye tracking (follows cursor on same machine — disabled for kiosk)
  // Could be enabled later for interactive mode

  // ── STATUS BAR ────────────────────────────────────────────
  function updateClock() {
    const now = new Date();
    document.getElementById('sb-clock').textContent =
      now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('sb-date').textContent =
      now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  updateClock();
  setInterval(updateClock, 10000);

  async function refreshStatus() {
    try {
      const d = await fetch('/status').then(r => r.json());
      const batt = d.battery_level != null ? d.battery_level : null;
      document.getElementById('sb-battery').textContent = batt != null ? batt + '%' : 'N/A';
      const bar = document.getElementById('sb-battery-bar');
      bar.style.width = (batt ?? 0) + '%';
      bar.style.background = batt == null ? 'var(--muted)' : batt > 30 ? 'var(--success)' : batt > 15 ? 'var(--warning)' : 'var(--danger)';
      const netInfo = d.network || {};
      const connected = netInfo.connected ?? d.device?.network_connected ?? false;
      const netType = netInfo.type || 'unknown';
      const wlanEl = document.getElementById('sb-wlan');
      wlanEl.textContent = connected ? 'Verbunden' : 'Getrennt';
      wlanEl.className = 'status-val ' + (connected ? 'status-ok' : 'status-err');
      const netIcon = document.getElementById('sb-net-icon');
      const netLabel = document.getElementById('sb-net-label');
      if (netIcon) netIcon.textContent = netType === 'lan' ? '🔌' : '📶';
      if (netLabel) netLabel.textContent = netType === 'lan' ? 'LAN' : 'WLAN';
      const person = d.active_person_name || 'N/A';
      document.getElementById('sb-person').textContent = person;
      _activePersonName = d.active_person_name || null;
      const stateEl = document.getElementById('sb-state');
      if (d.update_available) {
        stateEl.textContent = 'Update verfügbar';
        stateEl.style.color = 'var(--warning)';
      } else {
        stateEl.textContent = d.device?.effective_state || '–';
        stateEl.style.color = '';
      }
    } catch(e) {}
  }
  refreshStatus();
  setInterval(refreshStatus, 5000);

  // ── WEATHER WIDGET ────────────────────────────────────────
  function renderWeather(w) {
    if (!w || w.enabled === false) return '';
    if (w._error) return '<div class="cal-placeholder">Wetterdaten nicht verf&uuml;gbar</div>';
    const c = w.current;
    if (!c) return '<div class="cal-placeholder">Keine Wetterdaten</div>';
    const t = w.today;
    const settings = w.settings || {};
    const hours = settings.show_hourly === false ? [] : (w.forecast_hours || []);
    const stats = [];
    if (settings.show_feels_like !== false) stats.push(['Gef&uuml;hlt wie', `${c.feels_like}&deg;C`]);
    if (settings.show_wind !== false) stats.push(['Wind', `${c.windspeed} km/h${c.winddirection != null ? ' ' + windDir(c.winddirection) : ''}`]);
    if (settings.show_humidity !== false) stats.push(['Luftfeuchtigkeit', `${c.humidity}%`]);
    if (settings.show_precipitation !== false) stats.push(['Niederschlag', `${c.precipitation} mm`]);
    const coatUrl = w.coat_of_arms_url || null;
    const coatHtml = coatUrl
      ? `<img src="${coatUrl}" alt="Wappen" style="height:32px;width:auto;object-fit:contain;opacity:0.85;flex-shrink:0;" onerror="this.style.display='none'">`
      : '';
    return `
      <div class="weather-click-target" onclick="openWeatherOverview()" title="Wetterbericht anzeigen">
      <div class="weather-main">
        <div class="weather-icon">${wmoIcon(c.weathercode)}</div>
        <div style="flex:1;">
          <div class="weather-temp">${c.temperature}&deg;</div>
          <div class="weather-desc">${c.description}</div>
        </div>
        ${coatHtml}
      </div>
      ${stats.length ? `<div class="weather-grid">
        ${stats.map(([label, value]) => `
          <div class="weather-stat">
            <div class="weather-stat-label">${label}</div>
            <div class="weather-stat-val">${value}</div>
          </div>`).join('')}
      </div>` : ''}
      ${t && settings.show_minmax !== false ? `<div class="weather-minmax">
        <span>&uarr; <span class="temp-high">${t.temp_max}&deg;C</span></span>
        <span>&darr; <span class="temp-low">${t.temp_min}&deg;C</span></span>
      </div>` : ''}
      ${hours.length ? `<div class="forecast-hours">
        ${hours.map(h => `
          <div class="forecast-hour ${h.is_past ? 'past' : ''}">
            <div class="fh-time">${h.time}</div>
            <div class="fh-icon">${wmoIcon(h.code)}</div>
            <div class="fh-temp">${h.temp}&deg;</div>
          </div>
        `).join('')}
      </div>` : ''}
      </div>
    `;
  }

  let _lastWeatherData = null;
  const _WEATHER_ERROR = { _error: true, enabled: true };
  async function loadWeather() {
    const cached = cacheGet('weather');
    try {
      const resp = await fetch('/weather?_=' + Date.now(), { cache: 'no-store' });
      if (!resp.ok) return cached || _lastWeatherData || _WEATHER_ERROR;
      const d = await resp.json();
      if (d?.enabled === false) {
        localStorage.removeItem('weather');
        _lastWeatherData = null;
        return d;
      }
      if (d?.current) {
        _lastWeatherData = d;
        cacheSet('weather', d, TTL_15M);
        return d;
      }
      return cached || _lastWeatherData || _WEATHER_ERROR;
    } catch { return cached || _lastWeatherData || _WEATHER_ERROR; }
  }

  // ── FUEL PRICES ───────────────────────────────────────────
  async function loadFuel() {
    const cached = cacheGet('fuel');
    if (cached) return cached;
    try {
      const resp = await fetch('/fuel');
      if (!resp.ok) return null;
      const d = await resp.json();
      if (d?.cards?.length || d?.cheapest_diesel || d?.grouped) {
        cacheSet('fuel', d, TTL_1M);
        return d;
      }
      return null;
    } catch { return null; }
  }

  function fuelPriceHtml(priceNum, large = false) {
    const price = priceNum.toFixed(3).replace('.', ',');
    const [euros, cents] = price.split(',');
    const main = cents.slice(0, -1);
    const last = cents.slice(-1);
    if (large) {
      return `<span style="font-size:2rem;font-weight:800;color:var(--warning);">${euros},</span>`
           + `<span style="font-size:1.3rem;font-weight:700;color:var(--warning);">${main}</span>`
           + `<span style="font-size:0.9rem;font-weight:800;color:var(--warning);position:relative;top:-0.55em;">${last}</span>`;
    }
    return `${euros},${main}<span style="font-size:0.65em;position:relative;top:-0.4em;">${last}</span> €`;
  }

  function renderFuelPrice(fuel) {
    const cards = fuel?.cards || [];
    if (cards.length) {
      const columns = cards.map(card => `
        <div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;">
          <div style="font-size:0.72rem;color:var(--accent);font-weight:800;letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;">${card.label}</div>
          <div style="display:flex;align-items:baseline;gap:3px;white-space:nowrap;">
            ${fuelPriceHtml(card.primary.price, true)}
            <span style="font-size:0.76rem;color:var(--muted);margin-left:2px;">&euro;/L</span>
          </div>
        </div>
      `).join('');
     return `
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
          <div style="display:flex;gap:16px;align-items:flex-start;">
            ${columns}
          </div>
          <div style="font-size:0.65rem;color:var(--muted);margin-top:6px;">${(()=>{ const d=new Date(fuel.updated_at||''); return isNaN(d)?'':'Letzte Preis&auml;nderung '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr'; })()}</div>
        </div>`;   
}
    if (!fuel?.cheapest_diesel && !fuel?.diesel?.length) return '';
    const diesel = fuel.cheapest_diesel || (fuel.diesel || [])[0];
    if (!diesel) return '';
    const allDiesel = (fuel.diesel || []);
    const extra = allDiesel.length > 1
      ? allDiesel.slice(1).map(e =>
          `<span style="font-size:0.74rem;color:var(--muted);">${fuelPriceHtml(e.price)}</span>`
        ).join('  ')
      : '';
    return `
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
        <div style="font-size:0.72rem;color:var(--accent);font-weight:800;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;">Diesel</div>
        <div style="display:flex;align-items:baseline;gap:3px;">
          ${fuelPriceHtml(diesel.price, true)}
          <span style="font-size:0.8rem;color:var(--muted);margin-left:2px;">&euro;/L</span>
        </div>
        ${extra ? `<div style="margin-top:5px;display:flex;gap:10px;">${extra}</div>` : ''}
        <div style="font-size:0.65rem;color:var(--muted);margin-top:6px;">${(()=>{ const d=new Date(fuel.updated_at||''); return isNaN(d)?'':'Letzte Preis&auml;nderung '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr'; })()}</div>
      </div>`;
  }

  async function loadEV() {
    try { const r = await fetch('/vehicles', { cache: 'no-store' }); return r.ok ? r.json() : null; }
    catch { return null; }
  }

  function formatChargeTime(minutesRaw) {
    const minutes = parseInt(minutesRaw, 10);
    if (!Number.isFinite(minutes) || minutes < 0) return '';
    const hours = Math.floor(minutes / 60);
    const rest = minutes % 60;
    return `${String(hours).padStart(2, '0')}:${String(rest).padStart(2, '0')}`;
  }

  function renderEVVehicle(vehicle) {
    const isEv = Boolean(vehicle.ev_profile_enabled);
    const energy = isEv ? vehicle.battery : vehicle.fuel_level;
    const level = energy?.state != null ? parseInt(energy.state) : null;
    const range = vehicle.range?.state;
    const unit  = vehicle.range?.unit || 'km';
    const bc    = level == null ? 'var(--muted)' : level > 40 ? 'var(--success)' : level > 20 ? 'var(--warning)' : 'var(--danger)';
    const chargingRaw = String(vehicle.charging?.state || '').toLowerCase();
    const plugRaw = String(vehicle.plug?.state || '').toLowerCase();
    const _EV_NOT_CHARGING = ['off','false','0','not_in_charge','not charging','no_charging','charge error','charge_error','stopped'];
    const _EV_PLUGGED = ['on','plugged_in','connected','true','1','charging','in_charge','plugged','charge error','charge_error'];
    const isCharging = ['an','true','1','charging','ja','yes','on','in_charge','charge_in_progress'].includes(chargingRaw);
    const isPlugged = _EV_PLUGGED.includes(plugRaw) || (!vehicle.plug && ['charging','in_charge','plugged_in'].includes(chargingRaw));
    const canStart = isEv && isPlugged && _EV_NOT_CHARGING.includes(chargingRaw) && vehicle.start_charging_button_entity;
    const chargeTime = isCharging ? formatChargeTime(vehicle.remaining_charge_time?.state) : '';
    const levelHtml = level != null ? `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
        <span style="font-size:0.85rem;">${isEv ? (isCharging ? '&#9889;' : (isPlugged ? '&#128268;' : '&#128267;')) : '&#9981;'}</span>
        <span style="font-weight:700;color:${bc};font-size:0.82rem;min-width:36px;">${level}%</span>
        <div style="flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;">
          <div style="width:${level}%;height:100%;background:${bc};border-radius:3px;"></div>
        </div>
      </div>` : '';
    const adblueRaw = vehicle.adblue_level?.state != null ? parseFloat(vehicle.adblue_level.state) : null;
    const adblueUnit = (vehicle.adblue_level?.unit || '').trim() || '%';
    const adblueIsKm = adblueUnit.toLowerCase() === 'km';
    const adblueColor = adblueRaw == null ? 'var(--muted)' : adblueIsKm
      ? (adblueRaw > 2000 ? 'var(--accent)' : adblueRaw > 500 ? 'var(--warning)' : 'var(--danger)')
      : (adblueRaw > 25 ? 'var(--accent)' : adblueRaw > 10 ? 'var(--warning)' : 'var(--danger)');
    const adblueHtml = !isEv && adblueRaw != null ? `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
        <span style="font-size:0.85rem;">&#128167;</span>
        <span style="font-weight:700;color:${adblueColor};font-size:0.82rem;min-width:52px;">${Math.round(adblueRaw)} ${adblueUnit}</span>
        ${!adblueIsKm ? `<div style="flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;">
          <div style="width:${Math.max(0, Math.min(100, adblueRaw))}%;height:100%;background:${adblueColor};border-radius:3px;"></div>
        </div>` : ''}
        <span style="font-size:0.62rem;color:var(--muted);font-weight:800;letter-spacing:0.08em;text-transform:uppercase;">AdBlue</span>
      </div>` : '';
    const statusHtml = isEv && vehicle.charging != null ? `
      <div style="font-size:0.74rem;margin-bottom:5px;color:${isCharging ? 'var(--success)' : 'var(--muted)'};">
        ${isCharging ? `&#9679; L&auml;dt gerade${chargeTime ? ` &bull; Restladezeit ${chargeTime}` : ''}` : (isPlugged ? '&#9675; Angesteckt &ndash; nicht am Laden' : '&#9675; Nicht am Laden')}
      </div>` : '';
    const rangeHtml = range ? `
      <div style="font-size:0.78rem;color:var(--text);margin-bottom:8px;">&#128663; ${range} ${unit} Reichweite</div>` : '';
    const startBtn = canStart ? `
      <button onclick="pressVehicleButton('${vehicle.start_charging_button_entity}', this, 'Gestartet')"
        style="width:100%;padding:5px 0;border-radius:8px;background:none;margin-bottom:4px;
               border:1px solid var(--success);color:var(--success);
               font-size:0.72rem;font-weight:700;cursor:pointer;transition:background 0.15s;"
        onmouseover="this.style.background='rgba(0,200,100,0.1)'"
        onmouseout="this.style.background='none'">&#9889; Laden starten</button>` : '';
    const stopBtn = isCharging && vehicle.stop_charging_button_entity ? `
      <button onclick="evStopCharging('${vehicle.stop_charging_button_entity}', this)"
        style="width:100%;padding:5px 0;border-radius:8px;background:none;
               border:1px solid var(--warning);color:var(--warning);
               font-size:0.72rem;font-weight:700;cursor:pointer;transition:background 0.15s;"
        onmouseover="this.style.background='rgba(255,171,0,0.1)'"
        onmouseout="this.style.background='none'">&#9209; Laden stoppen</button>` : '';
    return `
      <div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px;">
        <div style="font-size:0.62rem;font-weight:800;letter-spacing:0.13em;color:var(--accent);
                    text-transform:uppercase;margin-bottom:7px;">${vehicle.label || vehicle.name || 'Fahrzeug'}</div>
        ${levelHtml}${statusHtml}${rangeHtml}${adblueHtml}${startBtn}${stopBtn}
      </div>`;
  }

  function renderEV(data) {
    const vehicles = Array.isArray(data?.vehicles) ? data.vehicles : [];
    if (!vehicles.length) return '';
    return vehicles.map(renderEVVehicle).join('');
  }

  async function evStopCharging(entityId, btn) {
    if (!entityId) return;
    if (btn) { btn.disabled = true; btn.textContent = '...'; }
    try {
      await fetch(`/ha/button/${entityId}/press`, { method: 'POST' });
      if (btn) { btn.textContent = `${String.fromCharCode(10003)} Gestoppt`; setTimeout(() => { btn.disabled = false; btn.textContent = `${String.fromCharCode(9209)} Laden stoppen`; }, 3000); }
    } catch {
      if (btn) { btn.disabled = false; btn.textContent = `${String.fromCharCode(9209)} Laden stoppen`; }
    }
  }

  async function pressVehicleButton(entityId, btn, activeLabel = 'Gesendet') {
    if (!entityId) return;
    const original = btn?.textContent || '';
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Sende...';
    }
    try {
      const response = await fetch(`/ha/button/${entityId}/press`, { method: 'POST' });
      if (!response.ok) throw new Error('button press failed');
      if (btn) btn.textContent = activeLabel;
    } catch {
      if (btn) btn.textContent = 'Fehler';
    } finally {
      if (btn) {
        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = original;
        }, 2500);
      }
    }
  }

  let _homeLeftRenderSeq = 0;
  function buildHomeLeftModules(weather, fuel, vehicles) {
    const modules = [];
    const weatherHtml = renderWeather(weather);
    if (weatherHtml) {
      modules.push({
        key: 'weather',
        label: sectionLabel('Wetter', weather?.location || ''),
        html: `<section class="home-left-module home-left-module-weather">${weatherHtml}</section>`,
      });
    }

    const fuelHtml = renderFuelPrice(fuel);
    if (fuelHtml) {
      modules.push({
        key: 'fuel',
        label: 'Kraftstoffe',
        html: `<section class="home-left-module home-left-module-fuel">${fuelHtml}</section>`,
      });
    }

    if (_enabledModules.vehicles) {
      const vehicleHtml = renderEV(vehicles);
      if (vehicleHtml) {
        modules.push({
          key: 'vehicles',
          label: 'Fahrzeuge',
          html: `<section class="home-left-module home-left-module-vehicles">${vehicleHtml}</section>`,
        });
      }
    }
    return modules;
  }

  function applyHomeLeftModules(modules) {
    const labelEl = document.getElementById('left-label');
    const contentEl = document.getElementById('left-content');
    if (!labelEl || !contentEl) return;
    const visible = modules.filter(module => module.html);
    labelEl.textContent = visible[0]?.label || 'Start';
    contentEl.innerHTML = visible.length
      ? `<div class="home-left-stack">${visible.map(module => module.html).join('')}</div>`
      : '<div class="cal-placeholder">Keine Startmodule aktiv</div>';
  }

  // ── WIDGET RENDERERS (size-aware) ────────────────────────
  function _renderWeatherSlot(w, size) {
    if (!w || w.enabled === false) return '<div class="cal-placeholder">Wetter deaktiviert</div>';
    if (w._error || !w.current) return '<div class="cal-placeholder">Wetterdaten nicht verf&uuml;gbar</div>';
    const c = w.current; const t = w.today;
    if (size === 1) {
      return `<div style="padding:2px 0 0;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="font-size:2rem;">${wmoIcon(c.weathercode)}</div>
          <div style="flex:1;">
            <div style="font-size:1.5rem;font-weight:900;line-height:1;">${c.temperature}&deg;</div>
            <div style="font-size:0.72rem;color:var(--muted);margin-top:1px;">${c.description}</div>
          </div>
          ${t ? `<div style="text-align:right;font-size:0.76rem;line-height:1.6;color:var(--muted);">
            <div style="color:var(--warning);">&uarr;&nbsp;${t.temp_max}&deg;C</div>
            <div style="color:var(--accent);">&darr;&nbsp;${t.temp_min}&deg;C</div>
          </div>` : ''}
        </div>
      </div>`;
    }
    return renderWeather(w);
  }

  function _renderCalendarSlot(cal, size) {
    if (size === 1) {
      if (!cal?.next_event) return '<div class="cal-placeholder">Kein Termin</div>';
      const ne = cal.next_event;
      return `<div style="background:rgba(0,200,255,0.08);border:1px solid rgba(0,200,255,0.25);border-radius:10px;padding:10px 12px;">
        <div style="font-size:0.62rem;color:var(--accent);letter-spacing:0.11em;margin-bottom:4px;">N&Auml;CHSTER TERMIN</div>
        <div style="font-weight:700;font-size:0.88rem;line-height:1.3;">${ne.title}</div>
        <div style="color:var(--muted);font-size:0.74rem;margin-top:3px;">${ne.weekday} &middot; ${ne.date} &middot; ${ne.time}</div>
      </div>`;
    }
    return renderCalendarData(cal);
  }

  function _renderFuelSlot(fuel, size) {
    const html = renderFuelPrice(fuel);
    if (!html) return '<div class="cal-placeholder">Keine Kraftstoffpreise</div>';
    return html;
  }

  function _renderPvSlot(pvResp, size) {
    const pv = pvResp?.state || null;
    const fields = pvResp?.widget_fields || {};
    if (!pv) return '<div class="cal-placeholder">PV nicht verf&uuml;gbar</div>';
    return renderPvWidget(pv, fields);
  }

  function _renderEvSlot(data, size) {
    const html = renderEV(data);
    if (!html) return '<div class="cal-placeholder">Kein Fahrzeug konfiguriert</div>';
    return html;
  }

  async function _loadCameraWidgetData() {
    const [cams, events] = await Promise.all([loadCamerasData(), loadCameraEvents()]);
    return { cameras: cams || [], events: events || [] };
  }

  function _renderCamerasWidget(data, size) {
    const cameras = data?.cameras || [];
    const events  = data?.events  || [];
    if (!cameras.length) return '<div class="cal-placeholder">Keine Kameras konfiguriert</div>';

    const cam  = cameras[0];
    const snap = `<div onclick="navTo('cameras')" style="cursor:pointer;position:relative;border-radius:8px;overflow:hidden;margin-bottom:8px;">
      <img src="${_snapUrl(cam.entity_id)}" style="width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block;"
           onerror="this.style.display='none'">
      <div style="position:absolute;bottom:0;left:0;right:0;padding:4px 8px;background:linear-gradient(transparent,rgba(0,0,0,0.6));
                  font-size:0.65rem;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:0.08em;">
        ${cam.name || ''}
      </div>
    </div>`;

    const maxEvents = size >= 3 ? 5 : 3;
    const evHtml = events.slice(0, maxEvents).map(e => `
      <div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:0.72rem;">
        <span style="flex-shrink:0;">${_camEventIcon(e.type)}</span>
        <span style="flex:1;color:var(--text);font-weight:600;">${e.name}</span>
        <span style="color:var(--muted);white-space:nowrap;">${_relTime(e.when)}</span>
      </div>`).join('');

    return (size >= 2 ? snap : '')
      + `<div style="font-size:0.65rem;font-weight:800;color:var(--accent);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;">Letzte Ereignisse</div>`
      + (evHtml || `<div style="color:var(--muted);font-size:0.78rem;">Keine Ereignisse</div>`);
  }

  async function loadWasteData() {
    try { const r = await fetch('/ha/waste', { cache: 'no-store' }); return r.ok ? r.json() : null; }
    catch { return null; }
  }

  function _fmtWasteDays(d) {
    return d === 0 ? 'Heute' : d === 1 ? 'Morgen' : 'in ' + d + ' Tagen';
  }

  function _renderWasteSlot(data, size) {
    const bins = data?.bins || [];
    if (!bins.length) return '<div class="cal-placeholder">Kein Abfalltermin</div>';
    const items = bins.map(b => `
      <div style="flex:1;text-align:center;min-width:0;">
        <img src="/assets/waste/${b.color}.png" alt="${b.label}" title="${b.label} · ${b.date}"
             style="height:58px;width:auto;object-fit:contain;display:block;margin:0 auto 5px;"
             onerror="this.style.display='none'">
        <div style="font-size:0.7rem;font-weight:800;color:${b.days<=1?'var(--warning)':'var(--text)'};white-space:nowrap;">${_fmtWasteDays(b.days)}</div>
      </div>`).join('');
    return `<div style="display:flex;gap:6px;align-items:flex-end;justify-content:space-around;padding:4px 0;">${items}</div>`;
  }

  const _WIDGET_DEFS = {
    weather:  { label: 'Wetter',     load: () => loadWeather(),           render: _renderWeatherSlot,   compact: false },
    calendar: { label: 'Kalender',   load: () => loadCalendar(),          render: _renderCalendarSlot,  compact: false },
    cameras:  { label: 'Kameras',    load: () => _loadCameraWidgetData(), render: _renderCamerasWidget, compact: false },
    fuel:     { label: 'Kraftstoff', load: () => loadFuel(),              render: _renderFuelSlot,      compact: true  },
    pv:       { label: 'PV-Anlage',  load: () => loadPvData(),            render: _renderPvSlot,        compact: true  },
    ev:       { label: 'Fahrzeug',   load: () => loadEV(),                render: _renderEvSlot,        compact: true  },
    waste:    { label: 'Abfall',     load: () => loadWasteData(),         render: _renderWasteSlot,     compact: true  },
  };

  function _widgetEnabled(widgetId) {
    if (widgetId === 'pv')       return _enabledModules.pv === true;
    if (widgetId === 'ev')       return _enabledModules.vehicles === true;
    if (widgetId === 'calendar') return _enabledModules.calendar !== false;
    if (widgetId === 'cameras')  return _enabledModules.cameras === true;
    if (widgetId === 'waste')    return _hasFeature('waste');
    return true;
  }

  async function showPanel(side) {
    const slots = (_panelConfig[side] || []).filter(s => _WIDGET_DEFS[s.widget]);
    const labelEl   = document.getElementById(side + '-label');
    const contentEl = document.getElementById(side + '-content');
    if (!labelEl || !contentEl) return;

    const seq = ++_panelRenderSeq[side];
    const dataArr = await Promise.all(slots.map(s =>
      _widgetEnabled(s.widget) ? _WIDGET_DEFS[s.widget].load() : Promise.resolve(null)
    ));
    if (_panelRenderSeq[side] !== seq) return;

    // Drucker immer oben im rechten Panel (wenn aktiv)
    let printerHtml = '';
    if (side === 'right' && _enabledModules.printer) {
      const printer = await loadPrinterData();
      if (printer?.printing) printerHtml = `<div id="right-printer">${renderPrinterWidget(printer)}</div>`;
    }

    const gridRows = slots.map((s, i) => {
      const def = _WIDGET_DEFS[s.widget];
      const content = _widgetEnabled(s.widget) ? def.render(dataArr[i], s.size || 1) : '';
      // kompakt: natürliche Höhe. flexibel: füllt Restplatz (flex-grow nach size),
      // schrumpft aber nicht unter min-height → bei Überlauf scrollt das Panel.
      const flexStyle = def.compact
        ? 'flex:0 0 auto;'
        : `flex:${s.size || 1} 1 auto;min-height:150px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border) transparent;`;
      return `<div class="widget-slot" data-widget="${s.widget}" style="${flexStyle}">${content}</div>`;
    }).join('');

    const label = slots.map(s => {
      if (s.widget === 'calendar') {
        const clickable = _calendarOpenTrigger === 'widget' || _calendarOpenTrigger === 'both';
        return clickable ? '<span onclick="openMonthCalendar()" style="cursor:pointer;" title="Monatskalender &ouml;ffnen">Kalender</span>' : 'Kalender';
      }
      return _WIDGET_DEFS[s.widget]?.label || s.widget;
    }).join(' &middot; ');

    contentEl.classList.add('fade-out');
    setTimeout(() => {
      labelEl.innerHTML = label || side;
      contentEl.innerHTML = printerHtml
        + `<div class="widget-grid">${gridRows}</div>`;
      contentEl.classList.remove('fade-out');
    }, 300);
  }

  async function loadFootball(team) {
    if (!team) return null;
    const key = 'football_' + team;
    const cached = cacheGet(key);
    if (cached) return cached;
    try {
      const d = await fetch('/football/' + encodeURIComponent(team)).then(r => r.json());
      cacheSet(key, d, TTL_2M);
      return d;
    } catch { return null; }
  }

  async function loadLeagueTable(leagueId) {
    const key = 'league_' + (leagueId || 'bl2');
    const cached = cacheGet(key);
    if (cached) return cached;
    try {
      const d = await fetch('/football/league/' + encodeURIComponent(leagueId || 'bl2')).then(r => r.json());
      if (d?.table) { cacheSet(key, d, TTL_2M); return d; }
      return null;
    } catch { return null; }
  }

  // ── CALENDAR ──────────────────────────────────────────────
  async function loadCalendar() {
    const cached = cacheGet('calendar_v2');
    if (cached?.days) return cached;  // nur nutzen wenn neues Format
    try {
      const resp = await fetch('/calendar', { cache: 'no-store' });
      if (!resp.ok) return null;
      const d = await resp.json();
      if (d?.days !== undefined) {
        localStorage.removeItem('calendar');
        cacheSet('calendar_v2', d, TTL_5M);
        return d;
      }
      return null;
    } catch { return null; }
  }

  function renderCalendarData(cal) {
    if (!cal) {
      return `<div class="cal-placeholder">📅<br><br>Kalender nicht verfügbar.</div>`;
    }
    if (!cal.days || cal.days.length === 0) {
      return `<div class="cal-placeholder">📅<br><br>Keine Termine in den nächsten 7 Tagen.</div>`;
    }

    let html = '';

    // Nächster Termin (wenn in der Zukunft)
    if (cal.next_event) {
      const ne = cal.next_event;
      const when = ne.weekday === 'Heute' ? ne.time
                 : `${ne.weekday}, ${ne.date} · ${ne.time}`;
      html += `
        <div style="background:rgba(0,200,255,0.08);border:1px solid rgba(0,200,255,0.25);
                    border-radius:10px;padding:10px 12px;margin-bottom:12px;">
          <div style="font-size:0.62rem;color:var(--accent);letter-spacing:0.11em;margin-bottom:4px;">NÄCHSTER TERMIN</div>
          <div style="font-weight:700;font-size:0.9rem;line-height:1.3;">${ne.title}</div>
          <div style="color:var(--muted);font-size:0.76rem;margin-top:3px;">${ne.weekday} · ${ne.date} · ${ne.time}${ne.location ? ' · ' + ne.location : ''}</div>
        </div>`;
    }

    // Tage
    cal.days.forEach(day => {
      html += `
        <div style="margin-bottom:8px;">
          <div style="font-size:0.64rem;font-weight:800;color:var(--muted);letter-spacing:0.11em;
                      text-transform:uppercase;padding:3px 0 4px;border-bottom:1px solid var(--border);
                      margin-bottom:5px;">
            ${day.label} &nbsp;·&nbsp; ${day.date}
          </div>`;
      day.events.forEach(ev => {
        const loc = ev.location
          ? `<div class="cal-sub">${ev.location}</div>` : '';
        html += `
          <div class="cal-item" style="margin-bottom:4px;">
            <div class="cal-time">${ev.time}</div>
            <div class="cal-body">
              <div class="cal-title">${ev.title}</div>
              ${loc}
            </div>
          </div>`;
      });
      html += `</div>`;
    });

    if (cal.total_count > 12) {
      html += `<div style="font-size:0.74rem;color:var(--muted);text-align:center;padding-top:4px;">
        +${cal.total_count - 12} weitere Termine
      </div>`;
    }
    return html;
  }

  // ── DRUCKER WIDGET + OVERLAY ──────────────────────────────

  let _printerData = null;

  async function loadPrinterData() {
    if (!_enabledModules.printer) return null;
    try {
      const r = await fetch('/ha/printer/state', { cache: 'no-store' });
      if (!r.ok) return null;
      _printerData = await r.json();
      return _printerData;
    } catch { return null; }
  }

  function _fmtTime(val) {
    if (!val && val !== 0) return '–';
    const n = parseInt(val);
    if (isNaN(n)) return String(val);
    if (n < 60) return n + ' min';
    return Math.floor(n / 60) + 'h ' + (n % 60) + 'min';
  }

  function renderPrinterWidget(p) {
    if (!p || !p.printing) return '';
    const filename = (p.filename || '').replace(/\.gcode$/i, '');
    const pct   = p.progress != null ? Math.round(p.progress) : 0;
    const bar   = '█'.repeat(Math.round(pct / 10)) + '░'.repeat(10 - Math.round(pct / 10));
    const layer = p.layer && p.total_layers ? `Layer ${p.layer}/${p.total_layers}` : '';
    const temps = [
      p.nozzle_temp ? `Düse ${Math.round(p.nozzle_temp)}°C` : '',
      p.hotbed_temp ? `Bett ${Math.round(p.hotbed_temp)}°C` : '',
    ].filter(Boolean).join(' · ');
    return `<div class="printer-widget" onclick="openPrinterOverlay()" style="cursor:pointer;" title="Drucker-Details">
      <div class="printer-row"><span class="printer-icon">🖨</span><span class="printer-filename">${filename || 'Druckt…'}</span></div>
      <div class="printer-row printer-progress">
        <span class="printer-bar">${bar}</span>
        <span class="printer-pct">${pct}%</span>
        ${layer ? `<span class="printer-layer">${layer}</span>` : ''}
      </div>
      <div class="printer-row printer-times">
        ${p.elapsed != null ? `<span>⏱ ${_fmtTime(p.elapsed)}</span>` : ''}
        ${p.remaining != null ? `<span>noch ${_fmtTime(p.remaining)}</span>` : ''}
      </div>
      ${temps ? `<div class="printer-row printer-temps">🌡 ${temps}</div>` : ''}
    </div>`;
  }

  async function openPrinterOverlay() {
    const p = await loadPrinterData();
    if (!p) return;
    const cp = document.getElementById('center-panel');
    if (!cp) return;
    let box = document.getElementById('printer-overlay-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'printer-overlay-box';
      box.style.cssText = 'position:absolute;inset:0;z-index:201;background:var(--bg);display:flex;flex-direction:column;border-radius:inherit;overflow:hidden;';
      cp.style.position = 'relative';
      cp.appendChild(box);
    }
    box.style.display = 'flex';
    renderPrinterOverlayContent(box, p);
    _startPrinterOverlayRefresh(box);
  }

    const hasPause  = !!((window._printerEntities||{}).pause);
    const hasResume = !!((window._printerEntities||{}).resume);
    const hasCancel = !!((window._printerEntities||{}).cancel);
    box.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px;">
        <div style="font-size:0.65rem;font-weight:800;letter-spacing:0.14em;color:var(--accent);text-transform:uppercase;">3D-Drucker</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:0.72rem;font-weight:700;color:${stateColor};">${stateLabel.toUpperCase()}</span>
          <button onclick="closePrinterOverlay()" style="background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:0.78rem;font-weight:700;cursor:pointer;padding:5px 12px;">SCHLIESSEN</button>
        </div>
      </div>
      <div style="flex:1;overflow-y:auto;padding:0 20px 20px;">
        ${snap}
        ${filename ? `<div style="font-size:0.78rem;color:var(--muted);margin-bottom:12px;word-break:break-all;">📄 ${filename}.gcode</div>` : ''}
        <div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;font-size:0.7rem;color:var(--muted);margin-bottom:4px;">
            <span>Fortschritt</span><span style="color:var(--accent);font-weight:700;">${pct}%</span>
          </div>
          <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:3px;transition:width 0.5s;"></div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
          ${[
            ['Layer', p.layer && p.total_layers ? `${p.layer} / ${p.total_layers}` : '–'],
            ['Fortschritt', pct + '%'],
            ['Vergangen', _fmtTime(p.elapsed)],
            ['Verbleibend', _fmtTime(p.remaining)],

            ['Bett', p.hotbed_temp != null ? Math.round(p.hotbed_temp) + '°C' : '–'],
          ].map(([label, val]) => `
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;">
              <div style="font-size:0.65rem;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;">${label}</div>
              <div style="font-size:1rem;font-weight:700;margin-top:3px;color:var(--text);">${val}</div>
            </div>`).join('')}
        </div>
        <div style="display:flex;gap:10px;justify-content:center;">
          <button onclick="printerControl('pause')" style="flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--warning);font-size:1.2rem;cursor:pointer;" title="Pause">⏸</button>
          <button onclick="printerControl('resume')" style="flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--success);font-size:1.2rem;cursor:pointer;" title="Fortsetzen">▶</button>
          <button onclick="printerControl('cancel')" style="flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,79,95,0.4);background:rgba(255,79,95,0.08);color:#ff4f5f;font-size:1.2rem;cursor:pointer;" title="Abbrechen">⏹</button>
        </div>
      </div>`;
  }

  function openSnapshotFullscreen(url) {
    let lb = document.getElementById('snapshot-lightbox');
    if (!lb) {
      lb = document.createElement('div');
      lb.id = 'snapshot-lightbox';
      lb.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;cursor:zoom-out;';
      lb.onclick = () => lb.style.display = 'none';
      document.body.appendChild(lb);
    }
    lb.innerHTML = `<img src="${url}?_t=${Date.now()}" style="max-width:95vw;max-height:95vh;border-radius:12px;object-fit:contain;">`;
    lb.style.display = 'flex';
  }

  function closePrinterOverlay() {
    clearInterval(_printerOverlayRefresh);
    const box = document.getElementById('printer-overlay-box');
    if (box) box.style.display = 'none';
  }

  async function printerControl(action) {
    if (action === 'cancel' && !confirm('Druck wirklich abbrechen?')) return;
    try {
      await fetch(`/ha/printer/control/${action}`, { method: 'POST' });
      setTimeout(async () => {
        const p = await loadPrinterData();
        const box = document.getElementById('printer-overlay-box');
        if (box && box.style.display !== 'none') renderPrinterOverlayContent(box, p || {});
      }, 2000);
    } catch {}
  }

  // ── TIMER ─────────────────────────────────────────────────
  let _timerInterval      = null;
  let _timerBeepLoop      = null;
  let _timerBeepDoneIds   = new Set();
  let _timerFinishedAtMap = new Map();

  function _playTimerBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.32, 0.64, 0.96].forEach((t, i) => {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type            = 'sine';
        osc.frequency.value = 880 + i * 80;
        gain.gain.setValueAtTime(0, ctx.currentTime + t);
        gain.gain.linearRampToValueAtTime(0.45, ctx.currentTime + t + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.22);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.25);
      });
    } catch {}
  }

  async function _playNotificationTts(message) {
    try {
      const r = await fetch('/tts/synthesize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: message }),
      });
      if (!r.ok) return;
      const buf = await r.arrayBuffer();
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuf = await ctx.decodeAudioData(buf);
      const source = ctx.createBufferSource();
      source.buffer = audioBuf;
      source.connect(ctx.destination);
      source.start(0);
    } catch {}
  }

  function _startTimerBeepLoop() {
    _playTimerBeep();
    if (_timerBeepLoop) return;
    _timerBeepLoop = setInterval(_playTimerBeep, 3000);
  }

  function _stopTimerBeepLoop() {
    clearInterval(_timerBeepLoop);
    _timerBeepLoop = null;
  }

  function _startTimerPolling() {
    if (_timerInterval) return;
    _timerInterval = setInterval(_pollTimer, 1000);
  }

  function _stopTimerPolling() {
    clearInterval(_timerInterval);
    _timerInterval = null;
  }

  async function _dismissTimer(id) {
    await fetch('/timer/' + id + '/dismiss', {method:'POST'}).catch(()=>{});
    _timerBeepDoneIds.delete(id);
    _timerFinishedAtMap.delete(id);
    if (_timerFinishedAtMap.size === 0) _stopTimerBeepLoop();
    _pollTimer();
  }

  async function _cancelTimer(id) {
    await fetch('/timer/' + id + '/cancel', {method:'POST'}).catch(()=>{});
    _pollTimer();
  }

  async function _pollTimer() {
    try {
      const d = await fetch('/timer/status', { cache: 'no-store' }).then(r => r.json());
      if (!d.active || !d.timers?.length) {
        _stopTimerBeepLoop();
        _hideTimerOverlay();
        _stopTimerPolling();
        return;
      }
      _startTimerPolling();
      for (const t of d.timers) {
        if (t.finished && !_timerBeepDoneIds.has(t.id)) {
          _timerBeepDoneIds.add(t.id);
          _timerFinishedAtMap.set(t.id, Date.now());
          _startTimerBeepLoop();
          const label = t.label || 'Der Timer';
          feedTts(`${label} ist abgelaufen!`, false);
          feedTts('', true);
        }
      }
      _showTimerOverlay(d.timers);
    } catch {}
  }

  function _fmt(secs) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return h > 0
      ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
      : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function _timerCard(t) {
    const fin     = t.finished;
    const rem     = t.remaining_seconds;
    const pct     = t.duration_seconds > 0 ? Math.max(0, 1 - rem / t.duration_seconds) : 1;
    const circ    = 2 * Math.PI * 54;
    const overdue = fin ? Math.round((Date.now() - (_timerFinishedAtMap.get(t.id) || Date.now())) / 1000) : 0;
    const color   = fin ? '#ff3d3d' : '#00c8ff';
    const label   = t.label || '';
    return `
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;
        background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.12);
        border-radius:16px;padding:16px 20px;min-width:150px;">
        ${label ? `<div style="font-size:0.92rem;font-weight:700;color:${color};letter-spacing:0.03em;text-align:center;">${label}</div>` : ''}
        <svg width="130" height="130" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
          <circle cx="60" cy="60" r="54" fill="none"
            stroke="${color}" stroke-width="6"
            stroke-dasharray="${(circ * pct).toFixed(1)} ${circ.toFixed(1)}"
            stroke-linecap="round" transform="rotate(-90 60 60)"
            style="transition:stroke-dasharray 0.9s linear;"/>
          <text x="60" y="66" text-anchor="middle"
            fill="${color}" font-size="${rem >= 3600 ? '16' : '21'}" font-weight="800" font-family="inherit">
            ${fin ? '⏰' : _fmt(rem)}
          </text>
        </svg>
        ${fin ? `
          <div style="font-size:0.78rem;font-weight:700;color:#ff3d3d;">+${_fmt(overdue)} überfällig</div>
          <button onclick="_dismissTimer(${t.id})"
            style="padding:9px 28px;border-radius:10px;background:rgba(255,61,61,0.15);
                   border:1px solid #ff3d3d;color:#ff3d3d;font-weight:800;cursor:pointer;font-size:0.88rem;">
            OK
          </button>` : `
          <button onclick="_cancelTimer(${t.id})"
            style="padding:7px 20px;border-radius:10px;background:rgba(0,200,255,0.06);
                   border:1px solid rgba(0,200,255,0.25);color:rgba(0,200,255,0.7);
                   font-weight:700;cursor:pointer;font-size:0.78rem;">
            Abbrechen
          </button>`}
      </div>`;
  }

  function _showTimerOverlay(timers) {
    let el = document.getElementById('timer-overlay');
    if (!el) {
      el = document.createElement('div');
      el.id = 'timer-overlay';
      el.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:55;background:rgba(5,6,17,0.75);pointer-events:all;';
      const cp = document.getElementById('center-panel');
      if (cp) cp.appendChild(el);
      const faceWrap = document.querySelector('.face-wrap');
      if (faceWrap) faceWrap.style.opacity = '0.06';
    }
    const cols = timers.length <= 1 ? 1 : 2;
    el.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(${cols},auto);gap:16px;padding:16px;">
        ${timers.map(_timerCard).join('')}
      </div>`;
  }

  function _hideTimerOverlay() {
    const el = document.getElementById('timer-overlay');
    if (el) el.remove();
    const faceWrap = document.querySelector('.face-wrap');
    if (faceWrap) faceWrap.style.opacity = '';
    _timerBeepDoneIds.clear();
    _timerFinishedAtMap.clear();
  }

  // Timer-Polling beim Laden prüfen (falls Timer schon läuft)
  setTimeout(async () => {
    try {
      const d = await fetch('/timer/status', { cache: 'no-store' }).then(r => r.json());
      if (d.active && d.timers?.length) {
        for (const t of d.timers) {
          if (t.finished) {
            _timerBeepDoneIds.add(t.id);
            _timerFinishedAtMap.set(t.id, Date.now());
          }
        }
        _startTimerPolling();
        _pollTimer();
      }
    } catch {}
  }, 2000);

  async function openMonthCalendar() {
    let overlay = document.getElementById('month-cal-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'month-cal-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;z-index:8000;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;';
      document.body.appendChild(overlay);
    }
    overlay.style.display = 'flex';
    _calMonth = { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };
    await _renderMonthCal(overlay);
  }

  function closeMonthCalendar() {
    const overlay = document.getElementById('month-cal-overlay');
    if (overlay) overlay.style.display = 'none';
  }

  async function _fetchMonthData(year, month) {
    const r = await fetch(`/calendar/month?year=${year}&month=${month}`, { cache: 'no-store' });
    if (!r.ok) return {};
    return r.json();
  }

  async function _renderMonthCal(overlay) {
    overlay.innerHTML = `<div style="color:var(--muted);font-size:0.85rem;text-align:center;padding:40px;">Lade…</div>`;
    _calData = await _fetchMonthData(_calMonth.year, _calMonth.month);
    const { year, month, events = {}, legend = [] } = _calData;
    const today = new Date();
    const firstDay = new Date(year, month - 1, 1);
    const lastDay  = new Date(year, month, 0);
    // Wochentag des 1. (0=So → umrechnen auf Mo=0)
    let startDow = (firstDay.getDay() + 6) % 7;
    const totalCells = Math.ceil((startDow + lastDay.getDate()) / 7) * 7;

    let cells = '';
    for (let i = 0; i < totalCells; i++) {
      const dayNum = i - startDow + 1;
      const isValid = dayNum >= 1 && dayNum <= lastDay.getDate();
      const dateKey = isValid ? `${year}-${String(month).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}` : '';
      const isToday = isValid && today.getFullYear() === year && today.getMonth() + 1 === month && today.getDate() === dayNum;
      const isSat   = (i % 7) === 5;
      const isSun   = (i % 7) === 6;
      const dayEvents = (events[dateKey] || []).slice(0, 4);
      const moreCount = (events[dateKey] || []).length - 4;
      const eventPills = dayEvents.map(ev => {
        const color = ev.color || '#4285f4';
        const label = ev.is_allday ? ev.title : `${ev.time} ${ev.title}`;
        return `<div style="background:${color};color:#fff;font-size:0.6rem;padding:1px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px;" title="${ev.title}">${label}</div>`;
      }).join('');
      const more = moreCount > 0 ? `<div style="font-size:0.58rem;color:var(--muted);padding-left:3px;">+${moreCount} weitere</div>` : '';
      const cellBg = isToday ? 'rgba(0,200,255,0.10)' : isSat||isSun ? 'var(--surface2)' : 'var(--surface)';
      const dayColor = isToday ? 'var(--accent)' : isSat||isSun ? 'var(--muted)' : 'var(--text)';

      cells += `<div style="
        min-height:90px;border:1px solid var(--border);padding:4px;
        background:${cellBg};
        ${!isValid ? 'opacity:0.25;' : ''}
      ">
        <div style="font-size:0.75rem;font-weight:${isToday?800:500};color:${dayColor};
          ${isToday?'outline:1.5px solid var(--accent);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin-bottom:3px;':'margin-bottom:3px;'}">
          ${isValid ? dayNum : ''}
        </div>
        ${eventPills}${more}
      </div>`;
    }

    overlay.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px 12px;flex-shrink:0;">
        <button onclick="closeMonthCalendar()" style="background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:0.78rem;font-weight:700;cursor:pointer;padding:6px 14px;">SCHLIESSEN</button>
        <div style="display:flex;align-items:center;gap:16px;">
          <button onclick="_calNav(-1)" style="background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:1rem;cursor:pointer;padding:4px 12px;">‹</button>
          <span style="font-size:1.1rem;font-weight:800;color:var(--text);min-width:160px;text-align:center;">${_DE_MONTHS_FULL[month-1]} ${year}</span>
          <button onclick="_calNav(1)" style="background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:1rem;cursor:pointer;padding:4px 12px;">›</button>
        </div>
        <button onclick="_calNav(0)" style="background:rgba(0,200,255,0.1);border:1px solid rgba(0,200,255,0.3);border-radius:8px;color:var(--accent);font-size:0.78rem;font-weight:700;cursor:pointer;padding:6px 14px;">HEUTE</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:0;padding:0 16px 4px;flex-shrink:0;">
        ${_DE_DAYS_SHORT.map((d,i) => `<div style="text-align:center;font-size:0.68rem;font-weight:700;color:var(--muted);padding:4px 0;letter-spacing:0.08em;">${d}</div>`).join('')}
      </div>
      <div style="flex:1;overflow-y:auto;padding:0 16px 8px;">
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">
          ${cells}
        </div>
      </div>
      ${legend.length ? `
      <div style="flex-shrink:0;padding:8px 16px 14px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;">
        ${legend.map(l => `
          <div style="display:flex;align-items:center;gap:5px;">
            <span style="width:10px;height:10px;border-radius:50%;background:${l.color};flex-shrink:0;"></span>
            <span style="font-size:0.65rem;color:var(--muted);white-space:nowrap;">${l.name}</span>
          </div>`).join('')}
      </div>` : ''}`;
  }

  async function _calNav(dir) {
    if (dir === 0) {
      _calMonth = { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };
    } else {
      let m = _calMonth.month + dir;
      let y = _calMonth.year;
      if (m < 1) { m = 12; y--; }
      if (m > 12) { m = 1;  y++; }
      _calMonth = { year: y, month: m };
    }
    const overlay = document.getElementById('month-cal-overlay');
    if (overlay) await _renderMonthCal(overlay);
  }

  async function openPvStats() {

      _showUpgradePrompt({
        title: 'PV-Statistik & Energiefluss',
        text: 'Detaillierte Statistiken (Tag/Woche/Monat/Jahr) und das animierte Energiefluss-Diagramm sind in Erika Plus verfügbar. Der aktuelle Live-Wert bleibt kostenlos.',

  // Drucker-Overlay Auto-Refresh
  let _printerOverlayRefresh = null;

  function _startPrinterOverlayRefresh(box) {
    clearInterval(_printerOverlayRefresh);
    _printerOverlayRefresh = setInterval(async () => {
      if (!box || box.style.display === 'none') { clearInterval(_printerOverlayRefresh); return; }
      const p = await loadPrinterData();
      if (p) renderPrinterOverlayContent(box, p);
    }, 30000);
  }

  function renderPvWidget(pv, fields = {}) {
    if (!pv) return '';
    const show = (key, def = true) => fields[key] !== undefined ? fields[key] : def;
    const fmt = (v, unit) => {
      if (v === undefined || v === null || v === 'unavailable' || v === 'unknown') return '–';
      const n = parseFloat(v);
      return isNaN(n) ? v : (n % 1 === 0 ? n.toLocaleString('de-DE') : n.toLocaleString('de-DE', {maximumFractionDigits: 1})) + (unit ? ' ' + unit : '');
    };
    const gridRow = (() => {
      if (!show('grid') || !pv.grid) return '';
      const gw = parseFloat(pv.grid.value);
      if (isNaN(gw)) return '';
      if (Math.abs(gw) < 5) return `<div class="pv-row"><span class="pv-icon">⇌</span><span class="pv-val">ausgeglichen</span><span class="pv-lbl">Netz</span></div>`;
      const icon = gw > 0 ? '↑' : '↓';
      const lbl  = gw > 0 ? 'Einspeisung' : 'Netzbezug';
      return `<div class="pv-row"><span class="pv-icon">${icon}</span><span class="pv-val">${fmt(Math.abs(gw), 'W')}</span><span class="pv-lbl">${lbl}</span></div>`;
    })();
    const rows = [
      show('power')             && pv.power            && `<div class="pv-row"><span class="pv-icon">⚡</span><span class="pv-val">${fmt(pv.power.value, pv.power.unit)}</span><span class="pv-lbl">Aktuell</span></div>`,
      show('house_consumption') && pv.house_consumption && `<div class="pv-row"><span class="pv-icon">🏠</span><span class="pv-val">${fmt(pv.house_consumption.value, 'W')}</span><span class="pv-lbl">Verbrauch</span></div>`,
      gridRow,
      show('daily')             && pv.daily            && `<div class="pv-row"><span class="pv-icon">☀</span><span class="pv-val">${fmt(pv.daily.value, pv.daily.unit)}</span><span class="pv-lbl">Heute</span></div>`,
      show('battery')           && pv.battery          && `<div class="pv-row"><span class="pv-icon">🔋</span><span class="pv-val">${fmt(pv.battery.value, pv.battery.unit || '%')}</span><span class="pv-lbl">Batterie</span></div>`,
      show('temperature', false) && pv.temperature     && `<div class="pv-row"><span class="pv-icon">🌡</span><span class="pv-val">${fmt(pv.temperature.value, pv.temperature.unit)}</span><span class="pv-lbl">Temperatur</span></div>`,
    ].filter(Boolean).join('');
    let lastUpdateStr = '';
    if (pv.last_update?.value && pv.last_update.value !== 'unavailable' && pv.last_update.value !== 'unknown') {
      const raw = String(pv.last_update.value);
      const ts = Number(raw);
      const d = isNaN(ts) ? new Date(raw) : new Date(ts * (raw.length <= 10 ? 1000 : 1));
      if (!isNaN(d.getTime())) lastUpdateStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
    const lastUpdate = lastUpdateStr ? `<div class="pv-footer">Aktualisiert: ${lastUpdateStr}</div>` : '';
    return `<div class="pv-widget" onclick="openPvStats()" style="cursor:pointer;" title="Statistik anzeigen">${rows}${lastUpdate}</div>`;
  }

  // ── NEWS CENTER ───────────────────────────────────────────
  let _newsInterval = null;

  async function loadNews() {
    try {
      const r = await fetch('/news');
      return r.ok ? await r.json() : null;
    } catch { return null; }
  }

  let _newsFilter = 'all';
  let _lastNewsData = null;
  let _newsCollapsed = false;
  let _newsCollapseInitialized = false;

  function _newsSources(data) {
    return Array.isArray(data?.sources) ? data.sources : [];
  }

  function _newsDisplaySettings(data) {
    const display = data?.display || {};
    return {
      defaultCollapsed: Boolean(display.default_collapsed),
      collapsedCount: Math.max(1, Math.min(parseInt(display.collapsed_count ?? 3, 10) || 3, 10)),
    };
  }

  function _renderNewsFilters(data) {
    const sources = _newsSources(data);
    const dynamicButtons = sources.map(source => `
      <button class="news-filter-btn" id="nf-${source.id}" onclick="_setNewsFilter('${source.id}')">${source.label}</button>
    `).join('');
    return `
      <button class="news-filter-btn active" id="nf-all" onclick="_setNewsFilter('all')">Alle</button>
      ${dynamicButtons}
    `;
  }

  function _setNewsFilter(source) {
    _newsFilter = source;
    document.querySelectorAll('.news-filter-btn').forEach(b => b.classList.remove('active'));
    (document.getElementById('nf-' + source) || document.getElementById('nf-all')).classList.add('active');
    const el = document.getElementById('news-list');
    if (el && _lastNewsData) el.innerHTML = _renderNewsList(_lastNewsData);
  }

  function toggleNewsCollapsed() {
    _newsCollapsed = !_newsCollapsed;
    _applyNewsLayoutState();
    const el = document.getElementById('news-list');
    if (el && _lastNewsData) el.innerHTML = _renderNewsList(_lastNewsData);
  }

  function _applyNewsLayoutState() {
    const cp = document.getElementById('center-panel');
    const nc = document.getElementById('news-center');
    cp?.classList.toggle('news-collapsed', _newsCollapsed);
    cp?.classList.toggle('news-expanded', !_newsCollapsed);
    nc?.classList.toggle('collapsed', _newsCollapsed);
    nc?.classList.toggle('expanded', !_newsCollapsed);
    const toggle = document.getElementById('news-toggle-hint');
    if (toggle) toggle.textContent = _newsCollapsed ? 'Mehr anzeigen' : 'Minimieren';
  }

  function _renderNewsList(data) {
    const items = _newsFilter === 'all'
      ? (data.items || [])
      : (data.items || []).filter(i => i.source_key === _newsFilter);
    if (!items.length) return '<div style="color:var(--muted);font-size:0.78rem;padding:8px 0;">Keine Nachrichten</div>';
    const settings = _newsDisplaySettings(data);
    const visibleItems = _newsCollapsed ? items.slice(0, settings.collapsedCount) : items;
    const hiddenCount = Math.max(0, items.length - visibleItems.length);
    const rows = visibleItems.map(item => {
      const logo = item.icon_url;
      const logoHtml = logo
        ? `<img src="${logo}" class="news-source-logo" alt="${item.source}" onerror="this.style.opacity='0'">`
        : '';
      return `<div class="news-item">
        <div class="news-logo-cell">${logoHtml}</div>
        <div class="news-title">${item.title}</div>
        <div class="news-time">${item.pub_date ? _relTime(item.pub_date) : ''}</div>
      </div>`;
    }).join('');
    return rows + (_newsCollapsed && hiddenCount
      ? `<button class="news-more-row" onclick="toggleNewsCollapsed()">+${hiddenCount} weitere News anzeigen</button>`
      : '');
  }

  function renderNewsItems(data) {
    _lastNewsData = data;
    return _renderNewsList(data);
  }

  async function showNewsCenter() {
    if (!_enabledModules.news) return;
    const cp = document.getElementById('center-panel');
    cp.classList.add('news-mode');
    let nc = document.getElementById('news-center');
    if (!nc) {
      nc = document.createElement('div');
      nc.id = 'news-center';
      cp.appendChild(nc);
    }
    const data = await loadNews();
    if (!_newsCollapseInitialized) {
      _newsCollapsed = _newsDisplaySettings(data).defaultCollapsed;
      _newsCollapseInitialized = true;
    }
    cp.classList.toggle('news-collapsed', _newsCollapsed);
    cp.classList.toggle('news-expanded', !_newsCollapsed);
    nc.innerHTML = `
      <button class="news-section-label news-toggle" onclick="toggleNewsCollapsed()">
        <span>News</span>
        <span id="news-toggle-hint">${_newsCollapsed ? 'Mehr anzeigen' : 'Minimieren'}</span>
      </button>
      <div class="news-filter-bar">
        ${_renderNewsFilters(data)}
      </div>
      <div id="news-list">${renderNewsItems(data)}</div>`;
    _applyNewsLayoutState();
    clearInterval(_newsInterval);
    _newsInterval = setInterval(async () => {
      if (currentMode !== 'idle' || !_isHome()) return;
      const d = await loadNews();
      const el = document.getElementById('news-list');
      if (el) {
        el.innerHTML = renderNewsItems(d);
        _applyNewsLayoutState();
      }
    }, 60 * 1000);
  }

  function hideNewsCenter() {
    clearInterval(_newsInterval);
    const cp = document.getElementById('center-panel');
    cp.classList.remove('news-mode', 'news-collapsed', 'news-expanded');
    const nc = document.getElementById('news-center');
    if (nc) nc.remove();
  }

  // ── CALENDAR SOURCE COLORS ────────────────────────────────
  function calSourceColor(calName) {
    const n = (calName || '').toLowerCase();
    if (n.includes('familie'))    return { bg: 'rgba(0,230,118,0.2)',  fg: '#00e676' };
    if (n.includes('geburtstag')) return { bg: 'rgba(255,171,0,0.2)',  fg: '#ffab00' };
    if (n.includes('feiertag'))   return { bg: 'rgba(120,130,180,0.25)', fg: '#a0aacc' };
    if (n.includes('arbeit') || n.includes('work'))
                                  return { bg: 'rgba(0,200,255,0.2)',  fg: '#00c8ff' };
    // Deterministisch aus Kalendernamen, helle Pastelltöne
    let hash = 0;
    for (const c of calName || '') hash = (hash * 31 + c.charCodeAt(0)) & 0xffff;
    const hue = (hash * 137) % 360;
    return { bg: `hsla(${hue},55%,40%,0.25)`, fg: `hsl(${hue},90%,78%)` };
  }

  // ── CALENDAR CENTER DETAIL ────────────────────────────────
  function showCalendarCenter(cal, focus) {
    const overlay = document.getElementById('cal-overlay');
    if (!overlay) return;
    if (!cal?.days?.length) { clearCalendarCenter(); return; }

    const labelMap = { today: 'Heute', tomorrow: 'Morgen' };
    const targetLabel = labelMap[focus] || 'Heute';
    let day = cal.days.find(d => d.label === targetLabel) || cal.days[0];
    if (!day?.events?.length) { clearCalendarCenter(); return; }

    let html = `<div class="cal-center-header">${(day.weekday||'').toUpperCase()} · ${day.date||''}</div>`;

    day.events.forEach(ev => {
      const timeStr = ev.is_allday
        ? 'Ganztägig'
        : `${ev.time}${ev.end_time ? ' – ' + ev.end_time : ''} Uhr`;
      const loc  = ev.location ? `
        <div class="cal-center-row"><span class="icon">📍</span><span>${ev.location}</span></div>` : '';
      const desc = ev.description ? `
        <div class="cal-center-desc">${ev.description.replace(/\n/g,'<br>')}</div>` : '';
      const col = calSourceColor(ev.calendar);
      const badge = ev.calendar ? `
        <span class="cal-source-badge" style="background:${col.bg};color:${col.fg};">
          ${ev.calendar}
        </span>` : '';

      html += `
        <div class="cal-center-event">
          <div class="cal-center-title">${ev.title}</div>
          <div class="cal-center-row"><span class="icon">🕐</span><span>${timeStr}</span></div>
          ${loc}${desc}${badge}
        </div>`;
    });

    overlay.innerHTML = html;
    overlay.classList.add('active');
  }

  function clearCalendarCenter() {
    const overlay = document.getElementById('cal-overlay');
    if (overlay) { overlay.classList.remove('active', 'weather-expanded'); overlay.innerHTML = ''; }
  }

  // ── PANEL SWITCHER ────────────────────────────────────────
  let weatherOverviewState = { data: null, selectedIndex: 0 };

  function renderWeatherOverview(w, selectedIndex = 0) {
    if (!w) return '<div class="cal-placeholder">Keine Wetterdaten</div>';
    const days = [w.today, w.tomorrow, ...(w.forecast_days || [])].filter(Boolean).slice(0, 7);
    if (!days.length) return '<div class="cal-placeholder">Keine Vorhersage verfuegbar</div>';
    const safeIndex = Math.max(0, Math.min(selectedIndex || 0, days.length - 1));
    const selectedDay = days[safeIndex];
    const hourly = ((w.hourly_by_day || {})[selectedDay.iso_date] || []).slice(0, 24);
    const settings = w.settings || {};
    const showHourTemp = settings.show_hourly_temperature !== false;
    const showHourPop = settings.show_hourly_precip_probability !== false;
    const showHourRain = settings.show_hourly_precipitation !== false;
    const showHourWind = settings.show_hourly_wind !== false;
    if (!days.length) return '<div class="cal-placeholder">Keine Vorhersage verfügbar</div>';
    return `
      <div class="weather-overview">
        <div class="weather-overview-head">
          <div style="display:flex;align-items:center;gap:10px;">
            ${w.coat_of_arms_url ? `<img src="${w.coat_of_arms_url}" alt="Wappen" style="height:36px;width:auto;object-fit:contain;opacity:0.9;" onerror="this.style.display='none'">` : ''}
            <div>
              <div class="weather-overview-kicker">Wetterbericht</div>
              <div class="weather-overview-title">${escapeHTML(w.location || 'Standort')} ${String.fromCharCode(183)} Nächste 7 Tage</div>

          </div>
          <button class="weather-overview-close" onclick="closeWeatherOverview()">Schliessen</button>

            <section class="weather-day-card ${index === safeIndex ? 'active' : ''}" onclick="selectWeatherOverviewDay(${index})">
              <div>
                <div class="weather-day-name">${escapeHTML(day.label || '')}</div>
                <div class="weather-day-date">${escapeHTML((day.date || '').split(',').pop()?.trim() || day.date || '')}</div>
              </div>
              <div class="weather-day-icon">${wmoIcon(day.weathercode)}</div>
              <div class="weather-day-desc">${escapeHTML(day.description || '')}</div>
              <div class="weather-day-temps">
                <span class="temp-high">&uarr;${day.temp_max}&deg;</span>
                <span class="temp-low">&darr;${day.temp_min}&deg;</span>
              </div>
              <div class="weather-day-meta">
                <span>Regen ${day.precipitation ?? 0} mm</span>
                <span>Wind ${day.windspeed_max ?? '-'} km/h</span>
              </div>
            </section>
          `).join('')}
        </div>
        <div class="weather-hourly-panel">
          <div class="weather-hourly-title">Stundenwerte ${String.fromCharCode(183)} ${escapeHTML(selectedDay.label || '')}</div>
          ${hourly.length ? `
            <div class="weather-hourly-scroll">
              ${hourly.map(hour => `
                <div class="weather-hour-card">
                  <div class="weather-hour-time">${escapeHTML(hour.time || '')}</div>
                  <div class="weather-hour-icon">${wmoIcon(hour.code)}</div>

                    ${showHourPop ? `<span>Regen ${hour.precip_prob ?? 0}%</span>` : ''}
                    ${showHourRain ? `<span>Nied. ${hour.precipitation ?? 0} mm</span>` : ''}
                    ${showHourWind ? `<span>Wind ${hour.windspeed ?? '-'} km/h</span>` : ''}
                  </div>` : ''}

    const w = await loadWeather();
    weatherOverviewState = { data: w, selectedIndex: 0 };
    overlay.innerHTML = renderWeatherOverview(w, 0);

    const overlay = document.getElementById('cal-overlay');

  function setPanel(side, label, html) {
    const labelEl   = document.getElementById(side + '-label');
    const contentEl = document.getElementById(side + '-content');
    contentEl.classList.add('fade-out');
    setTimeout(() => {
      labelEl.innerHTML = label;
      contentEl.innerHTML = html;
      contentEl.classList.remove('fade-out');
