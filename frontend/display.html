  async function applyMode(mode, data) {
    if (mode === currentMode) return;  // gleicher Modus → nichts tun
    currentMode = mode;

    clearTimeout(contextTimer);

    if (mode === 'idle') {
      _showCoatOfArms(null);
      clearCalendarCenter();
      showWeatherLeft();
      showCalendarRight();
      showNewsCenter();
      return;
    }

    hideNewsCenter();

    // Context mode — timeout nach 30s zurück zu idle
    contextTimer = setTimeout(() => {
      currentMode = 'idle';
      clearCalendarCenter();
      showWeatherLeft();
      showCalendarRight();
      showNewsCenter();
    }, 30000);

    if (mode === 'football') {
      const team = data?.team || 'darmstadt';
      const submode = data?.submode || 'table';
      const f = await loadFootball(team);
      const leagueName = f?.league?.name || '2. Bundesliga';
      if (submode === 'league_table') {
        const lid = data?.league_id || 'bl2';
        const lt = await loadLeagueTable(lid);
        const ln = lt?.league?.name || leagueName;
        setPanel('left', ln, renderLeagueOverview(lt));
        setPanel('right', ln + ' · Tabelle', renderFootballTable(lt));
      } else if (submode === 'match') {
        setPanel('left', 'Letztes Spiel', renderFootballMatch(f));
        setPanel('right', leagueName + ' · Tabelle', renderFootballTable(f));
      } else {
        setPanel('left', f?.team?.name || 'Team', renderFootballTeamPanel(f));
        setPanel('right', leagueName + ' · Tabelle', renderFootballTable(f));
      }
    }

    if (mode === 'calendar') {
      const focus = data?.focus || 'today';
      const [cal, w] = await Promise.all([loadCalendar(), loadWeather()]);
      // Links: Wetter (wie idle)
      document.getElementById('left-label').textContent = 'Wetter · ' + (w?.location || '');
      document.getElementById('left-content').innerHTML = renderWeather(w) + renderFuelPrice(await loadFuel());
      // Mitte: Termin-Details (Gesicht ausgeblendet)
      showCalendarCenter(cal, focus);
      // Rechts: Kalenderübersicht
      setPanel('right', 'Kalender', renderCalendarData(cal));
    }

    if (mode === 'weather_detail') {
      const submode = data?.submode || 'current';
      const loc = data?.location || null;
      const locParam = loc ? `&location=${encodeURIComponent(loc)}` : '';
      const resp = await fetch(`/weather?_=${Date.now()}${locParam}`, { cache: 'no-store' });
      const w = resp.ok ? await resp.json() : _lastWeatherData;
      // Wappen anzeigen wenn verfügbar (aus State oder Weather-Response)
      const coatUrl = data?.coat_of_arms_url || w?.coat_of_arms_url || null;
      _showCoatOfArms(coatUrl);
      if (submode === 'tomorrow' && w?.tomorrow) {
        setPanel('left',  'Morgen · ' + (w.location || ''), renderWeatherDay(w.tomorrow, true));
        setPanel('right', 'Nächste Tage', renderWeatherForecast(w));
      } else {
        setPanel('left',  'Wetter · ' + (w?.location || ''), renderWeather(w));
        setPanel('right', 'Vorhersage', renderWeatherForecast(w));
      }
    }
  }

  // ── DISPLAY STATE POLLING ─────────────────────────────────
  let _lightsAutoReturnTimer = null;
  let _backendOffline = false;

  function _setOffline(offline) {
    if (offline === _backendOffline) return;
    _backendOffline = offline;
    const banner = document.getElementById('offline-banner');
    if (banner) banner.style.display = offline ? 'flex' : 'none';
  }

  async function pollDisplayState() {
    try {
      const state = await fetch('/display/state', { cache: 'no-store' }).then(r => r.json());
      _setOffline(false);
      applyAppHash(state.app_hash);
      applyModuleVisibility(state.modules, state.calendar_config);
      applyConfigVersion(state.config_version);
      if (state.mode === 'notes') {
        if (!document.getElementById('notes-overlay')) toggleNotesOverlay();
      } else if (state.mode === 'lights') {
        // Sprachbefehl hat Licht gesteuert → Lichtansicht zeigen
        if (_navMode !== 'lights') {
          navTo('lights');  // startet _startLightsPolling() intern
        } else {
          refreshLightsView();
        }
        // Auto-Return: nur setzen wenn noch kein Timer läuft
        // (läuft bereits → bestehenden Timer weiterlaufen lassen)
        if (!_lightsAutoReturnTimer) {
          _lightsAutoReturnTimer = setTimeout(() => {
            _lightsAutoReturnTimer = null;
            if (_navMode === 'lights') navTo('home');
          }, 10000);
        }
      } else if (_navMode !== 'lights' && _navMode !== 'cameras' && _navMode !== 'robots' && state.mode !== currentMode) {
        applyMode(state.mode, state);
      }
    } catch {
      _setOffline(true);
    }
  }

  // ── REPLY TEXT (live Untertitel aus LLM) ──────────────────
  let _lastReplyText = null;   // zuletzt GEZEIGTER Text (bleibt gesetzt bis API null liefert)
  let _replyHideTimer = null;

  function showReplyText(text, done) {
    const el = document.getElementById('speech-text');
    clearTimeout(_replyHideTimer);

    el.innerHTML = '';
    el.classList.add('visible');
    el.appendChild(document.createTextNode(text));

    if (!done) {
      const cursor = document.createElement('span');
      cursor.className = 'speech-cursor';
      el.appendChild(cursor);
    } else {
      // Anzeigedauer: min 12s, ~70ms pro Zeichen
      const duration = Math.max(12000, text.length * 70);
      _replyHideTimer = setTimeout(() => {
        el.classList.remove('visible');
        // _lastReplyText NICHT null setzen — verhindert erneutes Anzeigen
        // solange API denselben Text zurückgibt (TTL noch nicht abgelaufen)
        setTimeout(() => { el.innerHTML = ''; }, 400);
      }, duration);
    }
  }

  async function pollReplyText() {
    try {
      const d = await fetch('/reply/latest').then(r => r.json());
      const text = d?.text || null;
      const done = d?.done !== false;
      if (text && text !== _lastReplyText) {
        // Neuer Text → anzeigen und als "gezeigt" merken
        _lastReplyText = text;
        showReplyText(text, done);
      } else if (!text && _lastReplyText) {
        // Backend-TTL abgelaufen → Reset, bereit für nächste Antwort
        _lastReplyText = null;
        clearTimeout(_replyHideTimer);
        const el = document.getElementById('speech-text');
        el.classList.remove('visible');
        el.innerHTML = '';
      }
    } catch {}
  }

  // ── TTS AUDIO — Streaming Queue (iOS + Desktop) ──────────
  // Primär: Web Audio API (AudioContext) — einmal beim User-Klick aktiviert,
  // bleibt dauerhaft aktiv → kein Autoplay-Problem auf Edge/Chrome.
  // iOS-Fallback: HTML-Audio-Element + silent-WAV-Unlock.
  const _ttsAudio = document.getElementById('tts-audio');
  let _audioCtx = null;
  let _audioUnlocked = false;
  let _ttsQueue = [];
  let _ttsPlaying = false;
  let _ttsBuf = '';
  let _currentSource = null;  // Laufende AudioBufferSourceNode

  function unlockAudio() {
    if (_audioUnlocked) return;
    if (!_audioCtx) {
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    _audioCtx.resume().then(() => { _audioUnlocked = true; }).catch(() => {});

    if (_ttsAudio) {
      const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
      _ttsAudio.src = SILENT;
      _ttsAudio.play().then(() => { _ttsAudio.pause(); }).catch(() => {});
    }
  }

  let _prefetchCache = {};  // text → ArrayBuffer (Voraus-Synthese)

  function resetTts() {
    _ttsQueue = [];
    _ttsPlaying = false;
    _ttsBuf = '';
    _prefetchCache = {};
    if (_currentSource) {
      try { _currentSource.onended = null; _currentSource.stop(); } catch {}
      _currentSource = null;
    }
  }

  let _ttsFormat = 'audio/wav';

  async function _synthesize(text) {
    const r = await fetch('/tts/synthesize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) throw new Error('TTS failed');
    _ttsFormat = r.headers.get('X-TTS-Format') === 'mp3' ? 'audio/mpeg' : 'audio/wav';
    return r.arrayBuffer();
  }

  function _setSpeaking(on) {
    document.body.classList.toggle('erika-speaking', on);
  }

  async function _playNext() {
    if (_ttsPlaying || _ttsQueue.length === 0) return;
    _ttsPlaying = true;
    _setSpeaking(true);
    const text = _ttsQueue.shift();

    // Nächsten Chunk parallel vorab synthetisieren
    if (_ttsQueue.length > 0) {
      const next = _ttsQueue[0];
      if (!_prefetchCache[next]) {
        _synthesize(next).then(buf => { _prefetchCache[next] = buf; }).catch(() => {});
      }
    }

    let _doneGuard = null;
    const done = () => {
      clearTimeout(_doneGuard);
      _ttsPlaying = false;
      if (_ttsQueue.length === 0) _setSpeaking(false);
      _playNext();
    };
    // Watchdog: nach 30s force-done wenn Audio steckt
    _doneGuard = setTimeout(() => {
      if (_ttsPlaying) {
        fetch('/tts/watchdog', { method: 'POST' }).catch(() => {});
        done();
      }
    }, 30_000);

    try {
      const buf = _prefetchCache[text] || await _synthesize(text);
      delete _prefetchCache[text];

      // Blob-URL aus ArrayBuffer — für beide Wiedergabe-Wege nutzbar
      const fmt  = _ttsFormat || 'audio/wav';
      const blob = new Blob([buf], { type: fmt });
      const url  = URL.createObjectURL(blob);

      // ── Weg 1: _ttsAudio (durch silent-WAV bereits aktiviert) ──
      // Dieses Element wurde in unlockAudio() einmal mit play() aktiviert,
      // sodass Edge/Chrome kein User-Gesture mehr für spätere plays verlangt.
      if (_ttsAudio && _audioUnlocked) {
        _ttsAudio.onended = null;
        _ttsAudio.onerror = null;
        _ttsAudio.src = url;
        _ttsAudio.onended = () => { URL.revokeObjectURL(url); done(); };
        _ttsAudio.onerror = (e) => {
          console.warn('[TTS] _ttsAudio error:', e);
          URL.revokeObjectURL(url);
          done();
        };
        try {
          await _ttsAudio.play();
          return;
        } catch (e) {
          console.warn('[TTS] _ttsAudio.play() blocked:', e.name, '— versuche AudioContext');
          URL.revokeObjectURL(url);
          _ttsAudio.onended = _ttsAudio.onerror = null;
        }
      }

      // ── Weg 2: Web Audio API (AudioContext) ──
      const ctx = _audioCtx;
      if (ctx) {
        try {
          if (ctx.state !== 'running') await ctx.resume();
          // Blob nochmal holen (URL war revoked) — neu synthetisieren
          const buf2 = await _synthesize(text);
          const audioBuf = await ctx.decodeAudioData(buf2);
          const source = ctx.createBufferSource();
          _currentSource = source;
          source.buffer = audioBuf;
          source.connect(ctx.destination);
          source.onended = () => { if (_currentSource === source) _currentSource = null; done(); };
          source.start();
          return;
        } catch (e) {
          console.warn('[TTS] AudioContext failed:', e);
        }
      }

      console.error('[TTS] Kein Wiedergabe-Weg verfügbar. unlockAudio() aufgerufen?', _audioUnlocked);
      done();
    } catch (e) {
      console.warn('[TTS] _playNext Fehler:', e);
      _ttsPlaying = false;
      _playNext();
    }
  }

  function enqueueTts(text) {
    const t = (text || '').trim().replace(/\s+/g, ' ');
    if (t.length < 2) return;
    _ttsQueue.push(t);
    _playNext();
    // Alle Chunks in der Queue gleichzeitig vorab synthetisieren → keine Lücken
    _ttsQueue.forEach(chunk => {
      if (!_prefetchCache[chunk]) {
        _synthesize(chunk).then(buf => { _prefetchCache[chunk] = buf; }).catch(() => {});
      }
    });
  }

  // Chunking: größere Stücke = weniger Anfragen = flüssigere Wiedergabe
  function feedTts(chunk, flush = false) {
    _ttsBuf += chunk;

    // Flush mit komplettem Text unter 600 Zeichen → als ein einziger TTS-Request
    if (flush && _ttsBuf.trim().length > 1 && _ttsBuf.trim().length <= 600) {
      enqueueTts(_ttsBuf.trim());
      _ttsBuf = '';
      return;
    }

    // Erster Chunk: 20 Zeichen für schnellen Start
    // Folge-Chunks: 60 Zeichen — größer = weniger Lücken zwischen Chunks
    const isFirst = _ttsQueue.length === 0 && !_ttsPlaying;
    const minLen  = isFirst ? 20 : 60;

    const patterns = [
      /^(.+?[.!?])\s/,                    // Satzende — immer sofort
      new RegExp(`^(.{${minLen},}?[,;:])\\ `), // Pause bei min. Zeichen
    ];

    let changed = true;
    while (changed && _ttsBuf.length >= minLen) {
      changed = false;
      for (const p of patterns) {
        const m = p.exec(_ttsBuf);
        if (m) {
          enqueueTts(m[1]);
          _ttsBuf = _ttsBuf.slice(m[0].length);
          changed = true;
          break;
        }
      }
      // Kein Muster → Wortgrenze-Schnitt wenn Buffer zu lang
      if (!changed && _ttsBuf.length >= 100) {
        const cut = _ttsBuf.lastIndexOf(' ', 100);
        if (cut > minLen) {
          enqueueTts(_ttsBuf.slice(0, cut));
          _ttsBuf = _ttsBuf.slice(cut + 1);
          changed = true;
        }
      }
    }

    if (flush && _ttsBuf.trim().length > 1) {
      enqueueTts(_ttsBuf.trim());
      _ttsBuf = '';
    }
  }

  function playTts(text) { enqueueTts(text); }

  // ── DISPLAY INPUT (Sprache + Text) ───────────────────────
  const _SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let _recognition = null;
  let _chatBusy = false;

  function resetMicState() {
    const micBtn  = document.getElementById('nav-mic');
    const micIcon = document.getElementById('mic-icon');
    const micLbl  = document.getElementById('mic-label');
    if (micBtn)  micBtn.classList.remove('listening');
    if (micIcon) micIcon.textContent = '🎤';
    if (micLbl)  micLbl.textContent  = 'Sprechen';
  }

  // Sprache nur über HTTPS möglich — bei HTTP direkt Texteingabe
  // localhost gilt auch als sicher (für lokale Entwicklung)
  const _secureContext = location.protocol === 'https:' || location.hostname === 'localhost';
  const _canUseMic = _SR && _secureContext;

  let _listening = false;
  let _interimText = '';
  let _bestFinal   = '';

  function startInput() {
    unlockAudio();  // iOS: Audio während User-Geste entsperren
    if (_chatBusy) return;
    if (_listening) {
      stopSpeech();
      return;
    }
    if (_canUseMic) {
      startSpeech();
    } else {
      openTextOverlay();
    }
  }

  function stopSpeech() {
    _listening = false;  // ZUERST setzen, damit onend nicht erneut startet
    if (_recognition) { try { _recognition.stop(); } catch {} }
  }

  function startSpeech() {
    if (_recognition) { try { _recognition.abort(); } catch {} _recognition = null; }

    _listening  = true;
    _interimText = '';
    _bestFinal   = '';

    const micBtn  = document.getElementById('nav-mic');
    const micIcon = document.getElementById('mic-icon');
    const micLbl  = document.getElementById('mic-label');
    micBtn.classList.add('listening');
    micIcon.textContent = '⏹';
    micLbl.textContent  = 'Tippen = Stop';

    const wave = document.createElement('div');
    wave.id = 'wave-indicator';
    wave.style.cssText = 'position:fixed;bottom:64px;left:50%;transform:translateX(-50%);' +
      'display:flex;gap:5px;align-items:center;z-index:300;' +
      'background:rgba(255,61,61,0.15);border:1px solid rgba(255,61,61,0.4);' +
      'border-radius:20px;padding:8px 20px;';
    wave.innerHTML = [20,32,16,40,24].map(h =>
      `<div style="width:4px;height:${h}px;background:var(--danger);border-radius:2px;` +
      `animation:wave-bar 0.6s ease-in-out infinite alternate;` +
      `animation-delay:${Math.random()*0.4}s"></div>`
    ).join('') + '<span style="font-size:0.8rem;color:var(--danger);margin-left:10px;font-weight:700;">Höre zu …</span>';
    document.body.appendChild(wave);

    let _silenceTimer = null;
    const SILENCE_MS  = 3000;

    const resetSilenceTimer = () => {
      clearTimeout(_silenceTimer);
      _silenceTimer = setTimeout(() => { if (_listening) stopSpeech(); }, SILENCE_MS);
    };
    resetSilenceTimer();

    // Erstellt eine neue Recognition-Instanz und startet sie.
    // continuous: false → eine Äußerung = ein sauberes Ergebnis, wie native Android STT.
    // onend startet sofort neu solange _listening = true.
    function _makeRec() {
      const r = new _SR();
      r.lang = 'de-DE';
      r.continuous     = false;
      r.interimResults = true;

      r.onresult = (e) => {
        _lastSpeechAt = Date.now();
        _scheduleProactive(); // Proaktiv-Timer zurücksetzen bei Aktivität
        let interim = '';
        for (let i = 0; i < e.results.length; i++) {
          const t = e.results[i][0].transcript.trim();
          if (e.results[i].isFinal) {
            if (t) _interimText = (_interimText ? _interimText + ' ' : '') + t;
          } else {
            interim = t;
          }
        }
        const display = (_interimText + (interim ? ' ' + interim : '')).trim();
        if (display) showReplyText('🎤 ' + display, false);
        resetSilenceTimer();
      };

      r.onend = () => {
        if (_listening) {
          // Session natürlich beendet (Pause) → kurz warten dann neue Session
          // Das erlaubt dem Nutzer eine natürliche Sprechpause ohne sofort zu senden
          setTimeout(() => {
            if (!_listening) return;  // stopSpeech() wurde inzwischen aufgerufen
            try {
              const next = _makeRec();
              _recognition = next;
              next.start();
            } catch {}
          }, 100);
        } else {
          // stopSpeech() wurde aufgerufen → finalisieren und senden
          clearTimeout(_silenceTimer);
          finishListening();
          const text = _interimText.trim();
          if (text) {
            sendToDisplay(text);
          } else {
            openTextOverlay('Nichts erkannt — bitte Text eingeben.');
          }
        }
      };

      r.onerror = (e) => {
        if (e.error === 'no-speech') return;  // normal, onend startet neu
        if (e.error === 'not-allowed') {
          _listening = false;
          finishListening();
          openTextOverlay('Kein Mikrofon-Zugriff.');
        } else if (e.error !== 'aborted') {
          _listening = false;
          clearTimeout(_silenceTimer);
          finishListening();
          if (_interimText.trim()) sendToDisplay(_interimText.trim());
          else openTextOverlay('Fehler: ' + e.error);
        }
      };

      return r;
    }

    try {
      const first = _makeRec();
      _recognition = first;
      first.start();
    } catch {
      finishListening();
      openTextOverlay('Mikrofon nicht verfügbar.');
    }
  }

  function finishListening() {
    _listening = false;
    _recognition = null;
    resetMicState();
    const wave = document.getElementById('wave-indicator');
    if (wave) wave.remove();
  }

  function openTextOverlay(hint) {
    const overlay = document.getElementById('input-overlay');
    const hintEl  = document.getElementById('input-hint');
    const input   = document.getElementById('input-text');
    if (hintEl) hintEl.textContent = hint || 'Sprich oder tippe deine Nachricht';
    if (input)  input.value = '';
    overlay.classList.add('visible');
    setTimeout(() => input?.focus(), 150);
  }

  function closeInput() {
    document.getElementById('input-overlay').classList.remove('visible');
    if (_recognition) { try { _recognition.abort(); } catch {} _recognition = null; }
    resetMicState();
  }

  function submitInput() {
    unlockAudio();
    const text = (document.getElementById('input-text')?.value || '').trim();
    closeInput();
    if (text) sendToDisplay(text);
  }

  // Enter → Senden, Shift+Enter → Zeilenumbruch
  setTimeout(() => {
    document.getElementById('input-text')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitInput(); }
    });
    // Icon anpassen wenn kein Mikrofon verfügbar
    if (!_canUseMic) {
      const icon = document.getElementById('mic-icon');
      const lbl  = document.getElementById('mic-label');
      if (icon) icon.textContent = '⌨️';
      if (lbl)  lbl.textContent  = 'Eingabe';
    }
  }, 500);

  async function sendToDisplay(text) {
    if (_chatBusy || !text) return;
    _chatBusy = true;
    resetTts();

    const personName = _activePersonName || null;
    showReplyText('🎤 ' + text, false);

    try {
      const resp = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, person_name: personName }),
      });

      if (!resp.ok) throw new Error('Chat error');
      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let fullReply = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const d = JSON.parse(line.slice(6));
            if (d.text) {
              fullReply += d.text;
              showReplyText(fullReply, false);
              feedTts(d.text);          // Sofort in TTS-Queue
            }
            if (d.reply) {
              fullReply = d.reply;
              showReplyText(fullReply, true);
              feedTts('', true);        // Rest aus Buffer abspielen
            }
          } catch {}
        }
      }
    } catch (e) {
      showReplyText('Fehler: ' + e.message, true);
    } finally {
      _chatBusy = false;
      // Timer-Polling starten falls gerade ein Timer gesetzt wurde
      _pollTimer();
    }
  }

  // ── NAVIGATION ────────────────────────────────────────────
  let _navMode = 'home';
  // Letzten bekannten Modul-Zustand aus localStorage laden (kein Flash beim Navigieren)
  let _enabledModules = (() => {
    try {
      const saved = JSON.parse(localStorage.getItem('erika_modules') || 'null');
      if (saved && typeof saved === 'object') return saved;
    } catch {}
    return { news: false, lights: false, vehicles: false, robots: false, cameras: false, calendar: true, pv: false, printer: false };
  })();
  let _calendarOpenTrigger = 'both';
  let _activePersonName = null;
  let _personDropdownOpen = false;

  async function togglePersonDropdown() {
    const dd = document.getElementById('person-dropdown');

      dd.innerHTML = items.map(p => `

          font-weight:${_activePersonName === p.name ? 700 : 400};
          background:${_activePersonName === p.name ? 'rgba(0,200,255,0.08)' : 'transparent'};
        " onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='${_activePersonName === p.name ? 'rgba(0,200,255,0.08)' : 'transparent'}'">
          ${p.label}
        </div>`).join('');
    } catch {
      dd.innerHTML = '<div style="padding:8px 14px;font-size:0.72rem;color:#ff3d3d;">Fehler</div>';
    }
  }

  let _greetingPersonId = null; // Person-ID der aktuell aktiven Person (für Greeting)
  let _lastSpeechAt = Date.now(); // Zeitpunkt der letzten Spracheingabe
  let _proactiveTimer = null;    // Timer für proaktive Ansprache

  async function setActivePerson(name) {
    const dd = document.getElementById('person-dropdown');
    if (dd) dd.style.display = 'none';
    _personDropdownOpen = false;
    const prev = _activePersonName;
    try {
      await fetch('/active-person', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name || null }),
      });
      _activePersonName = name || null;
      if (!name) _greetingPersonId = null;
      document.getElementById('sb-person').textContent = name || 'N/A';

      if (name && name !== prev) {
        // Person gewechselt → Audio entsperren (Browser-Policy) und Begrüßung anfragen
        unlockAudio();
        _triggerGreeting(name);
      }
      _scheduleProactive();
    } catch {}
  }

  async function _triggerGreeting(name) {
    try {
      // Person-ID herausfinden und global speichern
      const d = await fetch('/profiles').then(r => r.json());
      const person = (d.items || []).find(p => p.name === name);
      if (!person) return;
      _greetingPersonId = person.id;
      const g = await fetch(`/profiles/${person.id}/greeting`).then(r => r.json());
      if (g && g.text && !g.skip) {
        _speakText(g.text);
      }
    } catch {}
  }

  function _speakText(text) {
    if (!text) return;
    // Sicherstellen dass der TTS-Buffer leer ist bevor die Begrüßung rein kommt
    if (_ttsBuf && _ttsBuf.trim()) feedTts('', true);
    feedTts(text, true);
  }

  function _scheduleProactive() {
    if (_proactiveTimer) clearTimeout(_proactiveTimer);
    if (!_activePersonName) return;
    // Nach 25 Minuten Stille proaktiv ansprechen
    _proactiveTimer = setTimeout(_triggerProactive, 25 * 60 * 1000);
  }

  async function _triggerProactive() {
    if (!_activePersonName || _ttsPlaying || _chatBusy || _listening) return;
    // Nur wenn wirklich lange keine Eingabe war
    const silentMins = (Date.now() - _lastSpeechAt) / 60000;
    if (silentMins < 20) { _scheduleProactive(); return; }
    // Zeitfenster-Prüfung
    const att = _attentionConfig || {};
    // Tägliches Fazit: prüfen ob Abend-Recap-Zeit innerhalb ±10 Minuten
    if (att.evening_recap_enabled && att.evening_recap_time) {
      const _now = new Date();
      const _cur = _now.getHours() * 60 + _now.getMinutes();
      const [_rh, _rm] = att.evening_recap_time.split(':').map(Number);
      const _recapMin = _rh * 60 + _rm;
      if (Math.abs(_cur - _recapMin) <= 10) {
        const _todayKey = 'erika_evening_recap_' + _now.toISOString().slice(0, 10);
        if (!localStorage.getItem(_todayKey)) {
          localStorage.setItem(_todayKey, '1');
          const _recapText = 'Wie war dein Tag heute?';
          try {
            await fetch('/chat/log', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ role: 'assistant', message: _recapText, person_name: _activePersonName }),
            });
          } catch {}
          _speakText(_recapText);
          _proactiveTimer = setTimeout(_triggerProactive, 30 * 60 * 1000);
          return;
        }
      }
    }
    if (att.proactive_enabled === false) return;
    if (att.proactive_start && att.proactive_end) {
      const now = new Date();
      const cur = now.getHours() * 60 + now.getMinutes();
      const [sh, sm] = att.proactive_start.split(':').map(Number);
      const [eh, em] = att.proactive_end.split(':').map(Number);
      const start = sh * 60 + sm, end = eh * 60 + em;
      const inWindow = start <= end ? (cur >= start && cur < end) : (cur >= start || cur < end);
      if (!inWindow) { _scheduleProactive(); return; }
    }
    try {
      const d = await fetch('/profiles').then(r => r.json());
      const person = (d.items || []).find(p => p.name === _activePersonName);
      if (!person) return;
      const g = await fetch(`/profiles/${person.id}/greeting`).then(r => r.json());
      if (g && g.text && !g.skip) {
        _speakText(g.text);
      }
    } catch {}
    // Nächste proaktive Ansprache erst nach weiterer Pause
    _proactiveTimer = setTimeout(_triggerProactive, 30 * 60 * 1000);
  }

  document.addEventListener('click', (e) => {
    if (_personDropdownOpen && !e.target.closest('#person-dropdown') && !e.target.closest('.status-item')) {

  let _selectedGroup = null;

  let _vehiclesData = [];
  let _selectedVehicle = null;

      vehicles: modules?.vehicles === true,
      robots:   modules?.robots   === true,
      cameras:  modules?.cameras  === true,
      calendar: modules?.calendar !== false,  // default true
      pv:       modules?.pv       === true,

    const calChanged = (_enabledModules.calendar !== false) !== prevCal;

    if ((calChanged || pvChanged) && currentMode === 'idle' && _navMode === 'home') {

    const lightsBtn = document.getElementById('nav-lights');

  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    }[ch]));
  }

  function escapeAttr(value) {
    return escapeHTML(value).replace(/`/g, '&#96;');

  async function showVehiclesView() {

    await _renderVehiclesView(vehicles);
    _vehiclesInterval = setInterval(async () => {
      if (_navMode !== 'vehicles') return;
      const data = await loadVehiclesData();
      await _renderVehiclesView(data);
    }, 30000);
  }

  async function _renderVehiclesView(vehicles) {
    document.getElementById('left-label').textContent = 'Fahrzeuge';
    const lc = document.getElementById('left-content');
    lc.style.overflowY = 'auto';
    lc.innerHTML = renderVehicleList(vehicles || []);

    const vehicle = (vehicles || []).find(v => v.id === _selectedVehicle) || (vehicles || [])[0] || null;
    if (vehicle && !_selectedVehicle) _selectedVehicle = vehicle.id;

    const overlay = document.getElementById('cal-overlay');
    if (!overlay) return;
    if (!vehicle) {
      overlay.innerHTML = '<div class="vehicle-empty">Keine Fahrzeuge konfiguriert.</div>';
      overlay.classList.add('active');
      setPanel('right', 'Fahrzeuge', '<div class="cal-placeholder">Keine Fahrzeugdaten vorhanden.</div>');
      return;
    }

    const history = await loadVehicleHistory(vehicle.id);
    if (_vehicleMapExpanded) {
      overlay.innerHTML = renderVehicleMapExpanded(vehicle, history);
      overlay.classList.add('active', 'vehicle-map-expanded');
      setTimeout(() => initVehicleMap(vehicle, history, 'vehicle-map-expanded'), 80);
      return;
    }

    _vehHistSave(vehicle.id);  // Zustand vor Re-Render in JS-Cache sichern
    overlay.innerHTML = renderVehicleDetail(vehicle, history);
    overlay.classList.add('active');
    overlay.classList.remove('vehicle-map-expanded');
    _vehHistRestore(vehicle.id);  // Zustand aus JS-Cache wiederherstellen

    setPanel('right', 'Karte', renderVehicleHistoryPanel(vehicle, history));
    setTimeout(() => initVehicleMap(vehicle, history, 'vehicle-map'), 380);
    if (vehicle.ev_profile_enabled) {
      const cap = vehicle.battery_capacity_kwh || null;
      showVehicleChargingTab(vehicle.id, '7days', cap);
    }
  }

  function renderVehicleList(vehicles) {
    if (!vehicles.length) return '<div class="cal-placeholder">Keine Fahrzeuge gefunden</div>';
    return vehicles.map(v => {
      const selected = v.id === _selectedVehicle ? ' selected' : '';
      const activity = vehicleStateLabel(v.activity?.state || v.location?.state || 'unbekannt');
      const battery = v.battery ? `${v.battery.state}${v.battery.unit || '%'}` : (v.fuel_level ? `${v.fuel_level.state}${v.fuel_level.unit || '%'}` : '');
      return `
        <div class="vehicle-list-item${selected}" onclick="selectVehicle('${escapeAttr(v.id)}')">
          <span class="vehicle-dot"></span>
          <div style="flex:1;min-width:0;">
            <div class="vehicle-list-name">${escapeHTML(v.label || v.id)}</div>
            <div class="vehicle-list-sub">${escapeHTML(activity)}</div>
          </div>
          <span class="vehicle-list-meta">${escapeHTML(battery)}</span>
        </div>`;
    }).join('');
  }

  function renderVehicleDetail(vehicle, history) {
    const energyEntity = vehicle.battery || vehicle.fuel_level || null;
    const batteryPct = parseFloat(energyEntity?.state ?? '0');
    const hasBattery = Number.isFinite(batteryPct) && energyEntity;
    const adblueVal = parseFloat(vehicle.adblue_level?.state ?? 'NaN');
    const adblueUnitDet = (vehicle.adblue_level?.unit || '').trim() || '%';
    const adblueIsKmDet = adblueUnitDet.toLowerCase() === 'km';
    const hasAdblue = Number.isFinite(adblueVal) && vehicle.adblue_level;
    const location = vehicle.location;
    const statusLabel = vehicleStateLabel(vehicle.activity?.state || location?.state || 'aktiv');
    const coreRows = [];
    const evRows = [];
    if (vehicle.odometer) coreRows.push(['Kilometerstand', `${vehicle.odometer.state} ${vehicle.odometer.unit || ''}`]);
    coreRows.push(['Status', statusLabel]);
    if (vehicle.range) evRows.push(['Reichweite', `${vehicle.range.state} ${vehicle.range.unit || ''}`]);
    if (vehicle.fuel_level) evRows.push(['Tank', `${vehicle.fuel_level.state} ${vehicle.fuel_level.unit || '%'}`]);
    if (vehicle.adblue_level) evRows.push(['AdBlue', `${vehicle.adblue_level.state} ${adblueUnitDet}`]);
    if (vehicle.charging) evRows.push(['Ladestatus', vehicleChargeStateLabel(vehicle.charging.state)]);
    if (vehicle.remaining_charge_time) evRows.push(['Restladezeit', formatMinutesAsHHMM(vehicle.remaining_charge_time.state)]);
    const plugState = (vehicle.plug?.state || '').toLowerCase();
    const chargingState = (vehicle.charging?.state || '').toLowerCase();
    const _NOT_CHARGING = ['off','false','0','not_in_charge','not charging','no_charging','charge error','charge_error','stopped'];
    const _PLUGGED_STATES = ['on','plugged_in','connected','true','1','charging','in_charge','plugged','charge error','charge_error'];
    // Stecker gesteckt = Steckerzustand-Sensor sagt "drin" ODER kein Steckersensor aber Ladestatus ist charging/plugged
    const isPlugged = _PLUGGED_STATES.includes(plugState)
                   || (!vehicle.plug && ['charging','in_charge','plugged_in'].includes(chargingState));
    // Lädt wirklich = Stecker drin UND Ladezustand ist KEIN explizites "nicht laden"
    const isActuallyCharging = isPlugged && !_NOT_CHARGING.includes(chargingState);
    // Stecker drin aber nicht am Laden → "Laden starten" anzeigen
    const canStartCharging = isPlugged && _NOT_CHARGING.includes(chargingState);
    const capacityKwh = vehicle.battery_capacity_kwh || null;
    const capArg = capacityKwh ? capacityKwh : 'null';

    const actions = [];
    if (vehicle.climate_button_entity) {
      actions.push(`<button class="vehicle-action-btn" onclick="pressVehicleButton('${escapeAttr(vehicle.climate_button_entity)}', this, 'Klima gestartet')">&#127777; Klima starten</button>`);
    }
    if (vehicle.start_charging_button_entity && canStartCharging) {
      actions.push(`<button class="vehicle-action-btn vehicle-action-btn--success" onclick="pressVehicleButton('${escapeAttr(vehicle.start_charging_button_entity)}', this, 'Ladevorgang gestartet')">&#9889; Laden starten</button>`);
    }
    if (vehicle.stop_charging_button_entity && isActuallyCharging) {
      actions.push(`<button class="vehicle-action-btn vehicle-action-btn--danger" onclick="pressVehicleButton('${escapeAttr(vehicle.stop_charging_button_entity)}', this, 'Ladevorgang gestoppt')">&#9211; Laden stoppen</button>`);
    }

    const chartSection = vehicle.ev_profile_enabled ? `
      <div style="margin-top:18px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <div style="font-size:0.62rem;color:var(--muted);letter-spacing:0.1em;">LADEVERLAUF</div>
          <div style="display:flex;gap:10px;">
            <span id="veh-tab-7days" style="font-size:0.72rem;cursor:pointer;font-weight:800;color:var(--accent);"
              onclick="showVehicleChargingTab('${escapeAttr(vehicle.id)}','7days',${capArg})">7 Tage</span>
            <span id="veh-tab-month" style="font-size:0.72rem;cursor:pointer;color:var(--muted);"
              onclick="showVehicleChargingTab('${escapeAttr(vehicle.id)}','month',${capArg})">Monat</span>
          </div>
        </div>
        <div id="veh-chart-inner" style="min-height:60px;">
          <div style="color:var(--muted);font-size:0.78rem;text-align:center;padding:18px 0;">Lade…</div>
        </div>
      </div>` : '';

    return `
      <div class="vehicle-detail-wrap">
        <div class="vehicle-detail-header">
          <div>
            <div class="vehicle-detail-kicker">Fahrzeug</div>
            <div class="vehicle-detail-title">${escapeHTML(vehicle.label || vehicle.id)}</div>
          </div>
          <div class="vehicle-state-pill">${escapeHTML(statusLabel)}</div>
        </div>
        ${hasBattery ? `
          <div class="vehicle-battery">
            <span>${vehicle.ev_profile_enabled ? '&#128267;' : '&#9981;'} ${Math.round(batteryPct)}%</span>
            <div class="vehicle-battery-bg"><div class="vehicle-battery-fill" style="width:${Math.max(0, Math.min(100, batteryPct))}%"></div></div>
          </div>` : ''}
        ${hasAdblue ? `
          <div class="vehicle-battery vehicle-adblue">
            <span>&#128167; AdBlue ${Math.round(adblueVal)} ${adblueUnitDet}</span>
            ${!adblueIsKmDet ? `<div class="vehicle-battery-bg"><div class="vehicle-battery-fill adblue-fill" style="width:${Math.max(0, Math.min(100, adblueVal))}%"></div></div>` : ''}
          </div>` : ''}
        <div class="vehicle-section-grid">
          ${renderVehicleSection('Fahrdaten', coreRows)}
          ${renderVehicleSection(vehicle.ev_profile_enabled ? 'E-Antrieb' : 'Antrieb', evRows)}
        </div>
        <div class="vehicle-history-section" id="veh-history-${escapeAttr(vehicle.id)}">
          <div class="vehicle-history-header" onclick="toggleVehicleHistory('${escapeAttr(vehicle.id)}')">
            <span class="vehicle-history-label">&#128205; Verlauf</span>
            <span class="vehicle-history-meta">${history.length} Punkte · 14 Tage</span>
            <span class="vehicle-history-arrow" id="veh-history-arrow-${escapeAttr(vehicle.id)}">&#9660;</span>
          </div>
          <div class="vehicle-history-body" id="veh-history-body-${escapeAttr(vehicle.id)}" style="display:none;"></div>
        </div>
        ${chartSection}
        ${actions.length ? `<div class="vehicle-actions">${actions.join('')}</div>` : ''}
      </div>`;
  }

  // Verlauf-Zustand: unabhängig vom DOM gespeichert → überlebt Re-Renders ohne Race Condition
  const _vehHistCache = {};  // { vehicleId: { open: bool, html: string | null } }

  function _vehHistSave(vehicleId) {
    const body = document.getElementById(`veh-history-body-${vehicleId}`);
    if (!body) return;
    if (!_vehHistCache[vehicleId]) _vehHistCache[vehicleId] = { open: false, html: null };
    _vehHistCache[vehicleId].open = body.style.display !== 'none';
    if (body.children.length > 0) _vehHistCache[vehicleId].html = body.innerHTML;
  }

  function _vehHistRestore(vehicleId) {
    const c = _vehHistCache[vehicleId];
    if (!c?.html) return;
    const body  = document.getElementById(`veh-history-body-${vehicleId}`);
    const arrow = document.getElementById(`veh-history-arrow-${vehicleId}`);
    if (!body) return;
    body.innerHTML = c.html;
    if (c.open) {
      body.style.display = '';
      if (arrow) arrow.classList.add('open');
    }
  }

  async function toggleVehicleHistory(vehicleId) {
    const body  = document.getElementById(`veh-history-body-${vehicleId}`);
    const arrow = document.getElementById(`veh-history-arrow-${vehicleId}`);
    if (!body) return;
    const isOpen = body.style.display !== 'none';
    body.style.display = isOpen ? 'none' : '';
    if (arrow) arrow.classList.toggle('open', !isOpen);
    if (!_vehHistCache[vehicleId]) _vehHistCache[vehicleId] = { open: false, html: null };
    _vehHistCache[vehicleId].open = !isOpen;
    if (isOpen || body.children.length > 0) return;
    try {
      const r = await fetch(`/vehicles/${encodeURIComponent(vehicleId)}/location-history/addresses`);
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      const locs = d.locations || [];
      if (!locs.length) {
        body.innerHTML = '<div style="padding:8px;color:var(--muted);font-size:0.78rem;">Kein Verlauf verfügbar.</div>';
        return;
      }

      // Liste sofort anzeigen (ohne Adressen)
      const _itemId = i => `veh-addr-${vehicleId}-${i}`;
      body.innerHTML = [
        `<div id="veh-addr-progress" style="font-size:0.68rem;color:var(--muted);padding:4px 2px 6px;">
           Lade Adressen 0 / ${locs.length}…
           <div style="height:3px;background:var(--border);border-radius:2px;margin-top:4px;">
             <div id="veh-addr-bar" style="height:3px;background:var(--accent);border-radius:2px;width:0%;transition:width 0.3s;"></div>
           </div>
         </div>`,
        ...locs.map((loc, i) => {
          const from = _fmtLocTime(loc.from);
          const to   = _fmtLocTime(loc.to);
          const dur  = _fmtDuration(loc.duration_minutes);
          const sameDay = from.date === to.date;
          const timeStr = sameDay
            ? `${from.date} · ${from.time} – ${to.time}`
            : `${from.date} ${from.time} – ${to.date} ${to.time}`;
          return `<div class="veh-addr-item" id="${_itemId(i)}">
            <div class="veh-addr-name" id="${_itemId(i)}-addr" style="color:var(--muted);">&#128205; …</div>
            <div class="veh-addr-time">${timeStr}</div>
            ${dur ? `<div class="veh-addr-dur">${dur} · ${loc.point_count} Messpunkte</div>` : ''}
          </div>`;
        }),
      ].join('');

      // Adressen einzeln nachladen
      let done = 0;
      for (let i = 0; i < locs.length; i++) {
        const loc = locs[i];
        const addrEl = document.getElementById(`${_itemId(i)}-addr`);
        try {
          const gr = await fetch(`/vehicles/geocode?lat=${loc.lat}&lon=${loc.lon}`);
          const gd = gr.ok ? await gr.json() : null;
          const addr = gd?.address || `${loc.lat}, ${loc.lon}`;
          if (addrEl) {
            addrEl.textContent = '📍 ' + addr;
            addrEl.style.color = '';
          }
        } catch {
          if (addrEl) { addrEl.textContent = `📍 ${loc.lat}, ${loc.lon}`; addrEl.style.color = ''; }
        }
        done++;
        const bar  = document.getElementById('veh-addr-bar');
        const prog = document.getElementById('veh-addr-progress');
        if (bar)  bar.style.width  = `${Math.round(done / locs.length * 100)}%`;
        if (prog) prog.firstChild.textContent = done < locs.length
          ? `Lade Adressen ${done} / ${locs.length}…`
          : '';
        if (done === locs.length && prog) prog.style.display = 'none';
        // Cache nach jeder Adresse aktualisieren
        _vehHistSave(vehicleId);
      }
    } catch {
      body.innerHTML = '';
    }
  }

  function _fmtLocTime(iso) {
    if (!iso) return { date: '', time: '' };
    try {
      const d = new Date(iso);
      return {
        date: d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' }),
        time: d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }),
      };
    } catch { return { date: '', time: '' }; }
  }

  function _fmtDuration(minutes) {
    if (!minutes || minutes < 2) return '';
    if (minutes < 60) return `${minutes} Min.`;
    const h = Math.floor(minutes / 60), m = minutes % 60;
    return m ? `${h} Std. ${m} Min.` : `${h} Std.`;
  }

  function renderVehicleSection(title, rows) {
    if (!rows.length) return '';
    return `
      <section class="vehicle-section">
        <h3>${escapeHTML(title)}</h3>
        ${rows.map(([label, value]) => `
          <div class="vehicle-fact">
            <span>${escapeHTML(label)}</span>
            <strong>${escapeHTML(value)}</strong>
          </div>`).join('')}
      </section>`;
  }

  function vehicleStateLabel(value) {
    const raw = String(value ?? '').trim();
    const key = raw.toLowerCase();
    const labels = {
      'not_in_charge': 'Nicht am Laden',
      'not charging': 'Nicht am Laden',
      'no_charging': 'Nicht am Laden',
      'charge_stop': 'Laden gestoppt',
      'charge error': 'Ladefehler',
      'charge_error': 'Ladefehler',
      'error': 'Fehler',
      'stopped': 'Gestoppt',
      'off': 'Aus',
      'on': 'An',
      'charging': 'Lädt gerade',
      'in_charge': 'Lädt gerade',
      'charge_in_progress': 'Lädt gerade',
      'plugged_in': 'Angeschlossen',
      'connected': 'Angeschlossen',
      'home': 'Zuhause',
      'not_home': 'Unterwegs',
      'away': 'Unterwegs',
      'unknown': 'Unbekannt',
      'unavailable': 'Nicht verfügbar',
      'active': 'Aktiv',
      'aktiv': 'Aktiv',
    };
    return labels[key] || raw.replaceAll('_', ' ');
  }

  function vehicleChargeStateLabel(value) {
    const key = String(value ?? '').trim().toLowerCase();
    if (['off', 'false', '0', 'not_in_charge', 'not charging', 'no_charging', 'stopped'].includes(key)) return 'Nicht am Laden';
    if (['charge error', 'charge_error', 'error'].includes(key)) return 'Ladefehler';
    if (['on', 'true', '1', 'charging', 'in_charge', 'charge_in_progress'].includes(key)) return 'Lädt gerade';
    return vehicleStateLabel(value);
  }

  function renderVehicleHistoryPanel(vehicle, history) {
    const mapCard = `
      <div class="vehicle-map-card vehicle-map-clickable" onclick="expandVehicleMap()">
        <div id="vehicle-map" class="vehicle-map vehicle-map-widget"></div>
        <div class="vehicle-map-hint">Antippen zum Vergr&ouml;&szlig;ern</div>
      </div>`;
    if (!history.length) {
      return mapCard + '<div class="cal-placeholder">Noch kein Standortverlauf gespeichert.</div>';
    }
    const latest = history[history.length - 1];
    const first = history[0];
    return `
      <div class="vehicle-history-panel">
        ${mapCard}
        <div class="vehicle-history-card">
          <div class="vehicle-history-label">Aktuelle Position</div>
          <div class="vehicle-history-main">${Number(latest.latitude).toFixed(5)}, ${Number(latest.longitude).toFixed(5)}</div>
          <div class="vehicle-history-sub">${formatDateTime(latest.recorded_at)}</div>
        </div>
        <div class="vehicle-history-card">
          <div class="vehicle-history-label">Gespeicherter Verlauf</div>
          <div class="vehicle-history-main">${history.length} Punkte</div>
          <div class="vehicle-history-sub">seit ${formatDateTime(first.recorded_at)}</div>
        </div>
      </div>`;
  }

  async function loadVehicleChargingHistory(vehicleId, period) {
    try {
      const r = await fetch(`/vehicles/${encodeURIComponent(vehicleId)}/charging-history?period=${period}`, { cache: 'no-store' });
      if (!r.ok) return null;
      return await r.json();
    } catch { return null; }
  }

  function _svgChargingLine(labels, minPct, maxPct, capacityKwh, w, h) {
    const pad = { t: 14, r: 8, b: 32, l: 38 };
    const cw = w - pad.l - pad.r;
    const ch = h - pad.t - pad.b;
    const n  = labels.length;
    const xOf = i => pad.l + (cw / Math.max(n - 1, 1)) * i;
    const yOf = pct => pad.t + ch * (1 - pct / 100);

    // Punkte nur wo Daten vorhanden
    const hiPts = [], loPts = [];
    labels.forEach((_, i) => {
      if (maxPct[i] !== null) hiPts.push([xOf(i), yOf(maxPct[i])]);
      if (minPct[i] !== null) loPts.push([xOf(i), yOf(minPct[i])]);
    });

    const polyHi  = hiPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const polyLo  = loPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    // Fläche: hi-Linie vorwärts + lo-Linie rückwärts
    const areaHi  = hiPts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const areaLo  = [...loPts].reverse().map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const area    = areaHi && areaLo ? `${areaHi} ${areaLo}` : '';

    // Y-Achse fix 0–100%
    const yLines = [0, 25, 50, 75, 100].map(pct => {
      const y = yOf(pct);
      return `<line x1="${pad.l}" x2="${w - pad.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"
        stroke="rgba(42,45,85,0.6)" stroke-width="1"/>
        <text x="${(pad.l - 3).toFixed(1)}" y="${(y + 3.5).toFixed(1)}" text-anchor="end"
          font-size="9" fill="rgba(127,141,203,0.8)">${pct}%</text>`;
    }).join('');

    // X-Labels
    const step = Math.max(1, Math.floor(n / 7));
    const lbls = labels.map((l, i) => {
      if (i % step !== 0 && i !== n - 1) return '';
      const anchor = i === n - 1 ? 'end' : i === 0 ? 'start' : 'middle';
      return `<text x="${xOf(i).toFixed(1)}" y="${(h - 6).toFixed(1)}"
        text-anchor="${anchor}" font-size="9" fill="rgba(127,141,203,0.9)">${l}</text>`;
    }).join('');

    // Aktueller Punkt (letzter mit Daten)
    const lastHi = hiPts[hiPts.length - 1];
    const dot = lastHi
      ? `<circle cx="${lastHi[0].toFixed(1)}" cy="${lastHi[1].toFixed(1)}"
           r="4" fill="#00c832" stroke="#050611" stroke-width="2"/>`
      : '';

    // kWh-Label oben rechts
    const kwhLbl = capacityKwh
      ? `<text x="${(w - pad.r).toFixed(1)}" y="${(pad.t - 2).toFixed(1)}"
           text-anchor="end" font-size="8" fill="rgba(127,141,203,0.55)">kWh</text>`
      : '';

    return `<svg width="${w}" height="${h}" style="width:100%;max-width:${w}px;">
      <defs>
        <linearGradient id="chg-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#00c832" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#00c832" stop-opacity="0.03"/>
        </linearGradient>
      </defs>
      ${yLines}
      ${area ? `<polygon points="${area}" fill="url(#chg-grad)"/>` : ''}
      ${polyLo ? `<polyline points="${polyLo}" fill="none" stroke="rgba(0,200,50,0.25)" stroke-width="1" stroke-dasharray="3,3"/>` : ''}
      ${polyHi ? `<polyline points="${polyHi}" fill="none" stroke="#00c832" stroke-width="2" stroke-linejoin="round"/>` : ''}
      ${dot}${lbls}${kwhLbl}
    </svg>`;
  }

  function renderVehicleChargingChart(histData, capacityKwh) {
    if (!histData || !histData.labels?.length) {
      return '<div style="color:var(--muted);font-size:0.78rem;text-align:center;padding:18px 0;">Noch keine Daten — werden beim nächsten Poll gespeichert.</div>';
    }
    const { labels, min_pct, max_pct } = histData;
    return _svgChargingLine(labels, min_pct, max_pct, capacityKwh, 580, 190);
  }

  async function showVehicleChargingTab(vehicleId, period, capacityKwh) {
    const wrap = document.getElementById('veh-chart-inner');
    if (!wrap) return;
    wrap.innerHTML = '<div style="color:var(--muted);font-size:0.78rem;text-align:center;padding:18px 0;">Lade…</div>';
    ['veh-tab-7days','veh-tab-month'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.fontWeight = (id === 'veh-tab-' + period) ? '800' : '400';
      if (el) el.style.color = (id === 'veh-tab-' + period) ? 'var(--accent)' : 'var(--muted)';
    });
    const histData = await loadVehicleChargingHistory(vehicleId, period);
    wrap.innerHTML = renderVehicleChargingChart(histData, capacityKwh);
  }

  function renderVehicleMapExpanded(vehicle, history) {
    return `
      <div class="vehicle-map-expanded-wrap">
        <div class="vehicle-map-expanded-header">
          <div>
            <div class="vehicle-detail-kicker">Karte</div>
            <div class="vehicle-map-expanded-title">${escapeHTML(vehicle.label || vehicle.id)}</div>
          </div>
          <button class="vehicle-map-close" onclick="closeVehicleMapExpanded()">Schliessen</button>
        </div>
        <div id="vehicle-map-expanded" class="vehicle-map vehicle-map-expanded-canvas"></div>
      </div>`;
  }

  function initVehicleMap(vehicle, history, targetId = 'vehicle-map') {
    const el = document.getElementById(targetId);
    if (!el || typeof L === 'undefined') return;
    if (_vehicleMap) {
      _vehicleMap.remove();
      _vehicleMap = null;
    }
    _vehicleRoute = null;
    _vehicleCurrentMarker = null;
    const points = (history || []).map(p => [Number(p.latitude), Number(p.longitude)]).filter(p => Number.isFinite(p[0]) && Number.isFinite(p[1]));
    if (!points.length && vehicle.location) points.push([vehicle.location.latitude, vehicle.location.longitude]);
    if (!points.length) {
      el.innerHTML = '<div class="vehicle-map-empty">Keine Position verfuegbar</div>';
      return;
    }
    const center = points[points.length - 1];
    _vehicleMap = L.map(el, { zoomControl: false, attributionControl: false }).setView(center, 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(_vehicleMap);
    if (points.length > 1) {
      _vehicleRoute = L.polyline(points, { color: '#00d6ff', weight: 4, opacity: 0.8 }).addTo(_vehicleMap);
      _vehicleMap.fitBounds(_vehicleRoute.getBounds(), { padding: [20, 20] });
      points.slice(0, -1).forEach((point, index) => {
        L.marker(point, {
          interactive: false,
          icon: L.divIcon({
            className: 'vehicle-history-marker',
            html: `<span>${index + 1}</span>`,
            iconSize: [22, 22],
            iconAnchor: [11, 11],
          }),
        }).addTo(_vehicleMap);
      });
    }
    _vehicleCurrentMarker = L.marker(center, {
      icon: L.divIcon({ className: 'vehicle-current-marker', html: '<span></span>', iconSize: [24, 24], iconAnchor: [12, 12] })
    }).addTo(_vehicleMap);
    [80, 250, 700].forEach(delay => setTimeout(() => {
      if (!_vehicleMap) return;
      _vehicleMap.invalidateSize();
      if (_vehicleRoute) {
        _vehicleMap.fitBounds(_vehicleRoute.getBounds(), { padding: [20, 20] });
      } else {
        _vehicleMap.setView(center, 14);
      }
    }, delay));
  }

  function selectVehicle(vehicleId) {
    _selectedVehicle = vehicleId;
    _vehicleMapExpanded = false;

  function expandVehicleMap() {

  function formatMinutesAsHHMM(value) {
    const minutes = parseInt(value, 10);
    if (!Number.isFinite(minutes)) return String(value || '');
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  }

  function formatDateTime(value) {
    if (!value) return '';
    try {
      return new Date(value).toLocaleString('de-DE', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    } catch {
      return value;
    }
  }

  // ── CAMERA VIEW ───────────────────────────────────────────
  let _camerasData    = null;
  let _camEventsData  = [];
  let _selectedCamera = null;
  let _camerasInterval = null;

  function _startCamerasPolling() {
    if (_camerasInterval) return;
    _camerasInterval = setInterval(() => _refreshCameraEvents(), 15000); // Nur Events, kein Video-Neustart
  }
  function _stopCamerasPolling() {
    clearInterval(_camerasInterval);
    _camerasInterval = null;
  }

  async function loadCamerasData() {
    try {
      const r = await fetch('/ha/cameras');
      if (!r.ok) return null;
      const d = await r.json();
      _camerasData = d.cameras || [];
      return _camerasData;
    } catch { return null; }
  }

  async function loadCameraEvents() {
    try {
      const r = await fetch('/ha/cameras/events');
      if (!r.ok) return [];
      return (await r.json()).events || [];
    } catch { return []; }
  }

  function _camEventIcon(type) {
    if (type === 'ding')   return '🔔';
    if (type === 'person') return '🧍';
    if (type === 'motion') return '🚶';
    return '📷';
  }

  function _camEventLabel(e) {
    if (e.type === 'ding')   return 'Klingel';
    if (e.type === 'person') return 'Person erkannt';
    if (e.type === 'motion') return e.state === 'on' ? 'Bewegung erkannt' : 'Bewegung beendet';
    if (e.state === 'unavailable') return 'Kamera offline';
    return e.state || 'Ereignis';
  }

  function _relTime(iso) {
    if (!iso) return '';
    const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (diff < 60)  return 'gerade eben';
    if (diff < 3600) return `vor ${Math.floor(diff/60)} Min`;
    if (diff < 86400) return `vor ${Math.floor(diff/3600)} Std`;
    return `vor ${Math.floor(diff/86400)} Tagen`;
  }

  function _formatSnapTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const date = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const time = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    const tz = d.toLocaleTimeString('de-DE', { timeZoneName: 'short' }).split(' ').pop();
    return `${date} ${time} Uhr ${tz}`;
  }

  // Snapshot-Kameras ausblenden — nur Live-Ansichten zeigen
  function _liveCameras(cameras) {
    return (cameras || []).filter(c => !c.entity_id.endsWith('_snapshot'));
  }

  function renderCameraList(cameras) {
    const live = _liveCameras(cameras);
    if (!live.length) return '<div class="cal-placeholder">Keine Kameras</div>';
    const allSel = _selectedCamera === null ? ' selected' : '';
    let html = `<div class="cam-list-item${allSel}" onclick="selectCamera(null)">
      <span style="font-size:1rem;">📷</span>
      <div style="flex:1;font-weight:700;font-size:0.85rem;">Alle Kameras</div>
    </div>`;
    html += live.map(c => {
      const sel  = c.entity_id === _selectedCamera ? ' selected' : '';
      const avail = c.state !== 'unavailable';
      return `<div class="cam-list-item${sel}" onclick="selectCamera('${c.entity_id}')">
        <div class="cam-dot${avail ? '' : ' off'}"></div>
        <div style="flex:1;font-size:0.82rem;font-weight:600;white-space:nowrap;
                    overflow:hidden;text-overflow:ellipsis;">${c.name}</div>
      </div>`;
    }).join('');
    return html;
  }

  // HLS-Stream via Backend (ffmpeg RTSP→HLS)
  function _streamUrl(entityId) { return `/ha/cameras/${entityId}/stream`; }
  function _snapUrl(entityId) { return `/ha/cameras/${entityId}/snapshot?_t=${Date.now()}`; }

  function _attachHls(video, entityId) {
    if (!video) return;
    const url = _streamUrl(entityId);
    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
      const hls = new Hls({
        lowLatencyMode: true,
        liveSyncDurationCount: 2,
        liveMaxLatencyDurationCount: 6,
        // Aggressives Retry bei Fehlern
        fragLoadingMaxRetry: 6,
        manifestLoadingMaxRetry: 4,
        levelLoadingMaxRetry: 4,
        fragLoadingRetryDelay: 1000,
      });
      hls.loadSource(url);
      hls.attachMedia(video);
      video._hls = hls;

      // Error-Recovery: Netzwerk-Fehler → neu laden; Media-Fehler → recovern
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          setTimeout(() => hls.startLoad(), 2000);
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        } else {
          // Letzter Ausweg: HLS neu aufbauen nach 4s
          hls.destroy();
          setTimeout(() => _attachHls(video, entityId), 4000);
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
    }
    video.play().catch(() => {});
  }

  function _destroyAllHls() {
    document.querySelectorAll('video[data-cam-id]').forEach(v => {
      if (v._hls) { v._hls.destroy(); v._hls = null; }
      v.src = '';
    });
  }

  function _camVideo(entityId) {
    return `<video data-cam-id="${entityId}" autoplay muted playsinline></video>`;
  }

  let _camGridMode = (() => { try { return localStorage.getItem('cam_grid_mode') || 'grid2'; } catch { return 'grid2'; } })();

  function setCamGrid(mode) {
    _camGridMode = mode;
    try { localStorage.setItem('cam_grid_mode', mode); } catch {}
    const grid = document.querySelector('.cam-tile-grid');
    if (grid) { grid.classList.toggle('single', mode === 'auto'); }
    document.querySelectorAll('.cam-grid-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  }

  function renderCameraTiles(cameras) {
    const live = _liveCameras(cameras);
    if (!live.length) return '<div class="cal-placeholder">Keine Kameras verfügbar</div>';
    const single = _camGridMode === 'auto';
    return `<div class="cam-tile-wrap">
      <div class="cam-grid-bar">
        <button class="cam-grid-btn${!single ? ' active' : ''}" data-mode="grid2" onclick="setCamGrid('grid2')">⊞ 2-Spalten</button>
        <button class="cam-grid-btn${single  ? ' active' : ''}" data-mode="auto"  onclick="setCamGrid('auto')">⊟ 1-Spalte</button>
      </div>
      <div class="cam-tile-grid${single ? ' single' : ''}">${live.map(c => {
        const ev = _camEventsData.find(e => c.name.toLowerCase().includes(e.name.toLowerCase()) || e.name.toLowerCase().includes(c.name.toLowerCase().split(' ')[0]));
        const badge = ev ? `<span class="cam-tile-badge">${_camEventIcon(ev.type)} ${_relTime(ev.when)}</span>` : '';
        return `<div class="cam-tile" onclick="selectCamera('${c.entity_id}')">
          <img src="${_snapUrl(c.entity_id)}" style="width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block;">
          <div class="cam-tile-label"><span>${c.name}</span>${badge}</div>
        </div>`;
      }).join('')}
      </div>
    </div>`;
  }

  function renderCameraDetail(camera) {
    const isSnap = _isSnapshotCam(camera.entity_id);
    const expandLabel = _cameraExpanded ? '⤡ Kleiner' : '⤢ Groß';
    const _btn = (id, click, label) =>
      `<button ${id ? `id="${id}"` : ''} onclick="${click}"
               style="background:none;border:1px solid var(--border);color:var(--muted);
                      border-radius:6px;padding:3px 10px;font-size:0.72rem;cursor:pointer;
                      white-space:nowrap;transition:color 0.15s,border-color 0.15s;"
               onmouseover="this.style.color='var(--accent)';this.style.borderColor='var(--accent)'"
               onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border)'">${label}</button>`;
    const liveBtn = camera.has_live_stream !== false
      ? `<button onclick="startCameraLive('${camera.entity_id}')"
                 style="position:absolute;bottom:14px;right:14px;
                        background:rgba(0,0,0,0.65);border:1px solid var(--accent);
                        color:var(--accent);border-radius:8px;padding:7px 18px;
                        font-size:0.78rem;font-weight:700;cursor:pointer;letter-spacing:0.05em;">▶ Live</button>`
      : '';
    const mediaHtml = `<div id="cam-media-container" style="flex:1;position:relative;min-height:0;overflow:hidden;">
           <img data-cam-id="${camera.entity_id}" src="${_snapUrl(camera.entity_id)}"
                style="width:100%;height:100%;object-fit:contain;background:#000;display:block;">
           ${liveBtn}
         </div>`;
    const snapTime = _formatSnapTime(camera.last_changed);
    const snapTimeHtml = snapTime
      ? `<div style="padding:0 14px 5px;font-size:0.58rem;color:var(--muted);flex-shrink:0;">
           Aufnahme: ${snapTime}
         </div>`
      : '';
    return `<div class="cam-detail" style="height:100%;display:flex;flex-direction:column;">
      <div style="display:flex;align-items:center;padding:8px 14px 4px;flex-shrink:0;gap:8px;">
        <span style="font-size:0.65rem;color:var(--accent);letter-spacing:0.13em;flex:1;">
          ${camera.name.toUpperCase()}
          <span id="cam-live-status" style="color:${isSnap ? 'var(--muted)' : 'var(--success)'};margin-left:8px;font-size:0.6rem;">
            ${isSnap ? '● Snapshot' : '● Live'}
          </span>
        </span>
        ${_btn('btn-expand-cam', 'toggleExpandCamera()', expandLabel)}
        ${_btn('', `enterCameraFullscreen('${camera.entity_id}')`, '⛶ Vollbild')}
      </div>
      ${snapTimeHtml}
      ${mediaHtml}
    </div>`;
  }

  function _isSnapshotCam(entityId) {
    return !!entityId;
  }

  let _snapRefreshTimer = null;
  function _startSnapRefresh(entityId) {
    _stopSnapRefresh();
    _snapRefreshTimer = setInterval(() => {
      const img = document.querySelector(`img[data-cam-id="${entityId}"]`);
      if (img) img.src = _snapUrl(entityId);
    }, 5000);
  }
  function _stopSnapRefresh() {
    clearInterval(_snapRefreshTimer);
    _snapRefreshTimer = null;
  }
  function _maybeStartSnapRefresh() {
    if (_selectedCamera && _isSnapshotCam(_selectedCamera)) _startSnapRefresh(_selectedCamera);
    else _stopSnapRefresh();
  }

  let _currentLiveEntity = null;

  async function startCameraLive(entityId) {
    _stopSnapRefresh();
    _currentLiveEntity = entityId;
    const mediaEl = document.getElementById('cam-media-container');
    const statusEl = document.getElementById('cam-live-status');
    if (!mediaEl) return;

    if (statusEl) { statusEl.textContent = '⏳ Verbinde…'; statusEl.style.color = 'var(--muted)'; }

    try {
      const r = await fetch(`/ha/cameras/${entityId}/live/start`, { method: 'POST' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const { m3u8_url, timeout_seconds } = await r.json();

      mediaEl.innerHTML = `<div id="cam-live-wrap" style="flex:1;min-height:0;width:100%;height:100%;">${_camVideo(entityId)}</div>`;
      if (statusEl) { statusEl.textContent = '● Live'; statusEl.style.color = 'var(--success)'; }

      const video = document.querySelector(`video[data-cam-id="${entityId}"]`);
      if (video) _attachHlsDirect(video, m3u8_url);

    } catch (e) {
      if (statusEl) { statusEl.textContent = '● Kein Stream'; statusEl.style.color = 'var(--danger)'; }
      mediaEl.innerHTML = `<img src="/ha/cameras/${entityId}/snapshot?_t=${Date.now()}"
        style="width:100%;height:100%;object-fit:contain;background:#000;display:block;">`;
    }
  }

  async function stopCameraLive(entityId) {
    if (!entityId) return;
    const video = document.querySelector(`video[data-cam-id="${entityId}"]`);
    if (video && video._hls) { video._hls.destroy(); video._hls = null; }
    await fetch(`/ha/cameras/${entityId}/live/stop`, { method: 'POST' }).catch(() => {});
    _currentLiveEntity = null;
  }

  // HLS direkt an m3u8_url hängen — kein Auto-Restart bei Fehler
  function _attachHlsDirect(video, m3u8_url) {
    if (!video) return;
    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
      const hls = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 2 });
      video._hls = hls;
      hls.loadSource(m3u8_url);
      hls.attachMedia(video);
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        // Bei fatal Network-Error: KEIN Restart (stream wurde gestoppt)
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = m3u8_url;
    }
    video.play().catch(() => {});
  }

  function _initCameraStreams() {
    document.querySelectorAll('video[data-cam-id]').forEach(v => _attachHls(v, v.dataset.camId));
  }

  let _cameraExpanded = false;

  function toggleExpandCamera() {
    _cameraExpanded = !_cameraExpanded;
    const overlay = document.getElementById('cal-overlay');
    overlay.classList.toggle('cam-expanded', _cameraExpanded);
    const btn = document.getElementById('btn-expand-cam');
    if (btn) btn.textContent = _cameraExpanded ? '⤡ Kleiner' : '⤢ Groß';
  }

  function enterCameraFullscreen(entityId) {
    const video = document.querySelector(`video[data-cam-id="${entityId}"]`);
    if (!video) return;
    const fn = video.requestFullscreen || video.webkitRequestFullscreen || video.mozRequestFullScreen;
    if (fn) fn.call(video);
  }

  function renderCameraEvents(events) {
    if (!events?.length) return '<div class="cal-placeholder">Keine Ereignisse</div>';
    return events.map(e => `
      <div class="cam-event-item">
        <div class="cam-event-icon">${_camEventIcon(e.type)}</div>
        <div>
          <div class="cam-event-name">${e.name} · ${_camEventLabel(e)}</div>
          <div class="cam-event-time">${_relTime(e.when)}</div>
        </div>
      </div>`).join('');
  }

  async function showCamerasView() {
    _selectedCamera = null;
    const [cameras, events] = await Promise.all([loadCamerasData(), loadCameraEvents()]);
    _camEventsData = events || [];
    _renderCamerasView(cameras, events);
    _initCameraStreams();
    _maybeStartSnapRefresh();
  }

  function _renderCamerasView(cameras, events) {
    // Links: Kamera-Liste
    document.getElementById('left-label').textContent = 'Kameras';
    const leftContent = document.getElementById('left-content');
    leftContent.style.overflowY = 'auto';
    leftContent.innerHTML = renderCameraList(cameras || []);

    // Mitte: Overlay
    const overlay = document.getElementById('cal-overlay');
    if (overlay) {
      const cam = cameras?.find(c => c.entity_id === _selectedCamera);
      overlay.innerHTML = cam ? renderCameraDetail(cam) : renderCameraTiles(cameras || []);
      overlay.classList.toggle('active', true);
      overlay.classList.toggle('cam-expanded', _cameraExpanded && !!cam);
    }

    // Rechts: Ereignisse (ID für gezielte Aktualisierung ohne Video-Neustart)
    setPanel('right', 'Letzte Ereignisse', `<div id="cam-events-panel">${renderCameraEvents(events || [])}</div>`);
  }

  async function _refreshCameraEvents() {
    // Nur Events-Liste aktualisieren — Video-Elemente NICHT anfassen
    if (_navMode !== 'cameras') return;
    const events = await loadCameraEvents();
    const rightEl = document.querySelector('.right-panel .panel-content, #right-content');
    const evEl = document.getElementById('cam-events-panel');
    if (evEl) evEl.innerHTML = renderCameraEvents(events || []);
  }

  async function refreshCamerasView() {
    // Nur beim expliziten Kamera-Wechsel aufrufen, nicht beim Polling
    if (_navMode !== 'cameras') return;
    const [cameras, events] = await Promise.all([loadCamerasData(), loadCameraEvents()]);
    _renderCamerasView(cameras, events);
    _initCameraStreams();
    _maybeStartSnapRefresh();
  }

  function selectCamera(entity_id) {
    if (!entity_id) _cameraExpanded = false;
    _destroyAllHls();
    _stopSnapRefresh();
    _selectedCamera = entity_id;
    refreshCamerasView();
  }

  function clearCamerasView() {
    _stopCamerasPolling();
    _destroyAllHls();
    _cameraExpanded = false;
    if (_currentLiveEntity) {
      stopCameraLive(_currentLiveEntity);
    } else {
      fetch('/ha/cameras/stop-all', { method: 'POST' }).catch(() => {});
    }
    const overlay = document.getElementById('cal-overlay');
    if (overlay) { overlay.classList.remove('active', 'cam-expanded'); overlay.innerHTML = ''; }
    document.getElementById('left-content').style.overflowY = '';
  }

  // Tab versteckt → Stream sofort stoppen
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && _navMode === 'cameras') {
      if (_currentLiveEntity) stopCameraLive(_currentLiveEntity);
      else fetch('/ha/cameras/stop-all', { method: 'POST' }).catch(() => {});
    }
  });

  // ── ROBOTER VIEW ──────────────────────────────────────────

  async function loadRobots() {
    try {
      const r = await fetch('/ha/robots');
      if (!r.ok) return null;
      const d = await r.json();
      _robotsData = d.robots || [];
      _robotsData.forEach(r => {

  async function sendRobotCommand(entityId, command) {
    try {
      await fetch(`/ha/robots/${entityId}/command`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command }),
      });
      setTimeout(() => refreshRobotsView(), 1500);
    } catch {}
  }

  function _robotStateLabel(state) {
    return _ROBOT_STATE_LABELS[state] || (typeof _VAC_STATE_DE !== 'undefined' && _VAC_STATE_DE[state]) || state || '–';
  }
  function _robotStateColor(state) {
    return _ROBOT_STATE_COLORS[state] || 'var(--muted)';
  }

  function _formatRobotErrorWhen(whenIso) {
    const d = whenIso ? new Date(whenIso) : null;
    if (!d || Number.isNaN(d.getTime())) return '';
    const date = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    const time = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
    return `${date} ${time}`;
  }

  function renderRobotList(robots) {
    if (!robots?.length) return '<div class="cal-placeholder">Keine Roboter gefunden</div>';
    return robots.map(r => {
      const sel = r.entity_id === _selectedRobot ? ' selected' : '';
      const color = _robotStateColor(r.state);
      return `<div class="robot-list-item${sel}" onclick="selectRobot('${r.entity_id}')">
        <div class="r-dot" style="background:${color};"></div>
        <div style="flex:1;font-size:0.82rem;font-weight:600;">${r.name}</div>
        <div style="font-size:0.68rem;color:${color};">${_robotStateLabel(r.state)}</div>
      </div>`;
    }).join('');
  }

  function renderRobotDetail(robot, errorLog) {
    if (!robot) return '<div class="robot-placeholder">Kein Roboter ausgewählt</div>';
    if (robot.domain === 'vacuum') return renderRobotDetailVacuum(robot);
    if (robot.domain !== 'lawn_mower') {
      return `<div class="robot-detail-wrap">
        <div class="robot-detail-name">${robot.name}</div>
        <div class="robot-placeholder" style="margin-top:20px;">Detailansicht folgt</div>
      </div>`;
    }
    const extras = robot.extras || {};
    const chargingRaw = (extras.ladevorgang?.state || '').toLowerCase();
    const isCharging = ['an','true','1','charging','ja','yes','on'].includes(chargingRaw);
    let stateLabel = _robotStateLabel(robot.state);
    let stateColor = _robotStateColor(robot.state);
    if (robot.state === 'docked' && isCharging) { stateLabel = 'Lädt'; stateColor = 'var(--warning)'; }

    const _cached = _lastKnownBattery[robot.entity_id];
    const battPct = robot.battery != null ? parseInt(robot.battery) : (_cached?.pct ?? null);
    const battStale = robot.battery == null && _cached != null;
    const battColor = battPct == null ? 'var(--muted)' : battPct > 40 ? 'var(--success)' : battPct > 20 ? 'var(--warning)' : 'var(--danger)';
    const battTs = battStale && _cached?.ts
      ? (() => { const d = _cached.ts; return `${d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})} ${d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr`; })()
      : null;
    const battHtml = battPct != null
      ? `<div class="robot-battery-bar-wrap">
           <span style="min-width:52px;font-weight:700;color:${battColor};">🔋 ${battPct}%${battStale ? ' *' : ''}</span>
           <div class="robot-battery-bar-bg"><div class="robot-battery-bar-fill" style="width:${battPct}%;background:${battColor};"></div></div>
           ${battTs ? `<div style="font-size:0.65rem;color:var(--muted);margin-top:3px;">* Letzter Wert: ${battTs}</div>` : ''}
         </div>`
      : '<div style="color:var(--muted);font-size:0.75rem;">Batteriestand nicht verfügbar</div>';

    const isActive = ['mowing','edgecut','returning'].includes(robot.state);
    const primaryBtn = isActive
      ? `<button class="robot-action-btn" onclick="sendRobotCommand('${robot.entity_id}','pause')">⏸ Pause</button>`
      : `<button class="robot-action-btn" onclick="sendRobotCommand('${robot.entity_id}','start_mowing')">▶ Mähen</button>`;
    const dockBtn = robot.state !== 'docked'
      ? `<button class="robot-action-btn" onclick="sendRobotCommand('${robot.entity_id}','dock')">🏠 Basis</button>` : '';

    const errEntries = Array.isArray(errorLog?.entries) ? errorLog.entries : [];
    const errHtml = errEntries.length
      ? errEntries.map(e => {
          const t = _formatRobotErrorWhen(e.when);
          const cls = e.severity || (e.resolved ? 'ok' : 'error');
          return `<div class="robot-err-log-item">
            <span class="robot-err-time">${t}</span>
            <span class="robot-err-state ${cls}">${e.state}</span>
          </div>`;
        }).join('')
      : '<div style="color:var(--muted);font-size:0.74rem;" id="robot-err-loading">Lade…</div>';

    return `<div class="robot-detail-wrap">
      <div class="robot-detail-name">${robot.name}</div>
      <span class="robot-status-badge" style="color:${stateColor};border-color:${stateColor};">${stateLabel}</span>
      ${battHtml}
      <div class="robot-actions">${primaryBtn}${dockBtn}</div>
      <div>
        <div class="panel-label" style="margin-bottom:6px;">Statusprotokoll (letzte 20)</div>
        <div class="robot-error-list" id="robot-err-list">${errHtml}</div>
      </div>
    </div>`;
  }

  function _formatRuntime(hoursStr) {
    const h = parseFloat(hoursStr);
    if (isNaN(h)) return hoursStr;
    const totalH = Math.round(h);
    const days   = Math.floor(h / 24);
    const remH   = Math.floor(h % 24);
    const mins   = Math.round((h - Math.floor(h)) * 60);
    return `${totalH} h · ${days} Tage, ${remH} Std, ${mins} Min`;
  }

  function renderRobotExtras(robot) {
    const extras = robot?.extras || {};
    const rows = [
      { key: 'taglicher_fortschritt',        label: 'Tagesfortschritt' },
      { key: 'batterietemperatur',            label: 'Batterietemperatur' },
      { key: 'batteriespannung',              label: 'Batteriespannung' },
      { key: 'verbleibende_regenverzogerung', label: 'Regenverzögerung' },
      { key: 'gesamte_laufzeit_des_mahers',   label: 'Gesamtlaufzeit', fmt: _formatRuntime },
      { key: 'batterieladezyklen_gesamt',     label: 'Ladezyklen' },
      { key: 'signalstarke',                  label: 'Signalstärke' },
    ].filter(r => extras[r.key]);
    if (!rows.length) return '<div class="cal-placeholder">Keine Sensordaten</div>';
    return rows.map(r => {
      const s = extras[r.key];
      const val = r.fmt ? r.fmt(s.state) : `${s.state}${s.unit ? ' '+s.unit : ''}`;
      return `<div class="robot-sensor-row">
        <span class="robot-sensor-label">${r.label}</span>
        <span class="robot-sensor-value">${val}</span>
      </div>`;
    }).join('');
  }

  // ── VACUUM (Krümel Knecht / Carsten) ─────────────────────
  const _VAC_STATE_DE = {
    'idle': 'Bereit', 'docked': 'In der Basis',
    'charging': 'Lädt', 'charging_completed': 'Geladen',
    'cleaning': 'Reinigt', 'segment_cleaning': 'Raumreinigung',
    'zone_cleaning': 'Zonenreinigung', 'spot_cleaning': 'Punktreinigung',
    'paused': 'Pausiert', 'returning': 'Kehrt zurück',
    'returning_to_charge': 'Kehrt zur Basis',
    'returning_to_wash': 'Kehrt zum Waschen',
    'error': 'Fehler', 'moving': 'Bewegt sich', 'mapping': 'Kartiert',
    // Dreame / Valetudo Zustände
    'sweeping': 'Saugt', 'mopping': 'Wischt', 'washing': 'Pads waschen',
    'sweeping_and_mopping': 'Saugen & Wischen',
    'sweeping_then_mopping': 'Saugen, dann Wischen',
    'drying': 'Pads trocknen', 'self_cleaning': 'Selbstreinigung',
    'emptying': 'Entleert', 'sleeping': 'Standby', 'standby': 'Standby',

  };
